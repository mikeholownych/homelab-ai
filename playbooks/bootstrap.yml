---
- name: Bootstrap Ubuntu access baseline
  hosts: ai_hosts
  gather_facts: false
  tags:
    - bootstrap
    - foundation
  pre_tasks:
    - name: Validate raw Ubuntu release before mutation
      ansible.builtin.raw: >-
        set -eu;
        . /etc/os-release;
        case "${ID}:${VERSION_ID}:${VERSION_CODENAME}" in
          ubuntu:24.04:noble|ubuntu:26.04:resolute) exit 0 ;;
          *) printf 'unsupported platform: %s:%s:%s\n' "$ID" "$VERSION_ID" "$VERSION_CODENAME" >&2; exit 42 ;;
        esac
      changed_when: false

    - name: Install minimal Python serialization prerequisites via raw SSH execution
      ansible.builtin.raw: >-
        test -e /usr/bin/python3 &&
        python3 -c 'import yaml, jsonschema' 2>/dev/null ||
        (DEBIAN_FRONTEND=noninteractive apt-get update -y &&
         DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
         python3-minimal python3-pip python3-yaml python3-jsonschema)
      changed_when: false
      tags:
        - bootstrap
        - foundation

    - name: Gather facts after python prerequisites are guaranteed
      ansible.builtin.setup:
      tags:
        - bootstrap
        - foundation

    - name: Validate supported Ubuntu bootstrap target
      ansible.builtin.assert:
        that:
          - not baseline_platform_guard_enabled | bool or ansible_facts.distribution == "Ubuntu"
          - not baseline_platform_guard_enabled | bool or ansible_facts.distribution_version in supported_platforms
          - >-
            not baseline_platform_guard_enabled | bool
            or ansible_facts.distribution_release
            == supported_platforms[ansible_facts.distribution_version].codename
        fail_msg: >-
          Bootstrap is supported only for declared Ubuntu releases with a matching
          codename unless the localhost-safe fact-check override is enabled.
      vars:
        baseline_platform_guard_enabled: "{{ not (baseline_skip_platform_guard | default(false) | bool) }}"
      tags:
        - bootstrap
        - foundation
        - validation
  tasks:
    - name: Include base OS bootstrap role
      ansible.builtin.include_role:
        name: base_os
      vars:
        base_os_phase: bootstrap
      tags:
        - bootstrap
        - baseline
        - foundation
        - users
        - ssh

    - name: Include time synchronization bootstrap role
      ansible.builtin.include_role:
        name: time_sync
      tags:
        - bootstrap
        - baseline
        - foundation

    - name: Include local user bootstrap role
      ansible.builtin.include_role:
        name: users
      tags:
        - bootstrap
        - users
        - foundation

    - name: Include SSH bootstrap role
      ansible.builtin.include_role:
        name: ssh
      tags:
        - bootstrap
        - ssh
        - foundation

    - name: Include vault bootstrap contract when vault_bootstrap_validate_credentials is enabled
      ansible.builtin.include_role:
        name: vault_integration
      vars:
        vault_integration_operation: bootstrap
      when:
        - vault_integration_bootstrap_validate_credentials | default(false) | bool
          or vault_integration_bootstrap_configure_references | default(false) | bool
      tags:
        - bootstrap
        - vault
        - foundation
