---
# llama_cpp transition: updates the runtime to the requested version.
# For containerized deployments, transition_target_version is a pinned sha256 image digest.
# For legacy bare-metal deployments, rebuilds the pinned source at the registry git commit.
- name: Determine llama.cpp runtime deployment model
  ansible.builtin.set_fact:
    _llama_is_container: "{{ llama_cpp_container_enabled | default(false) | bool }}"

- name: Containerized llama.cpp transition
  when: _llama_is_container | bool
  block:
    - name: Validate container image digest format
      ansible.builtin.assert:
        that:
          - transition_target_version is match("^sha256:[0-9a-f]{64}$")
        fail_msg: >-
          Containerized llama_cpp requires an exact sha256 image digest;
          {{ transition_target_version }} is invalid.

    - name: Update container image digest
      ansible.builtin.set_fact:
        llama_cpp_container_digest: "{{ transition_target_version }}"

    - name: Converge containerized workers onto new image digest
      ansible.builtin.include_role:
        name: llama_cpp_container

- name: Legacy bare-metal llama.cpp transition
  when: not (_llama_is_container | bool)
  block:
    - name: Validate that the target version is a full commit
      ansible.builtin.assert:
        that:
          - transition_target_version is match("^[0-9a-f]{40}$")
        fail_msg: >-
          llama_cpp registry entries must hold exact 40-character commits;
          {{ transition_target_version }} is not one.

    - name: Rebuild llama.cpp at the target commit
      ansible.builtin.include_role:
        name: llama_cpp_sycl
      vars:
        llama_cpp_sycl_install_enabled: true
        llama_cpp_sycl_git_commit: "{{ transition_target_version }}"
        llama_cpp_sycl_force_rebuild: true

    - name: Restart the fallback service onto the new binary
      ansible.builtin.systemd_service:
        name: llama-server.service
        state: restarted
      when:
        - llama_cpp_sycl_service_enabled | bool
