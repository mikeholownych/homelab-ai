---
# R4 candidate lifecycle (docs/design/03): lend one GPU to a candidate model for qualification through the gateway.
#
#   ansible-playbook -i inventory/production playbooks/candidate.yml -e candidate=<profile>            # deploy
#   ansible-playbook -i inventory/production playbooks/candidate.yml -e candidate=<profile> -e candidate_state=absent
#
# Deploy: the production worker named by the profile's `replaces` is drained through the gateway and stopped, the
# candidate worker starts on that GPU, and the gateway registers it as role=candidate in its own pool, reachable only
# through the qualification-scoped alias `candidate/<profile>`. Absent: the candidate is removed and the production
# worker returns (and is undrained). Qualification itself runs from a remote client through the gateway; nothing here
# sends inference work.
- name: Lend a GPU to a candidate model (or return it)
  hosts: inference
  gather_facts: true
  become: true
  vars:
    candidate_state: present
    _candidate_profile: "{{ llama_cpp_container_candidate_profiles.get(candidate | default(''), {}) }}"
    _candidate_reasoning_budget: >-
      {{ candidate_reasoning_budget | default(_candidate_profile.reasoning_budget | default(4096)) | int }}
  pre_tasks:
    - name: Require a declared candidate profile
      ansible.builtin.assert:
        that:
          - candidate is defined
          - candidate in llama_cpp_container_candidate_profiles
          - candidate_state in ['present', 'absent']
          - _candidate_profile.replaces | default('') in llama_cpp_container_workers
          - _candidate_profile.worker is defined
          - _candidate_profile.gateway_worker is defined
          - _candidate_reasoning_budget | int > 0
          - _candidate_reasoning_budget | int <= 32768
        fail_msg: "Unknown candidate profile; declared: {{ llama_cpp_container_candidate_profiles.keys() | list }}"

    - name: Drill a blocked restoration before changing production configuration
      ansible.builtin.fail:
        msg: candidate_drill_fail_restore is set; durable recovery must retain ownership
      when:
        - candidate_state == 'absent'
        - candidate_drill_fail_restore | default(false) | bool

    - name: Remember the production configuration (restored if the swap fails part-way)
      ansible.builtin.set_fact:
        _candidate_production:
          llama_cpp_container_workers: "{{ llama_cpp_container_workers }}"
          orchestrator_gateway_workers: "{{ orchestrator_gateway_workers }}"
          orchestrator_gateway_model_aliases: "{{ orchestrator_gateway_model_aliases }}"

    - name: Merge the candidate into the worker and gateway configuration
      ansible.builtin.set_fact:
        llama_cpp_container_workers: >-
          {{ llama_cpp_container_workers
             | combine({_candidate_profile.replaces:
                          llama_cpp_container_workers[_candidate_profile.replaces] | combine({'state': 'stopped'}),
                        'candidate-' ~ candidate:
                          _candidate_profile.worker | combine({'reasoning_budget': _candidate_reasoning_budget})}) }}
        orchestrator_gateway_workers: >-
          {{ (orchestrator_gateway_workers
             | selectattr('worker_id', 'equalto', _candidate_profile.replaces_gateway_worker_id)
             | map('combine', {'state': 'stopped', 'status': 'stopped'})
             | list)
             + (orchestrator_gateway_workers
                | rejectattr('worker_id', 'equalto', _candidate_profile.replaces_gateway_worker_id)
                | list)
             + [_candidate_profile.gateway_worker
                | combine({'role': 'candidate', 'reasoning_budget': _candidate_reasoning_budget})] }}
        orchestrator_gateway_model_aliases: >-
          {{ orchestrator_gateway_model_aliases
             | combine({'candidate/' ~ candidate: {
                 'pool': _candidate_profile.gateway_worker.pool,
                 'scope': 'qualification',
                 'reasoning': {'mode': 'on', 'budget': _candidate_reasoning_budget, 'answer_allowance': 8192}
               }}) }}
      when: candidate_state == 'present'
  tasks:
    # A swap can fail after the production worker is already stopped (2026-10-10: the lead pool stayed down until fixed
    # by hand). Any failure converges the production configuration again, then still fails the run.
    - name: Converge the swap; on failure restore production capacity
      block:
        - name: Converge the inference policy
          ansible.builtin.include_role:
            name: inference_policy
          when: inference_policy_enabled | default(false) | bool
        - name: Converge the workers
          ansible.builtin.include_role:
            name: llama_cpp_container
        - name: Drill a failure after the worker swap before gateway convergence
          ansible.builtin.fail:
            msg: candidate_drill_fail_after_workers is set
          when: candidate_drill_fail_after_workers | default(false) | bool
        - name: Converge the gateway
          ansible.builtin.include_role:
            name: orchestrator_gateway
        # Drill hook (default off): fail after the swap fully converged, a demanding recovery case; partial-swap
        # failures can leave other states behind and are not proven by this drill.
        - name: Drill a failure after the swap
          ansible.builtin.fail:
            msg: candidate_drill_fail_after_swap is set
          when: candidate_drill_fail_after_swap | default(false) | bool
      rescue:
        - name: Return to the production configuration
          ansible.builtin.set_fact:
            llama_cpp_container_workers: "{{ _candidate_production.llama_cpp_container_workers }}"
            orchestrator_gateway_workers: "{{ _candidate_production.orchestrator_gateway_workers }}"
            orchestrator_gateway_model_aliases: "{{ _candidate_production.orchestrator_gateway_model_aliases }}"
            _candidate_failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
        - name: Restore the production workers
          ansible.builtin.include_role:
            name: llama_cpp_container
        - name: Restore the production gateway configuration
          ansible.builtin.include_role:
            name: orchestrator_gateway
        - name: Report the failed swap (production restored)
          ansible.builtin.fail:
            msg: >-
              Candidate {{ candidate }} ({{ candidate_state }}) failed at "{{ _candidate_failed_task }}"; the production
              configuration was converged again. Fix the cause before retrying.
