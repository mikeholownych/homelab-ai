---
- name: Assess host configuration drift
  hosts: ai_hosts
  gather_facts: true
  become: true
  tags:
    - drift
    - validation
    - operations
  tasks:
    - name: Run hardware discovery for drift check
      ansible.builtin.include_role:
        name: hardware_inventory
      tags: [drift, inventory]

    - name: Run hardware validation for drift check
      ansible.builtin.include_role:
        name: hardware_validation
      tags: [drift, hardware]

    - name: Detect OS tuning drift without mutation
      ansible.builtin.include_role:
        name: os_tuning
      vars:
        os_tuning_apply_mutations: false
        os_tuning_install_discovery_packages: false
      tags: [drift, tuning]

    - name: Run independent validation aggregation
      ansible.builtin.include_role:
        name: validation
      tags: [drift, validation]

    - name: Read validation outcome from the managed node
      ansible.builtin.slurp:
        src: /var/lib/aihost/evidence/validation.json
      register: drift_check_validation_raw
      check_mode: false
      failed_when: false
      tags: [drift]

    - name: Decode validation outcome for drift classification
      ansible.builtin.set_fact:
        validation_document: >-
          {{ drift_check_validation_raw.content | default('e30=') | b64decode | from_json }}
      tags: [drift]

    - name: Classify coarse drift state from validation outcome
      ansible.builtin.set_fact:
        drift_classification: >-
          {{ validation_document | aihost_drift_classify(os_tuning_numa_stability | default('PASS')) }}
      tags: [drift]

    - name: Persist machine-readable drift status artifact
      ansible.builtin.copy:
        content: "{{ {'schema_version': '1.0.0',
                       'classification': drift_classification,
                       'validation_status': validation_document.status | default('NOT_TESTED'),
                       'validation_evidence_present': drift_check_validation_raw.content | default('') != '',
                       'active_tuning_profile': os_tuning_config.profile_name | default('unknown'),
                       'numa_stability': os_tuning_numa_stability | default('unknown'),
                       'generated_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')} | to_nice_json }}\n"
        dest: "/var/lib/aihost/evidence/manual/drift-status.json"
        owner: root
        group: root
        mode: "0640"
      tags: [drift]

    - name: Locate the alert hook for drift notification
      ansible.builtin.stat:
        path: "{{ monitoring_alert_script_path | default('/usr/local/libexec/local-ai-alert') }}"
      register: drift_alert_hook_stat
      tags: [drift]

    - name: Notify operator on blocking or indeterminate drift
      ansible.builtin.command:
        argv:
          - "{{ monitoring_alert_script_path | default('/usr/local/libexec/local-ai-alert') }}"
          - aihost-drift-check
          - "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      changed_when: false
      failed_when: false
      when:
        - drift_classification in ['blocking_drift', 'unknown_drift']
        - drift_alert_hook_stat.stat.exists | bool
      tags: [drift, alerts]

    - name: Report drift assessment status
      ansible.builtin.debug:
        msg:
          assessment: "Drift assessment complete. Validation result recorded in evidence."
          classification: "{{ drift_classification }}"
          active_tuning_profile: "{{ os_tuning_config.profile_name | default('unknown') }}"
          tuning_numa_stability: "{{ os_tuning_numa_stability | default('unknown') }}"
      tags: [drift]
