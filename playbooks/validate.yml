---
- name: Independently validate host state
  hosts: ai_hosts
  gather_facts: true
  become: true
  tags:
    - validation
    - hardware
    - runtime
    - operations
  roles:
    - role: hardware_inventory
      tags: [validation, inventory, hardware]
    - role: hardware_validation
      tags: [validation, hardware]
    - role: os_tuning
      tags: [validation, tuning, operations]
  vars:
    os_tuning_apply_mutations: false
    os_tuning_install_discovery_packages: false
  post_tasks:
    - name: Run independent validation aggregation after tuning discovery
      ansible.builtin.include_role:
        name: validation
      tags: [validation, runtime, operations]
