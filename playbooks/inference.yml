---
# Scoped convergence of the inference-serving stack only (vLLM workers and the
# orchestrator gateway). Unlike site.yml this does not touch OS tuning, kernel,
# users, SSH, or firewall state, so it is the safe way to apply serving changes.
# Static role inclusion is used so --tags selects the roles' inner tasks too.
- name: Converge inference serving stack
  hosts: inference
  gather_facts: true
  become: true
  roles:
    - role: vllm_xpu
      when:
        - capabilities.gpu | default(false) | bool
        - capabilities.inference | default(false) | bool
      tags: [inference, runtime, vllm]
    - role: xpu_smi_log_filter
      when: capabilities.gpu | default(false) | bool
      tags: [inference, logging, xpu_log]
    - role: llama_cpp_container
      when:
        - capabilities.gpu | default(false) | bool
        - capabilities.inference | default(false) | bool
        - llama_cpp_container_enabled | default(false) | bool
      tags: [inference, runtime, llama]
    - role: orchestrator_gateway
      when:
        - capabilities.inference | default(false) | bool
        - orchestrator_gateway_enabled | default(false) | bool
      tags: [inference, runtime, orchestrator]
    - role: vllm_top_console
      when: capabilities.gpu | default(false) | bool
      tags: [inference, monitoring, console]
    - role: test_tooling
      when: capabilities.inference | default(false) | bool
      tags: [inference, tooling, pytest]
    # Scheduled lifecycle timers. Declared here (all disabled in host_vars) so a timer that cannot run
    # safely is reproducibly off instead of silently failing and alerting.
    - role: scheduled_ansible
      tags: [inference, operations, scheduled_ansible]
    - role: node_exporter
      when: node_exporter_enabled | default(false) | bool
      tags: [inference, monitoring, node_exporter]
    - role: boot_network_wait
      when: boot_network_wait_optional_interfaces | default([]) | length > 0
      tags: [inference, operations, boot_network]
    # Host textfile metrics writer (GPU thermals, energy, GT activity) and its thermal alert hook.
    - role: monitoring
      when: features.monitoring | default(false) | bool
      tags: [inference, monitoring, telemetry]
