---
# Scoped convergence of inference serving, its service identities, and the
# inventory-driven worker/gateway network policy.
# Static role inclusion is used so --tags selects the roles' inner tasks too.
- name: Converge inference serving stack
  hosts: inference
  gather_facts: true
  become: true
  pre_tasks:
    # A live R4 candidate is owned by playbooks/candidate.yml. This play would drop it from the gateway (or, with the
    # llama role, stop it mid-qualification) without saying so; refuse and name the command that keeps or ends it.
    - name: Read service states
      ansible.builtin.service_facts:
      tags: [inference, runtime, llama, orchestrator, security, inference_policy]

    - name: Refuse to change serving while a candidate holds a GPU
      vars:
        inference_active_candidates: >-
          {{ ansible_facts.services | dict2items
             | selectattr('key', 'match', '^aihost-llama-candidate-.*[.]service$')
             | selectattr('value.state', 'equalto', 'running') | map(attribute='key') | list }}
      ansible.builtin.assert:
        that: inference_active_candidates | length == 0
        fail_msg: >-
          Active candidate {{ inference_active_candidates }}.
          Re-apply it with playbooks/candidate.yml -e candidate=<profile>, or end it with
          -e candidate_state=absent, before converging serving with this play.
      tags: [inference, runtime, llama, orchestrator, security, inference_policy]
  roles:
    - role: users
      tags: [inference, users]
    - role: inference_origin
      when: inference_origin_retire_onhost_tools | default(false) | bool
      tags: [inference, security, inference_origin]
    - role: inference_policy
      when: inference_policy_enabled | default(false) | bool
      tags: [inference, security, inference_policy]
    - role: xpu_smi_log_filter
      when: capabilities.gpu | default(false) | bool
      tags: [inference, logging, xpu_log]
    - role: llama_cpp_container
      when:
        - capabilities.gpu | default(false) | bool
        - capabilities.inference | default(false) | bool
        - llama_cpp_container_enabled | default(false) | bool
      tags: [inference, runtime, llama]
    - role: orchestrator_gateway
      when:
        - capabilities.inference | default(false) | bool
        - orchestrator_gateway_enabled | default(false) | bool
      tags: [inference, runtime, orchestrator]
    - role: vllm_top_console
      when: capabilities.gpu | default(false) | bool
      tags: [inference, monitoring, console]
    - role: test_tooling
      when: capabilities.inference | default(false) | bool
      tags: [inference, tooling, pytest]
    # Scheduled lifecycle timers. Declared here (all disabled in host_vars) so a timer that cannot run
    # safely is reproducibly off instead of silently failing and alerting.
    - role: scheduled_ansible
      tags: [inference, operations, scheduled_ansible]
    - role: node_exporter
      when: node_exporter_enabled | default(false) | bool
      tags: [inference, monitoring, node_exporter]
    - role: boot_network_wait
      when: boot_network_wait_optional_interfaces | default([]) | length > 0
      tags: [inference, operations, boot_network]
    # Host textfile metrics writer (GPU thermals, energy, GT activity) and its thermal alert hook.
    - role: monitoring
      when: features.monitoring | default(false) | bool
      tags: [inference, monitoring, telemetry]
