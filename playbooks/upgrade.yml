---
# Controlled component transitions. The Git-committed lifecycle registry
# (group_vars/gpu.yml + policies/upgrades.yml) is the sole authority:
#
#   upgrade  -> requested version MUST equal the committed `candidate`
#   rollback -> target is the recorded `previous_known_good`
#
# This playbook never invents versions and never edits Git state. It applies
# the transition, restarts the affected service, validates, and records a
# machine-readable transition artifact.
- name: Controlled component upgrade and rollback
  hosts: ai_hosts
  gather_facts: true
  become: true
  tags:
    - upgrade
    - rollback
    - lifecycle
    - operations
  vars:
    upgrade_component: null
    upgrade_version: null
    upgrade_mode: "upgrade" # or "rollback"
    upgrade_policy_file: "{{ playbook_dir }}/../policies/upgrades.yml"
    upgrade_lifecycle_file: "{{ playbook_dir }}/../inventory/production/group_vars/gpu.yml"
    upgrade_evidence_dir: >-
      {{ lookup('ansible.builtin.env', 'LOCAL_AI_EVIDENCE_RUN_DIR')
         | default('/var/lib/aihost/evidence/manual', true) }}

  tasks:
    - name: Load upgrade policy definitions
      ansible.builtin.set_fact:
        upgrade_policy: "{{ lookup('ansible.builtin.file', upgrade_policy_file) | from_yaml }}"
      tags: [upgrade, rollback]

    - name: Load the committed runtime lifecycle registry
      ansible.builtin.include_vars:
        file: "{{ upgrade_lifecycle_file }}"
        name: upgrade_lifecycle_raw
      tags: [upgrade, rollback]

    - name: Validate upgrade inputs against the registry
      ansible.builtin.assert:
        that:
          - upgrade_component is string
          - upgrade_component in (upgrade_policy.lifecycle_components.keys() | list)
          - upgrade_lifecycle_raw.runtime_profiles[upgrade_component] is defined
          - upgrade_mode in ['upgrade', 'rollback']
          - upgrade_mode == 'rollback' or (upgrade_version | default('')) | length > 0
        fail_msg: >-
          upgrade requires a registered component, a valid mode, and an explicit
          version for upgrades.
      tags: [upgrade, rollback]

    - name: Resolve the registry entry for this component
      ansible.builtin.set_fact:
        upgrade_registry_entry: "{{ upgrade_lifecycle_raw.runtime_profiles[upgrade_component] }}"
      tags: [upgrade, rollback]

    # Commissioning gate: readiness derives from on-host commissioning evidence,
    # never from hand-edited registry pins. Live validators auto-grant physical
    # acceptance on a physical pass; commission.yml persists phase checkpoints
    # on success. The Git-committed `candidate` / `previous_known_good` remain
    # the version authorization below, while a null `current` no longer blocks.
    - name: Resolve on-host commissioning evidence path for this component
      ansible.builtin.set_fact:
        upgrade_commission_evidence_path: >-
          {{ {
            'pytorch_xpu': '/var/lib/local-ai/evidence/xpu-validation.json',
            'vllm': '/var/lib/aihost/evidence/vllm_validation.json',
            'llama_cpp': '/var/lib/aihost/evidence/llama_validation.json',
            'intel_gpu': '/var/lib/local-ai/evidence/checkpoints/gpu_validation.json',
            'level_zero': '/var/lib/local-ai/evidence/checkpoints/gpu_validation.json',
            'kernel': '/var/lib/local-ai/evidence/checkpoints/preflight.json',
            'firmware_bios': '/var/lib/local-ai/evidence/checkpoints/omix.json'
          }[upgrade_component] }}
      tags: [upgrade, rollback]

    - name: Stat the commissioning evidence for {{ upgrade_component }}
      ansible.builtin.stat:
        path: "{{ upgrade_commission_evidence_path }}"
      register: upgrade_commission_stat
      tags: [upgrade, rollback]

    - name: Refuse transitions when commissioning evidence is absent
      ansible.builtin.fail:
        msg: >-
          Component {{ upgrade_component }} has no commissioning evidence at
          {{ upgrade_commission_evidence_path }}. Readiness is derived from live
          observation, not registry pins: run playbooks/commission.yml (or the
          validate.yml flow) so this host records a physical acceptance before
          attempting a transition.
      when: not upgrade_commission_stat.stat.exists
      tags: [upgrade, rollback]

    - name: Read commissioning evidence for {{ upgrade_component }}
      ansible.builtin.slurp:
        src: "{{ upgrade_commission_evidence_path }}"
      register: upgrade_commission_slurp
      tags: [upgrade, rollback]

    - name: Decode commissioning evidence document
      ansible.builtin.set_fact:
        upgrade_commission_doc: "{{ upgrade_commission_slurp.content | b64decode | from_json }}"
      tags: [upgrade, rollback]

    - name: Require commissioning evidence to be a structured document
      ansible.builtin.assert:
        that:
          - upgrade_commission_doc is mapping
        fail_msg: >-
          Commissioning evidence at {{ upgrade_commission_evidence_path }} is not
          machine-readable. Re-run commissioning to regenerate it.
      tags: [upgrade, rollback]

    - name: Refuse transitions when commissioning evidence does not record a physical acceptance
      ansible.builtin.fail:
        msg: >-
          Component {{ upgrade_component }} commissioning evidence at
          {{ upgrade_commission_evidence_path }} recorded status
          {{ upgrade_commission_doc.status | default('missing') }}
          {{ 'without physical acceptance.'
             if (upgrade_commission_doc.physical_acceptance is defined
                 and not (upgrade_commission_doc.physical_acceptance | bool))
             else 'on the host.' }} Re-run live commissioning so a physical pass
          grants acceptance; evidence is never overridden by editing registry pins.
      when: >-
        (upgrade_commission_doc.status | default('missing')) not in ['pass', 'PASS']
        or (upgrade_commission_doc.physical_acceptance is defined
            and not (upgrade_commission_doc.physical_acceptance | bool))
        or (upgrade_commission_doc.simulated is defined
            and (upgrade_commission_doc.simulated | bool))
      tags: [upgrade, rollback]

    - name: Resolve the transition target version
      ansible.builtin.set_fact:
        upgrade_target_version: >-
          {{ (upgrade_registry_entry.candidate if upgrade_mode == 'upgrade'
             else upgrade_registry_entry.previous_known_good) }}
      tags: [upgrade, rollback]

    - name: Enforce that the request matches the Git-committed authorization
      ansible.builtin.assert:
        that:
          - upgrade_mode == 'rollback' or (upgrade_version == upgrade_target_version)
        fail_msg: >-
          Requested version {{ upgrade_version | default('none') }} does not equal the committed
          candidate {{ upgrade_target_version }}. Change of version requires a Git commit to the
          lifecycle registry; that commit is the authorization point.
      tags: [upgrade, rollback]

    - name: Apply the component-specific transition
      ansible.builtin.include_tasks: "{{ playbook_dir }}/upgrades/transition_{{ upgrade_component }}.yml"
      vars:
        transition_target_version: "{{ upgrade_target_version }}"
      when: not ansible_check_mode
      tags: [upgrade, rollback]

- name: Independent validation after the transition
  import_playbook: validate.yml

- name: Record the completed transition artifact
  hosts: ai_hosts
  gather_facts: false
  become: true
  tasks:
    - name: Persist upgrade transition evidence
      ansible.builtin.copy:
        content: "{{ {'schema_version': '1.0.0',
                       'component': upgrade_component,
                       'mode': upgrade_mode,
                       'from_version': upgrade_registry_entry.current | default('unknown'),
                       'to_version': upgrade_target_version,
                       'authorized_by_commit': git_commit_sha | default('unknown'),
                       'completed_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')} | to_nice_json }}\n"
        dest: "{{ upgrade_evidence_dir }}/upgrade-transition.json"
        owner: root
        group: root
        mode: "0640"
      tags: [upgrade, rollback]
