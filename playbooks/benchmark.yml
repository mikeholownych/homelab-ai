---
- name: Execute inference performance benchmarks
  hosts: ai_hosts
  gather_facts: true
  become: true
  tags:
    - benchmark
    - operations
  vars:
    benchmark_profile: "small"
  tasks:
    - name: Run benchmark role
      ansible.builtin.include_role:
        name: benchmarking
      vars:
        benchmarking_active_profile: "{{ benchmark_profile }}"
      tags: [benchmark]
