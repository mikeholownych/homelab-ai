---
- name: Import baseline playbook
  import_playbook: baseline.yml

- name: Converge optional host services
  hosts: ai_hosts
  gather_facts: true
  tags:
    - site
    - foundation
  tasks:
    - name: Include vault_preflight role before secret-dependent services
      ansible.builtin.include_role:
        name: vault_integration
      vars:
        vault_integration_operation: preflight
      when: vault_integration_enabled | default(false) | bool
      tags:
        - site
        - foundation
        - vault

    - name: Include Intel GPU role for GPU-capable nodes
      ansible.builtin.include_role:
        name: intel_gpu
      when: capabilities.gpu | default(false) | bool
      tags: [site, gpu, hardware, runtime]

    - name: Include optional container runtime for GPU-capable nodes
      ansible.builtin.include_role:
        name: container_runtime
      when:
        - capabilities.gpu | default(false) | bool
        - container_runtime_enabled | default(false) | bool
      tags: [site, gpu, runtime]

    - name: Include model registry role when models are managed
      ansible.builtin.include_role:
        name: model_registry
      when: features.model_registry | default(false) | bool
      tags: [site, models]

    - name: Include OS tuning role for tuning-managed nodes
      ansible.builtin.include_role:
        name: os_tuning
      when: features.os_tuning | default(false) | bool
      tags: [site, tuning, baseline]

    - name: Include PyTorch XPU role for inference-capable GPU nodes
      ansible.builtin.include_role:
        name: pytorch_xpu
      when:
        - capabilities.gpu | default(false) | bool
        - capabilities.inference | default(false) | bool
      tags: [site, gpu, runtime, inference]

    - name: Include vLLM XPU role for primary inference nodes
      ansible.builtin.include_role:
        name: vllm_xpu
      when:
        - capabilities.gpu | default(false) | bool
        - capabilities.inference | default(false) | bool
      tags: [site, gpu, runtime, inference, vllm]

    - name: Include llama.cpp SYCL role for fallback inference nodes
      ansible.builtin.include_role:
        name: llama_cpp_sycl
      when:
        - capabilities.gpu | default(false) | bool
        - capabilities.inference | default(false) | bool
      tags: [site, gpu, runtime, inference, llama_cpp]

    - name: Include monitoring role when the feature is enabled
      ansible.builtin.include_role:
        name: monitoring
      when: features.monitoring | default(false) | bool
      tags:
        - site
        - foundation

    - name: Include scheduled reconciliation role when the feature is enabled
      ansible.builtin.include_role:
        name: scheduled_ansible
      when: features.scheduled_reconciliation | default(false) | bool
      tags:
        - site
        - foundation

    - name: Include benchmark orchestration role when the capability is enabled
      ansible.builtin.include_role:
        name: benchmarking
      when: capabilities.benchmarking | default(false) | bool
      tags:
        - site
        - foundation

    - name: Include CMDB export role when the feature is enabled
      ansible.builtin.include_role:
        name: cmdb_export
      when: features.cmdb_export | default(false) | bool
      tags:
        - site
        - foundation

    - name: Include ITSM hooks role when the feature is enabled
      ansible.builtin.include_role:
        name: itsm_hooks
      when: features.itsm_integration | default(false) | bool
      tags:
        - site
        - foundation
