---
# Experiment playbook for controller_candidate_transaction.yml:
# runs controlled_probe.py (cache bypass, SSE latency, tool-calling check) and a bounded engx-hard
# diagnostic subset against candidate/<profile> through the authenticated TLS gateway.
- name: Run bounded gateway tool and engx smoke of a declared candidate profile
  hosts: ai-5820-01
  gather_facts: false
  vars:
    probe_controller: localhost
    probe_source_root: "{{ playbook_dir }}/.."
    probe_output_root: /home/mike/work/candidate-{{ candidate }}
    probe_python: /home/mike/.local/share/aihost/reconcile/snapshot/.venv/bin/python
    probe_engx_python: /home/mike/Projects/aihost/.venv/bin/python
    probe_ca: /home/mike/.config/nexus/t5820-gateway-ca.crt
    probe_base: https://10.0.8.5:8443
    probe_models: ["candidate/{{ candidate }}"]
    probe_label: "{{ candidate_probe_label | default(candidate ~ '-engx') }}"
    probe_concurrency: 1
    probe_repeats: 2
    probe_engx_tasks: "{{ candidate_engx_tasks | default('H02,H03,H07,H08') }}"
    probe_engx_max_attempts: "{{ candidate_engx_max_attempts | default(3) }}"
  tasks:
    - name: Require external reconciliation ownership before sampling or inference
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import fcntl
            with open('/home/mike/.local/share/aihost/reconcile/lock/ansible-snapshot.lock', 'r+') as lock:
                try:
                    fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
                except BlockingIOError:
                    print('Reconciliation lock is held; continuing')
                else:
                    raise SystemExit('Run through controller_candidate_transaction.yml; lock not held')
      delegate_to: "{{ probe_controller }}"
      become: false
      changed_when: false
    - name: Require the declared bounded workload
      ansible.builtin.assert:
        that:
          - probe_concurrency | int in [1, 2]
          - probe_repeats | int >= 1
          - probe_repeats | int <= 5
          - candidate is defined
          - candidate in llama_cpp_container_candidate_profiles
          - probe_models | difference(['candidate/' ~ candidate]) | length == 0
          - probe_label is match('^[a-z0-9-]+$')
    - name: Create private controller evidence directory
      ansible.builtin.file:
        path: "{{ probe_output_root }}"
        state: directory
        mode: '0700'
      delegate_to: "{{ probe_controller }}"
      become: false
    - name: Read existing scoped qualification credential
      ansible.builtin.slurp:
        src: /etc/local-ai/orchestrator/clients/qualification.token
      become: true
      no_log: true
      register: probe_token
    - name: Prepare appliance sampler directory
      ansible.builtin.file:
        path: /var/lib/local-ai/qualification/candidate-{{ candidate }}
        state: directory
        owner: root
        group: root
        mode: '0700'
      become: true
    - name: Install read-only sampler
      ansible.builtin.copy:
        src: "{{ probe_source_root }}/evaluations/engx/sample_drm_memory.py"
        dest: /var/lib/local-ai/qualification/candidate-{{ candidate }}/sample_drm_memory.py
        mode: '0600'
      become: true
    - name: Clear this run's sampler stop file
      ansible.builtin.file:
        path: "/var/lib/local-ai/qualification/candidate-{{ candidate }}/{{ probe_label }}.stop"
        state: absent
      become: true
    - name: Start bounded half-second DRM sampling
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /var/lib/local-ai/qualification/candidate-{{ candidate }}/sample_drm_memory.py
          - --output
          - "/var/lib/local-ai/qualification/candidate-{{ candidate }}/{{ probe_label }}-drm.jsonl"
          - --stop-file
          - "/var/lib/local-ai/qualification/candidate-{{ candidate }}/{{ probe_label }}.stop"
          - --seconds
          - '1800'
      become: true
      async: 1810
      poll: 0
      changed_when: false
      register: probe_sampler
    - name: Exercise candidate tool probe and bounded engx subset; always stop sampler
      block:
        - name: Run controlled latency and tool-calling smoke through authenticated TLS
          ansible.builtin.command:
            argv:
              - "{{ probe_python }}"
              - "{{ probe_source_root }}/evaluations/engx/controlled_probe.py"
              - --base
              - "{{ probe_base }}"
              - --model
              - "{{ item }}"
              - --ca
              - "{{ probe_ca }}"
              - --output
              - "{{ probe_output_root }}/{{ probe_label }}-{{ item | replace('/', '-') }}-probe.json"
              - --concurrency
              - "{{ probe_concurrency | string }}"
              - --repeats
              - "{{ probe_repeats | string }}"
            stdin: "{{ {'qualification': probe_token.content | b64decode | trim} | to_json }}"
          delegate_to: "{{ probe_controller }}"
          become: false
          changed_when: false
          no_log: true
          loop: "{{ probe_models }}"
        - name: Run bounded engx-hard diagnostic tasks through authenticated TLS
          ansible.builtin.command:
            argv:
              - "{{ probe_python }}"
              - "{{ probe_source_root }}/evaluations/nexus_e2e/drivers/solo.py"
              - --alias
              - "candidate/{{ candidate }}"
              - --arm
              - "cand-{{ candidate }}"
              - --base
              - "{{ probe_base }}"
              - --ca
              - "{{ probe_ca }}"
              - --token-file
              - "-"
              - --reps
              - "1"
              - --max-attempts
              - "{{ probe_engx_max_attempts | string }}"
              - --max-tokens
              - "8192"
              - --only
              - "{{ probe_engx_tasks }}"
              - --out
              - "{{ probe_output_root }}"
            stdin: "{{ probe_token.content | b64decode | trim }}"
          environment:
            ENGX_PYTHON: "{{ probe_engx_python }}"
          delegate_to: "{{ probe_controller }}"
          become: false
          changed_when: false
          no_log: true
      always:
        - name: Stop this run's resource sampler
          ansible.builtin.copy:
            content: stopped
            dest: "/var/lib/local-ai/qualification/candidate-{{ candidate }}/{{ probe_label }}.stop"
            mode: '0600'
          become: true
        - name: Wait for sampler output to close before collection
          ansible.builtin.async_status:
            jid: "{{ probe_sampler.ansible_job_id }}"
          register: probe_sampler_status
          until: probe_sampler_status.finished
          retries: 20
          delay: 1
          become: true
        - name: Retain fresh DRM observations on the controller
          ansible.builtin.fetch:
            src: "/var/lib/local-ai/qualification/candidate-{{ candidate }}/{{ probe_label }}-drm.jsonl"
            dest: "{{ probe_output_root }}/{{ probe_label }}-drm.jsonl"
            flat: true
          become: true
