---
- name: Converge Ubuntu host baseline
  hosts: ai_hosts
  gather_facts: true
  tags:
    - baseline
    - foundation
  pre_tasks:
    - name: Validate Ubuntu 24.04 baseline target
      ansible.builtin.assert:
        that:
          - not baseline_platform_guard_enabled | bool or ansible_facts.distribution == "Ubuntu"
          - not baseline_platform_guard_enabled | bool or ansible_facts.distribution_version is version("24.04", "==")
        fail_msg: >-
          Baseline convergence is supported only for Ubuntu 24.04 hosts unless
          the localhost-safe override is enabled.
      vars:
        baseline_platform_guard_enabled: "{{ not (baseline_skip_platform_guard | default(false) | bool) }}"
      tags:
        - baseline
        - foundation
        - validation
  tasks:
    - name: Include base OS baseline role
      ansible.builtin.include_role:
        name: base_os
      vars:
        base_os_phase: baseline
      tags:
        - baseline
        - foundation

    - name: Include time synchronization baseline role
      ansible.builtin.include_role:
        name: time_sync
      tags:
        - baseline
        - foundation

    - name: Include storage baseline role
      ansible.builtin.include_role:
        name: storage
      when: storage_mounts | default([]) | length > 0
      tags:
        - baseline
        - storage
        - foundation

    - name: Include networking baseline role
      ansible.builtin.include_role:
        name: networking
      when: >-
        networking_manage_netplan | default(false) | bool
        or networking_ethernets | default({}) | length > 0
      tags:
        - baseline
        - network
        - foundation

    - name: Include users baseline role
      ansible.builtin.include_role:
        name: users
      tags:
        - baseline
        - users
        - foundation

    - name: Include SSH baseline role
      ansible.builtin.include_role:
        name: ssh
      tags:
        - baseline
        - ssh
        - foundation

    - name: Include security baseline role
      ansible.builtin.include_role:
        name: security
      tags:
        - baseline
        - security
        - foundation
