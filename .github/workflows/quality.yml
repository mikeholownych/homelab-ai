---
name: quality

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  quality:
    name: repository quality
    runs-on: ubuntu-24.04
    # make quality measured: lint ~3 min, tests ~5-16 min, two cold container idempotency runs ~23 min.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Add virtual environment to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install --require-hashes -r requirements.txt

      - name: Install Ansible collections
        run: .venv/bin/ansible-galaxy collection install -r requirements.yml

      # The harness images install pinned packages from snapshot.ubuntu.com, which took over 10 minutes per cold
      # build on 2026-10-10. Build them once per Dockerfile change with a layer cache; the harness then reuses them.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build noble harness image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/integration/Dockerfile.baseline
          tags: aihost-baseline-harness:noble-sha019e8eb2
          load: true
          cache-from: type=gha,scope=harness-noble
          cache-to: type=gha,mode=max,scope=harness-noble

      - name: Build resolute harness image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/integration/Dockerfile.resolute
          tags: aihost-baseline-harness:resolute-sha889d056d
          load: true
          cache-from: type=gha,scope=harness-resolute
          cache-to: type=gha,mode=max,scope=harness-resolute

      - name: Run repository quality gates
        env:
          AIHOST_HARNESS_PREBUILT: "1"
        run: make quality

      - name: Show active Ansible config overrides
        run: ANSIBLE_CONFIG=ansible.cfg .venv/bin/ansible-config dump --only-changed
