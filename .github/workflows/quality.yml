---
name: quality

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  quality:
    name: repository quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install --require-hashes -r requirements.txt

      - name: Install Ansible collections
        run: .venv/bin/ansible-galaxy collection install -r requirements.yml

      - name: Run repository quality gates
        run: make quality

      - name: Show active Ansible config overrides
        run: ANSIBLE_CONFIG=ansible.cfg .venv/bin/ansible-config dump --only-changed
