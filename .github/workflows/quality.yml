---
name: quality

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  quality:
    name: repository quality
    runs-on: ubuntu-24.04
    # make quality measured: lint ~3 min, tests ~5-16 min, two cold container idempotency runs ~23 min.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          # Full history: tests/test_gateway_release_identity.py compares the gateway code with the released commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Add virtual environment to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install --require-hashes -r requirements.txt

      - name: Install Ansible collections
        run: .venv/bin/ansible-galaxy collection install -r requirements.yml

      # The harness images install pinned packages from snapshot.ubuntu.com, which took over 10 minutes per cold
      # build on 2026-10-10. Build them once per Dockerfile change with a layer cache; the harness then reuses them.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build noble harness image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/integration/Dockerfile.baseline
          tags: aihost-baseline-harness:noble-sha019e8eb2
          load: true
          cache-from: type=gha,scope=harness-noble
          cache-to: type=gha,mode=max,scope=harness-noble

      - name: Build resolute harness image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/integration/Dockerfile.resolute
          tags: aihost-baseline-harness:resolute-sha889d056d
          load: true
          cache-from: type=gha,scope=harness-resolute
          cache-to: type=gha,mode=max,scope=harness-resolute

      - name: Run repository quality gates
        env:
          AIHOST_HARNESS_PREBUILT: "1"
        run: make quality

      - name: Show active Ansible config overrides
        run: ANSIBLE_CONFIG=ansible.cfg .venv/bin/ansible-config dump --only-changed

  gateway-quality:
    name: gateway protocol and failure qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install the locked gateway validation environment
        run: |
          python -m venv .venv-gateway-test
          .venv-gateway-test/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-gateway-test.lock
      - name: Run gateway checks with every warning treated as an error
        run: sh scripts/check-gateway-quality

  secret-scan:
    name: working-tree secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository (no history needed)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      # Pinned by version and SHA-256 (from the upstream gitleaks_8.30.1_checksums.txt), like the other
      # pinned tooling here. Scans the working tree only: git history still holds credentials that were
      # removed from HEAD and are being rotated, so a history scan would fail until a purge is decided.
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
