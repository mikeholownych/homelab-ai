---
- name: Validate llama.cpp SYCL role inputs
  ansible.builtin.assert:
    that:
      - llama_cpp_sycl_git_commit is match("^[0-9a-fA-F]{40}$")
      - llama_cpp_sycl_cmake_args is iterable
      - (llama_cpp_sycl_cmake_args | select("match", "^-DGGML_SYCL=ON$") | list | length) > 0
      - llama_cpp_sycl_split_mode in ["none", "layer", "row"]
      - llama_cpp_sycl_tensor_split is string
    fail_msg: >-
      llama_cpp_sycl requires an exact 40-character commit, explicit SYCL build flags,
      and valid split_mode/tensor_split parameters.
  tags: [inference, runtime, llama_cpp]

- name: Assert dual-GPU SYCL requires explicit certification before enabling service
  ansible.builtin.assert:
    that:
      - >-
        not (llama_cpp_sycl_service_enabled | bool)
        or (llama_cpp_sycl_split_mode == 'none')
        or (llama_cpp_sycl_dual_gpu_support_certified | bool)
    fail_msg: >-
      Multi-GPU SYCL execution in llama.cpp requires explicit dual-GPU acceptance certification.
  when: llama_cpp_sycl_service_enabled | bool
  tags: [inference, runtime, llama_cpp]

- name: Require authenticated serving for network-bound llama.cpp
  ansible.builtin.assert:
    that:
      - not (llama_cpp_sycl_service_enabled | bool)
        or not (llama_cpp_sycl_install_enabled | bool)
        or (llama_cpp_sycl_api_key_required | bool)
        or llama_cpp_sycl_host is match('^(127\\.|\\[::1\\]|localhost$)')
    fail_msg: >-
      llama.cpp bound beyond loopback must require an API key
      (llama_cpp_sycl_api_key_required=true) so Vault-backed auth is enforced.
  tags: [inference, runtime, llama_cpp]

- name: Read llama.cpp API key from Vault at runtime
  ansible.builtin.include_role:
    name: vault_integration
    tasks_from: main.yml
  vars:
    vault_integration_operation: read
    vault_integration_secret_ref: "{{ llama_cpp_sycl_api_key_secret_path }}"
    vault_integration_required_secret_keys:
      - "{{ llama_cpp_sycl_api_key_secret_file_key }}"
  when:
    - llama_cpp_sycl_service_enabled | bool
    - llama_cpp_sycl_install_enabled | bool
    - llama_cpp_sycl_api_key_required | bool
    - not ansible_check_mode
  no_log: true
  tags: [inference, runtime, llama_cpp, vault]

- name: Publish retrieved API key for environment rendering
  ansible.builtin.set_fact:
    llama_cpp_sycl_api_key: "{{ vault_integration_secret[llama_cpp_sycl_api_key_secret_file_key] }}"
  no_log: true
  when:
    - llama_cpp_sycl_service_enabled | bool
    - llama_cpp_sycl_install_enabled | bool
    - llama_cpp_sycl_api_key_required | bool
    - not ansible_check_mode
  tags: [inference, runtime, llama_cpp]

- name: Create llama.cpp configuration and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ llama_cpp_sycl_user }}"
    group: "{{ llama_cpp_sycl_group }}"
    mode: "0750"
  loop:
    - "{{ llama_cpp_sycl_config_dir }}"
    - "{{ llama_cpp_sycl_log_dir }}"
  when: llama_cpp_sycl_install_enabled | bool
  tags: [inference, runtime, llama_cpp]

- name: Render llama.cpp environment file
  ansible.builtin.template:
    src: llama.env.j2
    dest: "{{ llama_cpp_sycl_config_dir }}/llama.env"
    owner: "{{ llama_cpp_sycl_user }}"
    group: "{{ llama_cpp_sycl_group }}"
    mode: "0640"
  when: llama_cpp_sycl_install_enabled | bool
  tags: [inference, runtime, llama_cpp]

- name: Install llama.cpp build prerequisites
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - git
      - pkg-config
      - libcurl4-openssl-dev
    state: present
  when: llama_cpp_sycl_install_enabled | bool
  tags: [inference, runtime, llama_cpp, baseline]

# SYCL builds require the Intel DPC++ compiler (icx). It ships from the Intel
# oneAPI repository, which is exactly the vendor-stack decision the intel_gpu
# role gates on - so this fails closed with a precise message instead of a
# confusing compiler error halfway through the build.
- name: Check for Intel DPC++ compiler required by GGML_SYCL
  ansible.builtin.command:
    argv: ["which", "icx"]
  register: llama_cpp_sycl_icx_probe
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [inference, runtime, llama_cpp]

- name: Fail closed when the SYCL toolchain is absent
  ansible.builtin.fail:
    msg: >-
      llama.cpp SYCL builds require the Intel oneAPI DPC++ compiler (icx), which is
      provisioned together with the Intel GPU stack (see roles/intel_gpu and the
      unresolved vendor support decision). Resolve that blocker first; do not
      bypass with a generic compiler or the build will silently target OpenCL.
  when:
    - llama_cpp_sycl_install_enabled | bool
    - llama_cpp_sycl_icx_probe.rc != 0

- name: Clone pinned llama.cpp source at the declared commit
  ansible.builtin.git:
    repo: "{{ llama_cpp_sycl_git_repo }}"
    dest: "{{ llama_cpp_sycl_build_dir }}"
    version: "{{ llama_cpp_sycl_git_commit }}"
    depth: 1
  register: llama_cpp_sycl_clone
  when: llama_cpp_sycl_install_enabled | bool
  tags: [inference, runtime, llama_cpp]

- name: Configure llama.cpp with the pinned SYCL flags
  ansible.builtin.command:
    argv: "{{ ['cmake', '-B', llama_cpp_sycl_build_dir ~ '/build-sycl', '-S', llama_cpp_sycl_build_dir]
              + llama_cpp_sycl_cmake_args }}"
  register: llama_cpp_sycl_configure
  changed_when: llama_cpp_sycl_configure.rc == 0
  when:
    - llama_cpp_sycl_install_enabled | bool
    - llama_cpp_sycl_clone is changed or llama_cpp_sycl_force_rebuild | bool
  tags: [inference, runtime, llama_cpp]

- name: Compile llama.cpp SYCL binaries
  ansible.builtin.command:
    argv:
      - cmake
      - --build
      - "{{ llama_cpp_sycl_build_dir }}/build-sycl"
      - --config
      - Release
      - -j
      - "{{ ansible_processor_vcpus | default(4) }}"
    args:
      chdir: "{{ llama_cpp_sycl_build_dir }}"
  register: llama_cpp_sycl_build
  changed_when: llama_cpp_sycl_build.rc == 0
  when:
    - llama_cpp_sycl_install_enabled | bool
    - not ansible_check_mode
    - llama_cpp_sycl_configure is changed or llama_cpp_sycl_force_rebuild | bool
  tags: [inference, runtime, llama_cpp]

- name: Install compiled binaries into the service directory
  ansible.builtin.copy:
    src: "{{ llama_cpp_sycl_build_dir }}/build-sycl/bin/llama-server"
    dest: "{{ llama_cpp_sycl_install_dir }}/bin/llama-server"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - llama_cpp_sycl_install_enabled | bool
    - not ansible_check_mode
    - llama_cpp_sycl_build is changed
  tags: [inference, runtime, llama_cpp]

- name: Record the exact build provenance stamp
  ansible.builtin.copy:
    content: "{{ {'git_commit': llama_cpp_sycl_git_commit,
                   'cmake_args': llama_cpp_sycl_cmake_args,
                   'built_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')} | to_nice_json }}\n"
    dest: "{{ llama_cpp_sycl_install_dir }}/BUILD_STAMP.json"
    owner: root
    group: root
    mode: "0644"
  when:
    - llama_cpp_sycl_install_enabled | bool
    - not ansible_check_mode
    - llama_cpp_sycl_build is changed

- name: Write plain commit file for benchmark provenance reads
  ansible.builtin.copy:
    content: "{{ llama_cpp_sycl_git_commit }}\n"
    dest: "{{ llama_cpp_sycl_install_dir }}/BUILD_COMMIT"
    owner: root
    group: root
    mode: "0644"
  when: llama_cpp_sycl_install_enabled | bool
  tags: [inference, runtime, llama_cpp]

- name: Install llama.cpp systemd service unit
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    owner: root
    group: root
    mode: "0644"
  when: llama_cpp_sycl_install_enabled | bool
  notify: Reload systemd daemon
  tags: [inference, runtime, llama_cpp]

- name: Record llama.cpp fallback validation state during check mode or when uncommissioned
  ansible.builtin.copy:
    content: >-
      {{ {
        'schema_version': '1.0.0',
        'service': 'llama_cpp_sycl',
        'git_commit': llama_cpp_sycl_git_commit,
        'status': 'NOT_TESTED',
        'physical_acceptance': false,
        'simulated': false,
        'dual_gpu_tested': false,
        'dual_gpu_supported': false,
        'split_mode': llama_cpp_sycl_split_mode,
        'tensor_split': llama_cpp_sycl_tensor_split,
        'reason': 'check mode or uncommissioned hardware skips live fallback service validation'
      } | to_nice_json }}
    dest: "{{ llama_cpp_sycl_validation_path }}"
    owner: root
    group: root
    mode: "0640"
  when:
    - ansible_check_mode or not (llama_cpp_sycl_service_enabled | bool)
  tags: [inference, validation, llama_cpp]
