---
- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald.service
    state: restarted
  when: base_os_mutating_operations_enabled | bool

- name: Validate base OS sysctl settings
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - --system
  changed_when: false
  when: base_os_mutating_operations_enabled | bool
