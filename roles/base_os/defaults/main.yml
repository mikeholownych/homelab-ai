---
base_os_supported_distribution: Ubuntu
base_os_supported_release: "24.04"
base_os_enforce_platform_guard: "{{ not (baseline_skip_platform_guard | default(false) | bool) }}"
base_os_root_dir: ""
base_os_manage_ubuntu_sources: false
base_os_archive_uri: https://archive.ubuntu.com/ubuntu
base_os_security_uri: https://security.ubuntu.com/ubuntu
base_os_apt_suites:
  - noble
  - noble-updates
  - noble-backports
  - noble-security
base_os_apt_components:
  - main
  - restricted
  - universe
  - multiverse
base_os_allowed_architectures:
  - amd64
  - arm64
base_os_apt_architectures:
  - amd64
base_os_sources_path: "{{ (base_os_root_dir | default('')) ~ '/etc/apt/sources.list.d/ubuntu.sources' }}"
base_os_proxy_enabled: false
base_os_proxy_environment: {}
base_os_proxy_path: "{{ (base_os_root_dir | default('')) ~ '/etc/apt/apt.conf.d/90-aihost-proxy' }}"
base_os_disable_periodic_path: "{{ (base_os_root_dir | default('')) ~ '/etc/apt/apt.conf.d/20auto-upgrades' }}"
base_os_journald_path: "{{ (base_os_root_dir | default('')) ~ '/etc/systemd/journald.conf.d/60-aihost.conf' }}"
base_os_logrotate_path: "{{ (base_os_root_dir | default('')) ~ '/etc/logrotate.d/aihost-baseline' }}"
base_os_logrotate_validate_command: /usr/sbin/logrotate --debug %s
base_os_logrotate_paths:
  - /var/log/local-ai/*.log
base_os_locale_path: "{{ (base_os_root_dir | default('')) ~ '/etc/default/locale' }}"
base_os_grub_dropin_path: "{{ (base_os_root_dir | default('')) ~ '/etc/default/grub.d/90-aihost.cfg' }}"
base_os_grub_shell_validate_command: /bin/sh -n %s
base_os_admin_packages:
  - auditd
  - ca-certificates
  - curl
  - git
  - htop
  - jq
  - locales
  - logrotate
  - openssh-server
  - python3-apt
  - rsync
  - sudo
  - tmux
  - ufw
  - unattended-upgrades
  - vim
base_os_apt_cache_valid_time: 3600
base_os_locale: en_US.UTF-8
base_os_timezone: UTC
base_os_journald_system_max_use: 1G
base_os_journald_runtime_max_use: 256M
base_os_journald_max_file_sec: 1month
base_os_journald_max_retention_sec: 1month
base_os_logrotate_size: 100M
base_os_logrotate_rotate: 12
base_os_allowed_sysctl:
  - fs.inotify.max_user_watches
  - vm.swappiness
base_os_kernel_sysctl: {}
base_os_manage_boot_parameters: false
base_os_boot_parameters: []
base_os_allowed_boot_parameter_patterns:
  - ^intel_iommu=(on|off)$
  - ^amd_iommu=(on|off)$
  - ^iommu=(pt|soft|off|force)$
  - ^pcie_aspm=(off|force)$
  - ^module_blacklist=[A-Za-z0-9_,.-]+$
  - ^systemd.unified_cgroup_hierarchy=(0|1)$
base_os_high_risk_packages:
  - linux-image
  - linux-modules
  - linux-headers
  - intel-compute-runtime
  - intel-gpu-tools
  - intel-opencl-icd
  - intel-level-zero-gpu
  - libze-intel-gpu
  - level-zero
  - oneapi-level-zero
  - torch
  - pytorch
  - vllm
  - llama
  - llama-cpp
  - firmware
  - bios
  - microcode
base_os_package_holds: []
base_os_package_pins: []
base_os_mutating_operations_enabled: "{{ not (baseline_localhost_safe_mode | default(false) | bool) }}"
