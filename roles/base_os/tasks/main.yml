---
- name: Validate Ubuntu 24.04 base OS target
  ansible.builtin.assert:
    that:
      - not base_os_enforce_platform_guard | bool or ansible_facts.distribution == base_os_supported_distribution
      - >-
        not base_os_enforce_platform_guard | bool
        or ansible_facts.distribution_version is version(base_os_supported_release, "==")
    fail_msg: >-
      base_os supports only Ubuntu 24.04 hosts unless the localhost-safe
      override is enabled.

- name: Validate base OS package source inputs
  ansible.builtin.assert:
    that:
      - base_os_archive_uri is match("^https://")
      - base_os_security_uri is match("^https://")
      - base_os_apt_architectures | length > 0
      - (base_os_apt_architectures | difference(base_os_allowed_architectures)) | length == 0
      - base_os_apt_suites | length > 0
      - (base_os_apt_suites | difference(["noble", "noble-updates", "noble-backports", "noble-security"])) | length == 0
      - base_os_apt_components | length > 0
      - (base_os_apt_components | difference(["main", "restricted", "universe", "multiverse"])) | length == 0
      - base_os_allowed_sysctl is iterable
      - base_os_kernel_sysctl is mapping
      - (base_os_kernel_sysctl.keys() | list | difference(base_os_allowed_sysctl)) | length == 0
      - base_os_manage_boot_parameters is boolean
      - base_os_boot_parameters is iterable
      - not base_os_manage_boot_parameters | bool or base_os_boot_parameters | length > 0
      - base_os_logrotate_paths is iterable
      - base_os_package_holds is iterable
      - base_os_package_pins is iterable
    fail_msg: >-
      base_os package source inputs must declare explicit URIs, valid suites,
      components, supported architectures, and allowlisted kernel settings.

- name: Validate declared logrotate paths stay within local-ai log ownership
  ansible.builtin.assert:
    that:
      - (base_os_logrotate_paths | aihost_invalid_logrotate_paths | length) == 0
    fail_msg: >-
      base_os_logrotate_paths must stay within /var/log/local-ai and must not
      target /var/log/*.log.

- name: Validate allowed boot parameters
  ansible.builtin.assert:
    that:
      - item | aihost_boot_param_allowed(base_os_allowed_boot_parameter_patterns)
    fail_msg: >-
      base_os_boot_parameters must use the reviewed boot-parameter allowlist.
  loop: "{{ base_os_boot_parameters }}"
  loop_control:
    label: "{{ item }}"
  when: base_os_manage_boot_parameters | bool

- name: Validate high-risk package holds stay within policy inventory
  ansible.builtin.assert:
    that:
      - item is string
      - item is match("^((" ~ (base_os_high_risk_packages | join(")|(")) ~ ").*)$")
    fail_msg: >-
      base_os package holds must target only explicitly configured high-risk
      packages from policy inventory.
  loop: "{{ base_os_package_holds }}"
  loop_control:
    label: "{{ item }}"

- name: Validate high-risk package pins stay within policy inventory
  ansible.builtin.assert:
    that:
      - item.package is defined
      - item.package is string
      - item.package is match("^((" ~ (base_os_high_risk_packages | join(")|(")) ~ ").*)$")
      - item.pin is defined
      - item.pin is string
      - item.priority is defined
      - item.priority | string is match("^-?[0-9]+$")
    fail_msg: >-
      base_os package pins must target only explicitly configured high-risk
      packages from policy inventory.
  loop: "{{ base_os_package_pins }}"
  loop_control:
    label: "{{ item.package | default('undefined') }}"

- name: Ensure base OS configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ (base_os_root_dir | default('')) ~ '/etc/apt/apt.conf.d' }}"
    - "{{ (base_os_root_dir | default('')) ~ '/etc/apt/preferences.d' }}"
    - "{{ (base_os_root_dir | default('')) ~ '/etc/apt/sources.list.d' }}"
    - "{{ (base_os_root_dir | default('')) ~ '/etc/default/grub.d' }}"
    - "{{ (base_os_root_dir | default('')) ~ '/etc/logrotate.d' }}"
    - "{{ (base_os_root_dir | default('')) ~ '/etc/systemd/journald.conf.d' }}"
    - "{{ (base_os_root_dir | default('')) ~ '/etc/default' }}"
    - "{{ base_os_package_holds_state_path | dirname }}"

- name: Render deb822 Ubuntu package sources when explicitly enabled
  ansible.builtin.template:
    src: aihost-baseline.sources.j2
    dest: "{{ base_os_sources_path }}"
    mode: "0644"
  when: base_os_manage_ubuntu_sources | bool

- name: Disable unattended apt mutation
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: "{{ base_os_disable_periodic_path }}"
    mode: "0644"

- name: Render apt proxy configuration without secrets
  ansible.builtin.template:
    src: 90-aihost-proxy.j2
    dest: "{{ base_os_proxy_path }}"
    mode: "0640"
  when: base_os_proxy_enabled | bool

- name: Remove apt proxy configuration when disabled
  ansible.builtin.file:
    path: "{{ base_os_proxy_path }}"
    state: absent
  when: not base_os_proxy_enabled | bool

- name: Install baseline admin packages
  ansible.builtin.apt:
    name: "{{ base_os_admin_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ base_os_apt_cache_valid_time }}"
  when: base_os_manage_admin_packages | bool

- name: Generate baseline locale
  community.general.locale_gen:
    name: "{{ base_os_locale }}"
    state: present
  when: base_os_manage_locale_generation | bool

- name: Set baseline locale defaults
  ansible.builtin.copy:
    dest: "{{ base_os_locale_path }}"
    mode: "0644"
    content: |
      LANG={{ base_os_locale }}
      LC_ALL={{ base_os_locale }}

- name: Set system timezone
  community.general.timezone:
    name: "{{ base_os_timezone }}"
  when: base_os_manage_timezone | bool

- name: Render journald retention policy
  ansible.builtin.template:
    src: 60-aihost-journald.conf.j2
    dest: "{{ base_os_journald_path }}"
    mode: "0644"
  notify: Restart systemd-journald

- name: Render baseline logrotate policy
  ansible.builtin.template:
    src: aihost-logrotate.j2
    dest: "{{ base_os_logrotate_path }}"
    mode: "0644"
    validate: "{{ base_os_logrotate_validate_command }}"

- name: Render GRUB boot-parameter drop-in when enabled
  ansible.builtin.template:
    src: 90-aihost.cfg.j2
    dest: "{{ base_os_grub_dropin_path }}"
    mode: "0644"
    validate: "{{ base_os_grub_shell_validate_command }}"
  when: base_os_manage_boot_parameters | bool
  notify: Apply grub configuration update

- name: Remove GRUB boot-parameter drop-in when disabled
  ansible.builtin.file:
    path: "{{ base_os_grub_dropin_path }}"
    state: absent
  when: not base_os_manage_boot_parameters | bool
  notify: Apply grub configuration update

- name: Apply baseline sysctl values
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ base_os_kernel_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - base_os_mutating_operations_enabled | bool
    - base_os_kernel_sysctl | length > 0

- name: Read previous managed package policy state
  ansible.builtin.stat:
    path: "{{ base_os_package_holds_state_path }}"
  register: base_os_package_state_manifest

- name: Slurp previous managed package policy state
  ansible.builtin.slurp:
    src: "{{ base_os_package_holds_state_path }}"
  register: base_os_package_state_manifest_content
  when: base_os_package_state_manifest.stat.exists | default(false)

- name: Record previous managed package policy state
  ansible.builtin.set_fact:
    base_os_package_policy_previous: >-
      {{
        (
          base_os_package_state_manifest_content.content
          | default('')
          | b64decode
          | from_json
        ) if (base_os_package_state_manifest.stat.exists | default(false)) else {'holds': [], 'pin_packages': []}
      }}

- name: Record previous managed package transition lists
  ansible.builtin.set_fact:
    base_os_package_holds_previous: "{{ base_os_package_policy_previous.holds | default([]) }}"
    base_os_pin_packages_previous: "{{ base_os_package_policy_previous.pin_packages | default([]) }}"

- name: Unhold previously managed packages removed from policy
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ base_os_package_holds_previous | difference(base_os_package_holds) }}"
  when:
    - base_os_manage_package_policy | bool
    - (base_os_package_holds_previous | difference(base_os_package_holds) | length) > 0

- name: Hold selected high-risk packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ base_os_package_holds }}"
  when:
    - base_os_manage_package_policy | bool
    - base_os_package_holds | length > 0

- name: Remove legacy role-owned apt pin preferences
  ansible.builtin.file:
    path: "{{ (base_os_root_dir | default('')) ~ '/etc/apt/preferences.d/' ~ item ~ '.pref' }}"
    state: absent
  loop: "{{ base_os_pin_packages_previous }}"

- name: Render managed apt pin preferences
  ansible.builtin.template:
    src: aihost-managed.pref.j2
    dest: "{{ base_os_package_preferences_path }}"
    mode: "0644"
  when: base_os_package_pins | length > 0

- name: Remove managed apt pin preferences when no pins remain
  ansible.builtin.file:
    path: "{{ base_os_package_preferences_path }}"
    state: absent
  when: base_os_package_pins | length == 0

- name: Persist managed package policy state
  ansible.builtin.copy:
    dest: "{{ base_os_package_holds_state_path }}"
    mode: "0600"
    content: >-
      {{
        {
          'holds': base_os_package_holds,
          'pin_packages': (base_os_package_pins | map(attribute='package') | list)
        } | to_nice_json
      }}

- name: Gather installed package facts for unattended-upgrades checks
  ansible.builtin.package_facts:
    manager: auto
  when: base_os_manage_unattended_upgrades_service | bool

- name: Gather service facts for unattended-upgrades checks
  ansible.builtin.service_facts:
  when: base_os_manage_unattended_upgrades_service | bool

- name: Stop unattended-upgrades service when installed
  ansible.builtin.systemd:
    name: unattended-upgrades.service
    state: stopped
    enabled: false
    masked: true
  when:
    - base_os_manage_unattended_upgrades_service | bool
    - "'unattended-upgrades' in ansible_facts.packages"
    - "'unattended-upgrades.service' in ansible_facts.services"
