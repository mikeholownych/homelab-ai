---
monitoring_enabled: true
monitoring_log_dir: "/var/log/local-ai/monitoring"
monitoring_collector_enabled: true
monitoring_collection_interval_sec: 60

# Failure visibility: every aihost timer unit carries OnFailure=aihost-alert@%n.
# The alert script always logs locally; an optional operator-provided command
# (configured out-of-band in /etc/local-ai/alert.env) can forward alerts.
monitoring_alert_enabled: true
monitoring_alert_log_dir: "/var/log/local-ai/alerts"
monitoring_alert_script_path: /usr/local/libexec/local-ai-alert
monitoring_alert_service_path: /etc/systemd/system/aihost-alert@.service

# Off-host evidence durability: mirror the evidence tree to a destination
# (rsync URL) on a schedule. Disabled until an operator provides storage.
monitoring_evidence_sync_enabled: false
monitoring_evidence_source_dir: /var/lib/local-ai/evidence
monitoring_evidence_sync_destination: null
monitoring_evidence_sync_interval: "daily"
monitoring_evidence_sync_service_path: /etc/systemd/system/aihost-evidence-sync.service
monitoring_evidence_sync_timer_path: /etc/systemd/system/aihost-evidence-sync.timer
monitoring_evidence_sync_script_path: /usr/local/libexec/local-ai-sync-evidence

# Offline-provable metrics bridge: node_exporter textfile format. The full
# Alloy/VictoriaMetrics stack lands as a hash-pinned commissioning commit (see
# docs/observability.md).
monitoring_metrics_textfile_enabled: true
monitoring_metrics_textfile_dir: /var/lib/local-ai/metrics
monitoring_metrics_interval: "*-*-* *:*:00"
monitoring_metrics_service_path: /etc/systemd/system/aihost-metrics.service
monitoring_metrics_timer_path: /etc/systemd/system/aihost-metrics.timer
monitoring_metrics_script_path: /usr/local/libexec/local-ai-write-metrics

# Shared runtime configuration for the (Jinja-free, copy-installed) scripts.
# The monitoring role templates this file from the variables below; scripts
# source it at runtime with safe fallbacks, so bash {{ }} markers never leak
# into installed artifacts.
monitoring_config_file: /etc/local-ai/monitoring.env
monitoring_config_dir: /etc/local-ai

# GPU thermal guard: per-device hwmon sampling with a debounced severity state
# machine (ok/warning/critical). Critical transitions are written to the alert
# log and forwarded through AIHOST_ALERT_COMMAND exactly like unit failures.
# Thresholds must stay below the benchmark harness abort guardrail
# (benchmarking_abort_temperature_c, default 90), so an alert fires before a
# workload would be killed.
monitoring_gpu_temp_alert_enabled: true
monitoring_gpu_temp_warn_threshold_c: 75
monitoring_gpu_temp_crit_threshold_c: 85
monitoring_gpu_temp_state_dir: /var/lib/local-ai/monitoring
