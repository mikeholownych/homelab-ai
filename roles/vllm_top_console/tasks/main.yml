---
- name: Check the locally built vllm-top binary reports an acceptable version
  ansible.builtin.command:
    argv: ["{{ vllm_top_console_binary_src }}", --version]
  register: vllm_top_console_version
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  when: vllm_top_console_enabled | bool

- name: Require the minimum version
  ansible.builtin.assert:
    that: >-
      (vllm_top_console_version.stdout | regex_search('[0-9]+\.[0-9]+\.[0-9]+'))
      is version(vllm_top_console_min_version, '>=')
    fail_msg: >-
      vllm-top {{ vllm_top_console_min_version }} or newer is required;
      found: {{ vllm_top_console_version.stdout | default('unknown') }}
  when: vllm_top_console_enabled | bool

- name: Install the vllm-top binary (root-owned)
  ansible.builtin.copy:
    src: "{{ vllm_top_console_binary_src }}"
    dest: "{{ vllm_top_console_binary_dest }}"
    owner: root
    group: root
    mode: "0755"
  when: vllm_top_console_enabled | bool
  notify: Restart vllm-top console

- name: Install the console service unit
  ansible.builtin.template:
    src: vllm-top-console.service.j2
    dest: "/etc/systemd/system/{{ vllm_top_console_service }}"
    owner: root
    group: root
    mode: "0644"
  when: vllm_top_console_enabled | bool
  notify: Restart vllm-top console

- name: Enable the console service
  ansible.builtin.systemd_service:
    name: "{{ vllm_top_console_service }}"
    enabled: true
    daemon_reload: true
  when:
    - vllm_top_console_enabled | bool
    - not ansible_check_mode

- name: Remove stale per-user vllm-top copies that shadow the managed binary
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vllm_top_console_shadow_paths }}"

- name: Set aside the superseded on-host vllm-top source checkout
  ansible.builtin.command:
    cmd: "mv {{ vllm_top_console_superseded_source }} {{ vllm_top_console_superseded_source }}.superseded-0.6.0"
    creates: "{{ vllm_top_console_superseded_source }}.superseded-0.6.0"
    removes: "{{ vllm_top_console_superseded_source }}/Cargo.toml"
