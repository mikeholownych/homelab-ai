---
# Scheduled reconciliation from the controller (the only place the gateway CA key lives). The timer re-applies the
# deployed snapshot: a clean checkout pinned to an explicit commit, which moves only when an operator deploys a new one.
# It never pulls whatever lands on main.
reconcile_controller_snapshot_ref: ""
reconcile_controller_source_repo: "{{ playbook_dir }}/.."
reconcile_controller_root: "{{ ansible_facts.env.HOME }}/.local/share/aihost/reconcile"
reconcile_controller_snapshot_dir: "{{ reconcile_controller_root }}/snapshot"
reconcile_controller_evidence_dir: "{{ reconcile_controller_root }}/evidence"
reconcile_controller_lock_dir: "{{ reconcile_controller_root }}/lock"
reconcile_controller_candidate_state_dir: "{{ reconcile_controller_root }}/candidate"
reconcile_controller_unit_dir: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
reconcile_controller_target: ai-5820-01
reconcile_controller_schedule: hourly
reconcile_controller_random_delay: 300s
reconcile_controller_timer_enabled: true
reconcile_controller_cargo: "{{ ansible_facts.env.HOME }}/.cargo/bin/cargo"
