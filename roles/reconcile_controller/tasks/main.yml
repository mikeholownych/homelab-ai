---
- name: Require an explicit snapshot commit
  ansible.builtin.assert:
    that:
      - reconcile_controller_snapshot_ref is match('^[0-9a-f]{40}$')
      - reconcile_controller_gateway_backup_keep | int >= 2
      - reconcile_controller_gateway_backup_keep | int <= 30
      - reconcile_controller_gateway_backup_host is match('^[A-Za-z0-9_.@:-]+$')
    fail_msg: >-
      Set reconcile_controller_snapshot_ref to the full commit to deploy (git rev-parse <ref>). The timer re-applies
      exactly that snapshot until an operator deploys another.
  tags: [reconcile]

- name: Create the reconciliation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ reconcile_controller_root }}"
    - "{{ reconcile_controller_evidence_dir }}"
    - "{{ reconcile_controller_lock_dir }}"
    - "{{ reconcile_controller_candidate_state_dir }}"
    - "{{ reconcile_controller_unit_dir }}"
  tags: [reconcile]

- name: Check out the pinned snapshot
  ansible.builtin.git:
    repo: "{{ reconcile_controller_source_repo }}"
    dest: "{{ reconcile_controller_snapshot_dir }}"
    version: "{{ reconcile_controller_snapshot_ref }}"
    force: true
  register: reconcile_controller_snapshot
  tags: [reconcile]

- name: Check for the snapshot's tool environment
  ansible.builtin.stat:
    path: "{{ reconcile_controller_snapshot_dir }}/.venv/bin/ansible-playbook"
  register: reconcile_controller_venv
  tags: [reconcile]

- name: Install the snapshot's pinned tools (hash-checked requirements, collections)
  ansible.builtin.command:
    argv: [make, -C, "{{ reconcile_controller_snapshot_dir }}", bootstrap-tools]
  when: reconcile_controller_snapshot.changed or not reconcile_controller_venv.stat.exists
  changed_when: true
  tags: [reconcile]

- name: Check for the snapshot's vllm-top build
  ansible.builtin.stat:
    path: "{{ reconcile_controller_snapshot_dir }}/vllm-top/target/release/vllm-top"
  register: reconcile_controller_vllm_top
  tags: [reconcile]

# roles/vllm_top_console deploys the binary built on the controller from the in-repo source; the snapshot builds its
# own so the deployed console always matches the snapshot (target/ is gitignored, so the tree stays clean).
- name: Build the snapshot's vllm-top (locked dependencies)
  ansible.builtin.command:
    argv: ["{{ reconcile_controller_cargo }}", build, --release, --locked]
    chdir: "{{ reconcile_controller_snapshot_dir }}/vllm-top"
  when: reconcile_controller_snapshot.changed or not reconcile_controller_vllm_top.stat.exists
  changed_when: true
  tags: [reconcile]

- name: Install the reconciliation units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ reconcile_controller_unit_dir }}/{{ item }}"
    mode: "0644"
  loop: [aihost-reconcile.service, aihost-reconcile.timer]
  register: reconcile_controller_units
  tags: [reconcile]

- name: Establish the reconciliation timer state
  ansible.builtin.systemd_service:
    name: aihost-reconcile.timer
    scope: user
    daemon_reload: "{{ reconcile_controller_units.changed }}"
    enabled: "{{ reconcile_controller_timer_enabled | bool }}"
    state: "{{ 'started' if reconcile_controller_timer_enabled | bool else 'stopped' }}"
  tags: [reconcile]

- name: Validate the extra reconciliation targets
  ansible.builtin.assert:
    that:
      - reconcile_controller_extra_targets is iterable
      - reconcile_controller_target not in reconcile_controller_extra_targets
      - reconcile_controller_extra_targets | select('match', '^[A-Za-z0-9][A-Za-z0-9-]*$') | list | length
        == reconcile_controller_extra_targets | length
    fail_msg: >-
      reconcile_controller_extra_targets must be unique host names (letters, digits, hyphens), distinct from
      reconcile_controller_target; they become part of the unit names and the lock directory.
  tags: [reconcile]

# One service and timer per extra target, from the same templates as the primary pair, so a failure or a held lock on
# one host never blocks another.
- name: Install the reconciliation units of the extra targets
  ansible.builtin.template:
    src: "{{ item.1 }}.j2"
    dest: >-
      {{ reconcile_controller_unit_dir }}/{{
      item.1 | regex_replace('^aihost-reconcile', 'aihost-reconcile-' ~ item.0) }}
    mode: "0644"
  vars:
    reconcile_controller_target: "{{ item.0 }}"
    reconcile_controller_schedule: "{{ reconcile_controller_extra_schedule }}"
    reconcile_controller_unit_lock_dir: "{{ reconcile_controller_lock_dir }}/{{ item.0 }}"
    reconcile_controller_unit_candidate_recovery: false
  loop: >-
    {{ reconcile_controller_extra_targets
       | product(['aihost-reconcile.service', 'aihost-reconcile.timer']) | list }}
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  register: reconcile_controller_extra_units
  tags: [reconcile]

- name: Establish the reconciliation timer state of the extra targets
  ansible.builtin.systemd_service:
    name: "aihost-reconcile-{{ item }}.timer"
    scope: user
    daemon_reload: "{{ reconcile_controller_extra_units.changed }}"
    enabled: "{{ reconcile_controller_timer_enabled | bool }}"
    state: "{{ 'started' if reconcile_controller_timer_enabled | bool else 'stopped' }}"
  loop: "{{ reconcile_controller_extra_targets }}"
  tags: [reconcile]

- name: Create the private gateway backup directory
  ansible.builtin.file:
    path: "{{ reconcile_controller_gateway_backup_root }}"
    state: directory
    mode: "0700"
  when: reconcile_controller_gateway_backup_enabled | bool
  tags: [reconcile, gateway_backup]

- name: Install the gateway backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ reconcile_controller_unit_dir }}/{{ item }}"
    mode: "0644"
  loop: [aihost-gateway-backup.service, aihost-gateway-backup.timer]
  register: reconcile_controller_gateway_backup_units
  tags: [reconcile, gateway_backup]

- name: Establish the gateway backup timer state
  ansible.builtin.systemd_service:
    name: aihost-gateway-backup.timer
    scope: user
    daemon_reload: "{{ reconcile_controller_gateway_backup_units.changed }}"
    enabled: "{{ reconcile_controller_gateway_backup_enabled | bool }}"
    state: "{{ 'started' if (reconcile_controller_gateway_backup_enabled | bool) else 'stopped' }}"
  tags: [reconcile, gateway_backup]

- name: Validate the worker busy-watchdog settings
  ansible.builtin.assert:
    that:
      - reconcile_controller_watchdog_units | length > 0
      - reconcile_controller_watchdog_stuck_after | int >= 30
      - reconcile_controller_watchdog_max_restarts_per_hour | int >= 1
      - reconcile_controller_watchdog_base is match('^https://')
      - reconcile_controller_watchdog_host is match('^[A-Za-z0-9_.@:-]+$')
  tags: [reconcile, worker_watchdog]

- name: Install the worker busy-watchdog unit
  ansible.builtin.template:
    src: aihost-worker-watchdog.service.j2
    dest: "{{ reconcile_controller_unit_dir }}/aihost-worker-watchdog.service"
    mode: "0644"
  register: reconcile_controller_watchdog_unit
  tags: [reconcile, worker_watchdog]

- name: Establish the worker busy-watchdog service state
  ansible.builtin.systemd_service:
    name: aihost-worker-watchdog.service
    scope: user
    daemon_reload: "{{ reconcile_controller_watchdog_unit.changed }}"
    enabled: "{{ reconcile_controller_watchdog_enabled | bool }}"
    state: >-
      {{ 'stopped' if not (reconcile_controller_watchdog_enabled | bool)
         else ('restarted' if reconcile_controller_watchdog_unit.changed else 'started') }}
  tags: [reconcile, worker_watchdog]
