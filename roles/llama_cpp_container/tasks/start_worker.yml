---
- name: "Ensure {{ llama_item.value.service_name }} is enabled and running"
  ansible.builtin.systemd_service:
    name: "{{ llama_item.value.service_name }}"
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if (_llama_units.results | selectattr('item.key', 'equalto', llama_item.key) | map(attribute='changed') | first | default(false)) else 'started' }}"

- name: "Wait for {{ llama_item.key }} to report healthy"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llama_item.value.port }}/health"
    status_code: 200
    timeout: 10
  register: _llama_health
  until: _llama_health.status == 200
  retries: 90
  delay: 10
