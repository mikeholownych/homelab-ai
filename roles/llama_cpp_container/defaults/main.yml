---
# llama.cpp (SYCL) server workers run as rootless-podman systemd services under the
# runtime account, one per GPU, mirroring the vLLM worker layout. Workers are declared in
# llama_cpp_container_workers; the image is pinned by digest (never a floating tag).
llama_cpp_container_enabled: false
llama_cpp_container_image: ghcr.io/ggml-org/llama.cpp
llama_cpp_container_digest: ""
llama_cpp_container_user: "{{ host_runtime_account.name | default('aihost-runtime') }}"
llama_cpp_container_home: "{{ host_runtime_account.home | default('/var/lib/aihost-runtime') }}"
llama_cpp_container_uid: "{{ host_runtime_uid | default(999) }}"
llama_cpp_container_config_root: /etc/local-ai/llama
llama_cpp_container_log_dir: /var/log/local-ai/llama
llama_cpp_container_model_dir: /var/lib/local-ai/models/gguf
# Loopback: the gateway (127.0.0.1) is the only client. Binding all interfaces exposed the workers' API to
# the whole LAN (the ufw rules only masked port 8000 with a leftover temporary deny).
llama_cpp_container_host: 127.0.0.1
# Default server arguments (measured on ai-5820-01: flash attention and large batches
# raise cold prefill; one slot per GPU keeps the full context window per conversation).
llama_cpp_container_default_args: ["-ngl", "99", "--jinja", "-np", "1", "-fa", "on", "-b", "4096", "-ub", "2048",
                                   "--metrics", "--lazy-mode", "on",
                                   "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]
llama_cpp_container_workers: {}
# Services that this role supersedes (stopped and disabled if present), e.g. a vLLM worker.
llama_cpp_container_retired_services: []
llama_cpp_container_retired_unit_files: []
# Configuration directories of superseded services that still embed API keys; removed so a retired
# service's credentials do not linger on disk.
llama_cpp_container_retired_paths: []
# Design 02 L1: per-worker hard reasoning cap (worker key `reasoning_budget`; omit/null for non-reasoning models). The
# message is injected when the budget is spent and must equal orchestrator_gateway_reasoning_budget_message.
llama_cpp_container_reasoning_budget_message: >-
  Reasoning budget exhausted. Stop reasoning now and write the final answer in the required format.
# R5: restarts drain the worker through the gateway admin API first (controller -> remote listener, admin client token).
llama_cpp_container_drain_via_gateway: true
llama_cpp_container_admin_client: ansible-admin
llama_cpp_container_drain_timeout_seconds: 900
# R4: candidate worker profiles (see playbooks/candidate.yml). Units of profiles that are not active are removed.
llama_cpp_container_candidate_profiles: {}
