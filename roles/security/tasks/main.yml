---
- name: Validate security feature inputs
  ansible.builtin.assert:
    that:
      - security_firewall_enabled is boolean
      - security_inference_api_firewall_enabled is boolean
      - security_auditd_enabled is boolean
      - security_management_cidrs is iterable
      - security_inference_api_cidrs is iterable
      - security_inference_api_ports is iterable
      - not security_firewall_enabled | bool or security_management_cidrs | length > 0
      - not security_inference_api_firewall_enabled | bool or security_inference_api_cidrs | length > 0
      - not security_inference_api_firewall_enabled | bool or security_inference_api_ports | length > 0
    fail_msg: >-
      Firewall controls remain disabled until explicit management CIDRs and
      inference API CIDRs and ports are declared.

- name: Record invalid firewall CIDRs and ports
  ansible.builtin.set_fact:
    security_management_cidrs_invalid: "{{ security_management_cidrs | aihost_invalid_cidrs }}"
    security_inference_api_cidrs_invalid: "{{ security_inference_api_cidrs | aihost_invalid_cidrs }}"
    security_inference_api_ports_invalid: "{{ security_inference_api_ports | aihost_invalid_ports }}"

- name: Validate management firewall CIDRs
  ansible.builtin.assert:
    that:
      - security_management_cidrs_invalid | length == 0
    fail_msg: security_management_cidrs must contain valid CIDR networks.

- name: Validate inference firewall CIDRs
  ansible.builtin.assert:
    that:
      - security_inference_api_cidrs_invalid | length == 0
    fail_msg: security_inference_api_cidrs must contain valid CIDR networks.

- name: Validate inference firewall ports
  ansible.builtin.assert:
    that:
      - security_inference_api_ports_invalid | length == 0
    fail_msg: security_inference_api_ports must be YAML integers between 1 and 65535.

- name: Ensure security configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ '0750' if item.endswith('/etc/audit/rules.d') else '0755' }}"
  loop:
    - "{{ (security_root_dir | default('')) ~ '/etc/sudoers.d' }}"
    - "{{ (security_root_dir | default('')) ~ '/etc/audit/rules.d' }}"
    - "{{ security_ufw_state_path | dirname }}"

- name: Read previous managed UFW state
  ansible.builtin.stat:
    path: "{{ security_ufw_state_path }}"
  register: security_ufw_state_manifest

- name: Slurp previous managed UFW state
  ansible.builtin.slurp:
    src: "{{ security_ufw_state_path }}"
  register: security_ufw_state_manifest_content
  when: security_ufw_state_manifest.stat.exists | default(false)

- name: Record previous managed UFW state
  ansible.builtin.set_fact:
    security_ufw_state_previous: >-
      {{
        (
          security_ufw_state_manifest_content.content
          | default('')
          | b64decode
          | from_json
        ) if (security_ufw_state_manifest.stat.exists | default(false)) else {'enabled': false, 'rules': []}
      }}

- name: Build desired managed UFW rule sets
  ansible.builtin.set_fact:
    security_ufw_management_rules: []
    security_ufw_inference_rules: []

- name: Build desired managed SSH UFW rules
  ansible.builtin.set_fact:
    security_ufw_management_rules: >-
      {{
        security_ufw_management_rules
        + [
          {
            'scope': 'management',
            'src': item,
            'port': '22',
            'proto': 'tcp',
            'comment': 'Managed SSH access'
          }
        ]
      }}
  loop: "{{ security_management_cidrs }}"

- name: Build desired managed inference UFW rules
  ansible.builtin.set_fact:
    security_ufw_inference_rules: >-
      {{
        security_ufw_inference_rules | default([])
        + [
          {
            'scope': 'inference',
            'src': item.0,
            'port': item.1 | string,
            'proto': 'tcp',
            'comment': 'Managed inference API access'
          }
        ]
      }}
  loop: "{{ security_inference_api_cidrs | product(security_inference_api_ports) | list }}"
  when: security_inference_api_firewall_enabled | bool

- name: Record desired managed UFW policy state
  ansible.builtin.set_fact:
    security_ufw_desired_rules: >-
      {{
        (security_ufw_management_rules | default([]))
        + (security_ufw_inference_rules | default([]))
      }}
    security_ufw_previous_rules: "{{ security_ufw_state_previous.rules | default([]) }}"
    security_ufw_previous_rule_tokens: >-
      {{ (security_ufw_state_previous.rules | default([])) | map('to_json') | list }}
    security_ufw_desired_rule_tokens: >-
      {{
        (
          (security_ufw_management_rules | default([]))
          + (security_ufw_inference_rules | default([]))
        ) | map('to_json') | list
      }}

- name: Initialize obsolete managed UFW rules
  ansible.builtin.set_fact:
    security_ufw_obsolete_rules: []

- name: Record obsolete managed UFW rules in previous-state order
  ansible.builtin.set_fact:
    security_ufw_obsolete_rules: >-
      {{
        security_ufw_obsolete_rules
        + [item]
      }}
  loop: "{{ security_ufw_previous_rules | default([]) }}"
  when: item not in security_ufw_desired_rules

- name: Install auditd package when enabled
  ansible.builtin.apt:
    name: "{{ security_auditd_package }}"
    state: present
    update_cache: false
  when:
    - security_manage_runtime | bool
    - security_auditd_enabled | bool

- name: Install UFW package when firewalling is enabled
  ansible.builtin.apt:
    name: "{{ security_firewall_package }}"
    state: present
    update_cache: false
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool

- name: Render validated operator sudoers policy
  ansible.builtin.template:
    src: 90-aihost-operators.sudoers.j2
    dest: "{{ security_sudoers_path }}"
    mode: "0440"
    validate: "{{ security_sudoers_validate_command }}"

- name: Render auditd rules for host baseline
  ansible.builtin.template:
    src: 60-aihost-baseline.rules.j2
    dest: "{{ security_auditd_rules_path }}"
    mode: "0640"
  when: security_auditd_enabled | bool
  notify: Restart auditd

- name: Remove auditd rules when disabled
  ansible.builtin.file:
    path: "{{ security_auditd_rules_path }}"
    state: absent
  when: not security_auditd_enabled | bool

- name: Apply practical security sysctl values
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ security_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - security_manage_runtime | bool
    - security_manage_sysctl | bool

- name: Allow SSH only from configured management CIDRs
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src }}"
    comment: "{{ item.comment }}"
  loop: "{{ security_ufw_management_rules | default([]) }}"
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool

- name: Allow inference API only from configured CIDRs
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src }}"
    comment: "{{ item.comment }}"
  loop: "{{ security_ufw_inference_rules | default([]) }}"
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool
    - security_inference_api_firewall_enabled | bool

- name: Delete obsolete managed UFW rules
  community.general.ufw:
    rule: allow
    delete: true
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src }}"
    comment: "{{ item.comment }}"
  loop: "{{ security_ufw_obsolete_rules | default([]) }}"
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool

- name: Delete managed UFW rules when firewall feature is disabled
  community.general.ufw:
    rule: allow
    delete: true
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src }}"
    comment: "{{ item.comment }}"
  loop: "{{ security_ufw_previous_rules | default([]) }}"
  when:
    - security_manage_runtime | bool
    - not security_firewall_enabled | bool
    - (security_ufw_state_previous.enabled | default(false) | bool)

- name: Set UFW default deny incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool

- name: Set UFW default allow outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool

- name: Set UFW logging policy
  community.general.ufw:
    logging: "{{ security_ufw_logging }}"
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool

- name: Enable managed UFW policy
  community.general.ufw:
    state: enabled
  when:
    - security_manage_runtime | bool
    - security_firewall_enabled | bool

- name: Disable managed UFW policy when firewall feature is disabled
  community.general.ufw:
    state: disabled
  when:
    - security_manage_runtime | bool
    - not security_firewall_enabled | bool
    - security_ufw_state_previous.enabled | default(false) | bool

- name: Persist managed UFW state manifest
  ansible.builtin.copy:
    dest: "{{ security_ufw_state_path }}"
    mode: "0600"
    content: >-
      {{
        {
          'enabled': (security_firewall_enabled | bool),
          'rules': (
            security_ufw_desired_rules
            if security_firewall_enabled | bool
            else []
          )
        } | to_nice_json
      }}
