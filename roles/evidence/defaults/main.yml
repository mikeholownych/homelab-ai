---
evidence_root: /var/lib/local-ai/evidence
evidence_owner: root
# The evidence root is shared by role-owned writers that read back as root,
# but runtime service accounts (group render, e.g. aihost-runtime) must be
# able to traverse into the root to write their own pre-created evidence
# files (e.g. the vLLM recovery record). Granting the runtime group rx on
# the root itself keeps per-file content gated by file modes while allowing
# that traversal; root keeps ownership.
evidence_group: "{{ host_runtime_account.group }}"
evidence_directory_mode: "0750"
evidence_host_directory_mode: "0750"
evidence_target_name: "{{ inventory_hostname }}"
evidence_target_pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
