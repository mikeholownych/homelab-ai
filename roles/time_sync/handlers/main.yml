---
- name: Restart selected time synchronization service
  ansible.builtin.systemd:
    name: "{{ 'systemd-timesyncd.service' if time_sync_provider == 'systemd-timesyncd' else 'chrony.service' }}"
    state: restarted
  when:
    - time_sync_manage_runtime | bool
    - time_sync_manage_services | bool
    - >-
      (time_sync_provider == 'systemd-timesyncd' and 'systemd-timesyncd.service' in ansible_facts.services) or
      (time_sync_provider == 'chrony' and 'chrony.service' in ansible_facts.services)
