---
- name: Restart selected time synchronization service
  ansible.builtin.systemd:
    name: "{{ 'systemd-timesyncd.service' if time_sync_provider == 'systemd-timesyncd' else 'chrony.service' }}"
    state: restarted
  when:
    - time_sync_manage_runtime | bool
    - time_sync_manage_services | bool
    - >-
      (time_sync_provider == 'systemd-timesyncd' and
       (ansible_facts.services['systemd-timesyncd.service'].status | default('not-found')) != 'not-found') or
      (time_sync_provider == 'chrony' and
       (ansible_facts.services['chrony.service'].status | default('not-found')) != 'not-found')
