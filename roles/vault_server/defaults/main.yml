---
# Vault server deployment is deliberately separate from site.yml and commission.yml.
# Override these only in an approved, isolated vault_servers inventory.
vault_server_manage: false
vault_server_version: "2.1.1"
vault_server_archive_sha256: "8aa90f9cea46f541fc7baa3d0ec692fc06afde9a248cc1f2dcac46a567c6f56b"
vault_server_arch: amd64
vault_server_download_base: "https://releases.hashicorp.com/vault"
vault_server_install_dir: /usr/local/bin
vault_server_config_dir: /etc/vault.d
vault_server_data_dir: /var/lib/vault
vault_server_min_free_bytes: 0
vault_server_managed_marker: "{{ vault_server_config_dir }}/.aihost-managed-vault-server"
vault_server_tls_dir: /etc/vault.d/tls
vault_server_listener_address: ""
vault_server_api_addr: ""
vault_server_cluster_addr: ""
vault_server_tls_cert_file: ""
vault_server_tls_key_file: ""
vault_server_tls_ca_file: ""
vault_server_tls_server_name: ""
vault_server_tls_min_validity_seconds: 2592000
vault_server_service_enabled: false
vault_server_service_started: false
