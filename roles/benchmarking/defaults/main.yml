---
benchmarking_enabled: true
benchmarking_active_profile: "medium_27b"
benchmarking_evidence_dir: "/var/lib/aihost/evidence"
benchmarking_install_dir: /usr/local/libexec
benchmarking_harness_path: "{{ benchmarking_install_dir }}/local-ai-run-benchmark"
benchmarking_output_path: "{{ benchmarking_evidence_dir }}/benchmark.json"

# Execution mode: simulated until physical acceptance; real drives a live
# endpoint and never fabricates results.
benchmarking_mode: simulated
benchmarking_runtime: vllm
benchmarking_base_url: "http://127.0.0.1:8000"
benchmarking_auth_env_file: >-
  {{ ('/etc/local-ai/vllm/vllm.env' if benchmarking_runtime == 'vllm'
      else '/etc/local-ai/llama.cpp/llama.env') }}
benchmarking_api_key_env: "{{ 'VLLM_API_KEY' if benchmarking_runtime == 'vllm' else 'LLAMA_API_KEY' }}"
benchmarking_prompt: "Write a short sentence about efficient inference."
benchmarking_max_new_tokens: 128
benchmarking_iterations: 5
benchmarking_request_timeout_sec: 120
benchmarking_min_generation_tokens_per_sec: 5.0

# Scheduled benchmark profile split. When non-empty, a scheduled benchmark run
# executes each listed profile once (one evidence file per profile) and emits a
# split index instead of a single active-profile run; keep empty to preserve
# the current single active profile behaviour. The scheduled set must contain
# only defined profiles, no duplicates, and must fit the total duration budget.
benchmarking_scheduled_profiles: []
benchmarking_scheduled_index_path: "{{ benchmarking_evidence_dir }}/benchmark-scheduled.json"
benchmarking_scheduled_max_total_duration_seconds: 900

# Thermal and power guardrails; the harness refuses to run outside these.
benchmarking_psu_capacity_watts: 1000
benchmarking_gpu_tdp_watts: 225
benchmarking_system_base_power_watts: 250
benchmarking_power_headroom_pct: 20.0
benchmarking_abort_temperature_c: 90

# B0 frozen runtime identity. Every evidence bundle is attributed to these ids;
# changing them is part of an authorized baseline bump, not a routine tweak.
# The load matrix (see roles/benchmarking/files/b0-matrix.json) references the
# same B0 identity and must not be run against a different baseline.
benchmarking_baseline_id: B0
benchmarking_config_id: b0
benchmarking_model: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
benchmarking_revision: main
benchmarking_quantization: AWQ-4bit
# Frozen declared artifact digest for B0 attribution. The deployment is a
# systemd runner (not podman), so the digest is not discoverable at runtime;
# it is carried as declared attribution on the run card via --artifact-sha256.
benchmarking_model_artifact_sha256: "4bdfd5b928b4a6a95c92b1edc861f13587a797a32db8c1bc96ca4e2c0d58629d"
benchmarking_service_unit: vllm.service
benchmarking_container_name: vllm-xpu

# Workload-shaping fallbacks for profiles that omit explicit classes/rates.
# Profiles override each of these per load point.
benchmarking_default_prompt_class: short
benchmarking_default_output_class: short
benchmarking_default_concurrency: 1
benchmarking_default_requests: 20
benchmarking_default_warmup_requests: 5
benchmarking_default_max_new_tokens: 512
benchmarking_default_max_deviation_pct: 5.0

benchmarking_profiles:
  small:
    description: "Small single-GPU model inference benchmark"
    gpu_count: 1
    tensor_parallelism: 1
    context_window_tokens: 4096
    duration_seconds: 30.0
    prompt_class: short
    output_class: short
    concurrency: 1
    requests: 10
    warmup_requests: 3
    max_new_tokens: 512
  medium_32b:
    description: "30-32B single-GPU model inference benchmark"
    gpu_count: 1
    tensor_parallelism: 1
    context_window_tokens: 8192
    duration_seconds: 60.0
    prompt_class: medium
    output_class: short
    concurrency: 8
    requests: 20
    warmup_requests: 5
    max_new_tokens: 512
  medium_27b:
    description: "27B dual-GPU model inference benchmark"
    gpu_count: 2
    tensor_parallelism: 2
    context_window_tokens: 8192
    duration_seconds: 60.0
    prompt_class: medium
    output_class: short
    concurrency: 8
    requests: 20
    warmup_requests: 5
    max_new_tokens: 512
  large_70b:
    description: "70B dual-GPU model inference benchmark"
    gpu_count: 2
    tensor_parallelism: 2
    context_window_tokens: 8192
    duration_seconds: 60.0
    prompt_class: large
    output_class: medium
    concurrency: 8
    requests: 15
    warmup_requests: 5
    max_new_tokens: 2048
  low_precision_moe:
    description: "Supported low-precision MoE model benchmark"
    gpu_count: 2
    tensor_parallelism: 2
    context_window_tokens: 4096
    duration_seconds: 60.0
    prompt_class: medium
    output_class: short
    concurrency: 8
    requests: 20
    warmup_requests: 5
    max_new_tokens: 512
  sustained_load:
    description: "Sustained thermal and load test"
    gpu_count: 2
    tensor_parallelism: 2
    context_window_tokens: 16384
    duration_seconds: 300.0
    prompt_class: medium
    output_class: medium
    concurrency: 16
    requests: 40
    warmup_requests: 10
    max_new_tokens: 2048
