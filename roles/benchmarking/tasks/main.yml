---
- name: Install the benchmark harness on the managed node
  ansible.builtin.copy:
    src: run_benchmark.py
    dest: "{{ benchmarking_harness_path }}"
    owner: root
    group: root
    mode: "0755"
  tags: [benchmark, operations]

- name: Verify deployed benchmark harness source identity
  ansible.builtin.stat:
    path: "{{ benchmarking_harness_path }}"
    checksum_algorithm: sha256
  register: benchmarking_harness_deployed
  changed_when: false
  tags: [benchmark, operations]

- name: Fail closed when the deployed benchmark harness diverges from source
  ansible.builtin.assert:
    that:
      - benchmarking_harness_deployed.stat.exists
      - benchmarking_harness_deployed.stat.checksum ==
        (lookup('ansible.builtin.file', role_path + '/files/run_benchmark.py') | hash('sha256'))
    fail_msg: >-
      deployed benchmark harness does not match the repository source;
      refusing to continue toward benchmark execution.
  tags: [benchmark, operations]

- name: Resolve active tuning profile revision for benchmark provenance
  ansible.builtin.set_fact:
    benchmarking_tuning_revision: >-
      {{ (lookup('ansible.builtin.file',
         role_path + '/../../profiles/tuning/' + (os_tuning_profile | default('baseline')) + '.yml',
         errors='ignore') | from_yaml).revision | default('unknown') }}
  when: not ansible_check_mode
  tags: [benchmark, operations]

- name: Validate benchmark inputs
  ansible.builtin.assert:
    that:
      - benchmarking_enabled is boolean
      - benchmarking_active_profile in benchmarking_profiles
    fail_msg: >-
      benchmarking requires an allowed profile name.
  tags: [benchmark, operations]

- name: Ensure evidence directory exists for benchmarks
  ansible.builtin.file:
    path: "{{ benchmarking_evidence_dir }}"
    state: directory
  # Ownership/mode of the shared evidence root is owned by the evidence role;
  # re-asserting root:root 0750 here would fight that role (and block the
  # runtime account from traversing to its own pre-created recovery record).
  tags: [benchmark, operations]

- name: Resolve scheduled benchmark profile split
  ansible.builtin.set_fact:
    benchmarking_scheduled_run: "{{ benchmarking_scheduled_profiles | length > 0 }}"
    benchmarking_run_profiles: >-
      {{ benchmarking_scheduled_profiles
         if (benchmarking_scheduled_profiles | length > 0)
         else [benchmarking_active_profile] }}
  tags: [benchmark, operations]

- name: Validate scheduled benchmark profile split
  ansible.builtin.assert:
    that:
      - benchmarking_run_profiles | length > 0
      - >-
        benchmarking_run_profiles | difference(benchmarking_profiles | list) | length == 0
      - >-
        benchmarking_run_profiles | length == (benchmarking_run_profiles | unique | length)
      - >-
        (benchmarking_run_profiles
        | map('extract', benchmarking_profiles, 'duration_seconds')
        | map('float', 30.0) | sum) <= benchmarking_scheduled_max_total_duration_seconds
    fail_msg: >-
      scheduled benchmark profiles must be a non-empty allowed, duplicate-free
      set within the split budget of
      {{ benchmarking_scheduled_max_total_duration_seconds }}s.
  tags: [benchmark, operations]

- name: Run inference benchmark harness
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', benchmarking_harness_path, '--profile', item, '--hostname',
           inventory_hostname, '--git-sha',
           (git_commit_sha | default('0000000000000000000000000000000000000000')),
           '--mode', benchmarking_mode, '--runtime', benchmarking_runtime,
           '--base-url', benchmarking_base_url,
           '--auth-env-file', benchmarking_auth_env_file,
           '--api-key-env', benchmarking_api_key_env,
           '--iterations', (benchmarking_iterations | string),
           '--duration', (benchmarking_profiles[item].duration_seconds | default(30) | string),
           '--tensor-parallelism', (benchmarking_profiles[item].tensor_parallelism | string),
           '--gpu-count', (benchmarking_profiles[item].gpu_count | string),
           '--context-window-tokens', (benchmarking_profiles[item].context_window_tokens | default(4096) | string),
           '--psu-capacity-watts', (benchmarking_psu_capacity_watts | string),
           '--gpu-tdp-watts', (benchmarking_gpu_tdp_watts | string),
           '--system-base-power-watts', (benchmarking_system_base_power_watts | string),
           '--power-headroom-pct', (benchmarking_power_headroom_pct | string),
           '--abort-temperature-c', (benchmarking_abort_temperature_c | string),
           '--baseline-id', benchmarking_baseline_id,
           '--config-id', benchmarking_config_id,
           '--model', (benchmarking_profiles[item].model | default(benchmarking_model)),
           '--revision', (benchmarking_profiles[item].revision | default(benchmarking_revision)),
           '--artifact-sha256', (benchmarking_profiles[item].artifact_sha256 | default(benchmarking_model_artifact_sha256)),
           '--quantization', (benchmarking_profiles[item].quantization | default(benchmarking_quantization)),
           '--service-unit', (benchmarking_profiles[item].service_unit | default(benchmarking_service_unit)),
           '--container-name', (benchmarking_profiles[item].container_name | default(benchmarking_container_name)),
           '--prompt-class', (benchmarking_profiles[item].prompt_class | default(benchmarking_default_prompt_class)),
           '--output-class', (benchmarking_profiles[item].output_class | default(benchmarking_default_output_class)),
           '--concurrency', (benchmarking_profiles[item].concurrency | default(benchmarking_default_concurrency) | string),
           '--requests', (benchmarking_profiles[item].requests | default(benchmarking_default_requests) | string),
           '--warmup-requests', (benchmarking_profiles[item].warmup_requests | default(benchmarking_default_warmup_requests) | string),
           '--max-new-tokens', (benchmarking_profiles[item].max_new_tokens | default(benchmarking_default_max_new_tokens) | string),
           '--max-deviation-pct', (benchmarking_profiles[item].max_deviation_pct | default(benchmarking_default_max_deviation_pct) | string),
           '--output',
           ((benchmarking_evidence_dir ~ '/benchmarks/simulated/' ~
              (benchmarking_scheduled_run | ternary('benchmark-' ~ item ~ '.json', 'benchmark.json')))
              if benchmarking_mode == 'simulated'
              else (benchmarking_evidence_dir ~ '/' ~
              (benchmarking_scheduled_run | ternary('benchmark-' ~ item ~ '.json', 'benchmark.json'))))]
           + ['--evidence-dir', benchmarking_evidence_dir] }}
  loop: "{{ benchmarking_run_profiles }}"
  loop_control:
    label: "{{ item }}"
  register: benchmarking_run
  changed_when: false
  environment:
    AIHOST_BENCH_TUNING_PROFILE: "{{ os_tuning_profile | default('baseline') }}"
    AIHOST_BENCH_TUNING_REVISION: "{{ benchmarking_tuning_revision | default(omit) }}"
    AIHOST_BENCH_NUMA_POLICY: "{{ benchmarking_numa_policy | default(omit) }}"
    AIHOST_BENCH_MEMBIND_NODES: "{{ benchmarking_membind_nodes | default(omit) }}"
  when: not ansible_check_mode
  tags: [benchmark, operations]

- name: Map scheduled benchmark profile evidence outputs
  ansible.builtin.set_fact:
    benchmarking_scheduled_evidence_outputs: >-
      {{ benchmarking_scheduled_evidence_outputs | default([]) +
         [benchmarking_evidence_dir ~ '/benchmark-' ~ item ~ '.json'] }}
  loop: "{{ benchmarking_run_profiles }}"
  tags: [benchmark, operations]

- name: Emit scheduled benchmark evidence index
  ansible.builtin.copy:
    dest: "{{ benchmarking_scheduled_index_path }}"
    mode: "0640"
    content: >-
      {{ {'split': true, 'profiles': benchmarking_run_profiles,
          'outputs': benchmarking_scheduled_evidence_outputs} | to_nice_json }}
  when:
    - not ansible_check_mode
    - benchmarking_scheduled_run
  tags: [benchmark, operations]
