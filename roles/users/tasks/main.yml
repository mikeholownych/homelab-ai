---
- name: Validate declared service accounts
  ansible.builtin.assert:
    that:
      - item.name is match("^[a-z_][a-z0-9_-]*$")
      - item.shell == "/usr/sbin/nologin"
      - item.system | default(true) | bool
    fail_msg: Service accounts must be system-scoped, named safely, and use /usr/sbin/nologin.
  loop: "{{ users_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | default(true) | bool

- name: Validate declared operator accounts
  ansible.builtin.assert:
    that:
      - item.name is match("^[a-z_][a-z0-9_-]*$")
      - item.ssh_keys is defined
      - item.ssh_keys | length > 0
      - item.sudo_policy in users_valid_sudo_policies
      - item.password is not defined
    fail_msg: >-
      Operator accounts must be named safely, provide at least one SSH key,
      declare sudo_policy, and omit passwords.
  loop: "{{ users_operator_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure explicitly managed groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ users_managed_groups }}"
  when:
    - users_manage_runtime | bool
    - users_managed_groups | length > 0

- name: Ensure declared service accounts exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: "{{ item.create_home | default(false) }}"
    groups: "{{ (item.groups | default([])) | join(',') or omit }}"
    append: true
    state: present
  loop: "{{ users_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_runtime | bool
    - item.enabled | default(true) | bool

- name: Ensure declared operator users exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default(users_operator_default_shell) }}"
    groups: "{{ (item.groups | default([])) | join(',') or omit }}"
    append: true
    create_home: true
    state: present
  loop: "{{ users_operator_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: users_manage_runtime | bool

- name: Secure operator home directories
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "{{ users_operator_home_mode }}"
  loop: "{{ users_operator_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: users_manage_runtime | bool

- name: Ensure operator SSH directories exist
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ users_operator_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: users_manage_runtime | bool

- name: Install operator authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    exclusive: false
  loop: "{{ users_operator_accounts | subelements('ssh_keys') }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: users_manage_runtime | bool

- name: Secure operator authorized_keys files
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}/.ssh/authorized_keys"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "{{ users_authorized_keys_path_mode }}"
    state: file
  loop: "{{ users_operator_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  when: users_manage_runtime | bool
