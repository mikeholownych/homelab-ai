---
- name: Validate users role inputs
  ansible.builtin.assert:
    that:
      - users_disabled_operator_state in ["lock", "absent"]
      - operator_users is iterable
      - users_local_ai_device_groups is iterable
      - (users_local_ai_device_groups | difference(["render", "video"])) | length == 0
      - users_local_ai_service_account.name is match("^[a-z_][a-z0-9_-]*$")
      - users_local_ai_service_account.system | bool
      - users_local_ai_service_account.shell == "/usr/sbin/nologin"
    fail_msg: >-
      users must declare a safe disabled-user policy, inventory-driven operator
      users, and a least-privilege local-ai service account.

- name: Validate declared operator users
  ansible.builtin.assert:
    that:
      - item.name is match("^[a-z_][a-z0-9_-]*$")
      - item.enabled | default(true) is boolean
      - item.sudo | default(false) is boolean
      - item.sudo_passwordless_all | default(false) is boolean
      - item.sudo_nopasswd | default(false) is boolean
      - item.preserved_groups | default([]) is iterable
      - item.password is not defined
      - >-
        not (item.enabled | default(true) | bool)
        or (item.ssh_authorized_keys | default([]) | length > 0)
      - >-
        not (item.sudo | default(false) | bool)
        or (
          item.sudo_passwordless_all | default(false) | bool
          or item.sudo_commands | default([]) | length > 0
        )
      - >-
        (
          item.sudo_commands | default([])
          | reject("match", "^/.+")
          | list
          | length
        ) == 0
    fail_msg: >-
      Enabled operators must define non-empty ssh_authorized_keys, omit
      passwords, and use explicit sudo_commands unless passwordless-all is
      opted in.
  loop: "{{ operator_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Gather runtime group database for local-ai service account
  ansible.builtin.getent:
    database: group
    split: ":"
  when:
    - users_manage_runtime | bool
    - users_local_ai_device_groups | length > 0
    - not users_local_ai_manage_device_groups | bool

- name: Ensure explicitly managed local-ai device groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ users_local_ai_device_groups }}"
  when:
    - users_manage_runtime | bool
    - users_local_ai_manage_device_groups | bool

- name: Select effective local-ai supplemental groups
  ansible.builtin.set_fact:
    users_local_ai_effective_groups: >-
      {{
        (
          users_local_ai_device_groups
          + (users_local_ai_service_account.preserved_groups | default([]))
        )
        | unique
        if users_local_ai_manage_device_groups | bool
        else
        (
          (
            users_local_ai_device_groups
            + (users_local_ai_service_account.preserved_groups | default([]))
          )
          | select("in", (ansible_facts.getent_group | default({})).keys() | list)
          | list
        )
      }}

- name: Ensure local-ai service account exists
  ansible.builtin.user:
    name: "{{ users_local_ai_service_account.name }}"
    comment: "{{ users_local_ai_service_account.comment | default(omit) }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ users_local_ai_service_account.home }}"
    create_home: "{{ users_local_ai_service_account.create_home | default(true) }}"
    groups: "{{ (users_local_ai_effective_groups | default([])) | join(',') }}"
    append: false
    state: present
  when:
    - users_manage_runtime | bool
    - users_local_ai_service_account.enabled | default(true) | bool

- name: Ensure local-ai service account home exists with secure mode
  ansible.builtin.file:
    path: "{{ users_local_ai_service_account.home }}"
    state: directory
    mode: "0750"
  when:
    - users_manage_runtime | bool
    - users_local_ai_service_account.enabled | default(true) | bool
    - users_local_ai_service_account.create_home | default(true) | bool

- name: Remove disabled local-ai service account when explicitly disabled
  ansible.builtin.user:
    name: "{{ users_local_ai_service_account.name }}"
    state: absent
    remove: false
  when:
    - users_manage_runtime | bool
    - not users_local_ai_service_account.enabled | default(true) | bool

- name: Ensure enabled operator users exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default(users_operator_default_shell) }}"
    groups: "{{ ((item.groups | default([])) + (item.preserved_groups | default([]))) | unique | join(',') }}"
    append: false
    create_home: true
    home: "{{ item.home | default(omit) }}"
    state: present
  loop: "{{ operator_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_runtime | bool
    - item.enabled | default(true) | bool

- name: Lock disabled operator users
  ansible.builtin.user:
    name: "{{ item.name }}"
    password_lock: true
    shell: /usr/sbin/nologin
    state: present
  loop: "{{ operator_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_runtime | bool
    - not item.enabled | default(true) | bool
    - users_disabled_operator_state == "lock"

- name: Remove disabled operator users when absent is configured
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: absent
    remove: false
  loop: "{{ operator_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_runtime | bool
    - not item.enabled | default(true) | bool
    - users_disabled_operator_state == "absent"

- name: Secure enabled operator home directories
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "{{ users_operator_home_mode }}"
  loop: "{{ operator_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_runtime | bool
    - item.enabled | default(true) | bool

- name: Ensure enabled operator SSH directories exist
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "{{ users_operator_ssh_dir_mode }}"
  loop: "{{ operator_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_runtime | bool
    - item.enabled | default(true) | bool

- name: Select enabled operator key records
  ansible.builtin.set_fact:
    users_enabled_operator_key_records: >-
      {{
        (
          operator_users
          | selectattr('enabled', 'undefined')
          | list
        )
        + (
          operator_users
          | selectattr('enabled', 'defined')
          | selectattr('enabled')
          | list
        )
      }}

- name: Install enabled operator authorized keys authoritatively
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ (item.ssh_authorized_keys | default([])) | join('\n') }}"
    state: present
    exclusive: true
    manage_dir: false
  loop: "{{ users_enabled_operator_key_records | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: users_manage_runtime | bool

- name: Secure enabled operator authorized_keys files
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' ~ item.name) }}/.ssh/authorized_keys"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "{{ users_authorized_keys_path_mode }}"
    state: file
  loop: "{{ operator_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_runtime | bool
    - item.enabled | default(true) | bool
- name: Provision subordinate id ranges for the runtime identity
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    line: "{{ users_local_ai_service_account.name }}:{{ users_runtime_subuid_first }}:{{ users_runtime_subuid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - { path: /etc/subuid }
    - { path: /etc/subgid }
  when:
    - users_local_ai_service_account.enabled | default(true) | bool
    - users_runtime_rootless_enabled | bool
    - users_manage_runtime | bool
  tags: [users, baseline]

- name: Enable lingering for the runtime identity under rootless runtimes
  ansible.builtin.command:
    argv: ["loginctl", "enable-linger", "{{ users_local_ai_service_account.name }}"]
  register: users_linger_result
  changed_when: users_linger_result.rc == 0
  failed_when: >-
    users_linger_result.rc != 0 and 'not found' not in users_linger_result.stderr | default('')
  when:
    - users_local_ai_service_account.enabled | default(true) | bool
    - users_runtime_rootless_enabled | bool
    - users_manage_runtime | bool
    - not ansible_check_mode
  tags: [users, baseline]
