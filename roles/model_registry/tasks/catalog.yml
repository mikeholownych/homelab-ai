---
# Curated catalog validation. The catalog is advisory documentation plus
# validated sizing guidance; it never mutates state and never feeds the declared
# desired state (model_registry_models stays empty until commissioning pins real
# revisions and artifact hashes).
- name: Load curated model catalog
  ansible.builtin.set_fact:
    model_registry_catalog: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/files/model-catalog.yml') | from_yaml }}
  tags: [models]

- name: Validate curated catalog structure
  ansible.builtin.assert:
    that:
      - model_registry_catalog | aihost_catalog_invalid_entries | length == 0
    fail_msg: >-
      Curated model catalog has structural problems:
      {{ model_registry_catalog | aihost_catalog_invalid_entries }}
  tags: [models]

- name: Validate every deployable variant honors the per-device VRAM pool
  ansible.builtin.assert:
    that:
      - model_registry_catalog | aihost_catalog_excess_variants | length == 0
    fail_msg: >-
      Catalog variants exceed the per-device VRAM pool (tp=null variants are
      intentionally non-deployable):
      {{ model_registry_catalog | aihost_catalog_excess_variants }}
  tags: [models]

- name: Report catalog assessment outcome
  ansible.builtin.debug:
    msg: "Curated model catalog validated: {{ model_registry_catalog.model_catalog_entries | length }} entries."
  tags: [models]
