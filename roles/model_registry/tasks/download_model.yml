---
# Single-model materialization: per-artifact downloads with native checksum
# enforcement, atomic promotion into the cache, then a stamp recording exactly
# what landed. get_url is idempotent; the stamp gates whole-revision rework.
- name: Prepare staging area for {{ model_entry.key }}
  ansible.builtin.file:
    path: "{{ model_registry_staging_dir }}/{{ model_entry.key }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [models]

- name: Read optional HuggingFace token from Vault for gated repositories
  ansible.builtin.include_role:
    name: vault_integration
    tasks_from: main.yml
  vars:
    vault_integration_operation: read
    vault_integration_secret_ref: "{{ model_registry_hf_token_secret_path }}"
    vault_integration_required_secret_keys:
      - "{{ model_registry_hf_token_secret_file_key }}"
  when: model_registry_hf_token_secret_path is not none
  no_log: true
  tags: [models, vault]

- name: Resolve effective Hugging Face authentication token
  ansible.builtin.set_fact:
    _model_registry_effective_hf_token: >-
      {{
        vault_integration_secret[model_registry_hf_token_secret_file_key]
        if (vault_integration_secret is defined and vault_integration_secret and
            model_registry_hf_token_secret_file_key in vault_integration_secret)
        else (model_registry_hf_token | default(lookup('ansible.builtin.env', 'HF_TOKEN') | default(none, true)))
      }}
  no_log: true
  tags: [models]

- name: Verify disk budget headroom and minimum 120GB available space prior to downloading model weights
  ansible.builtin.assert:
    that:
      - (model_registry_cache_free_gib | default(1000) | float) >= 120.0
      - (model_entry.value.size_gib | default(0) | float) <= (model_registry_cache_free_gib | default(1000) | float)
    fail_msg: >-
      Insufficient disk space for model '{{ model_entry.key }}': minimum 120 GiB required on partition (observed
      {{ model_registry_cache_free_gib | default('unknown') }} GiB) and model requires
      {{ model_entry.value.size_gib | default(0) }} GiB.
  tags: [models]

- name: Verify credential presence or local cache availability before remote mirror access
  ansible.builtin.assert:
    that:
      - >-
        (_model_registry_effective_hf_token is not none and
         (_model_registry_effective_hf_token | string | trim | length > 0)) or
        ((model_entry.value.local_cache_path | default('')) | length > 0) or
        ((model_registry_cache_root ~ '/' ~ model_entry.key ~ '/' ~ model_entry.value.revision) is directory)
    fail_msg: >-
      Credential check failed for model '{{ model_entry.key }}': neither active HF_TOKEN nor
      verified local disk cache path was found.
  when:
    - model_entry.value.auth_required | default(false) | bool or (model_registry_require_auth | default(false) | bool)
  tags: [models]

- name: Download pinned artifacts with checksum enforcement
  ansible.builtin.get_url:
    url: >-
      {{ model_registry_hf_endpoint }}/{{ model_entry.value.repo_id }}
      /resolve/{{ model_entry.value.revision }}/{{ artifact.path }}
    dest: "{{ model_registry_staging_dir }}/{{ model_entry.key }}/{{ artifact.path | basename }}"
    checksum: "sha256:{{ artifact.sha256 }}"
    mode: "0640"
    owner: root
    group: root
    timeout: "{{ model_registry_http_timeout_sec }}"
    headers: >-
      {{
        {'Authorization': 'Bearer ' ~ _model_registry_effective_hf_token}
        if (_model_registry_effective_hf_token is not none and _model_registry_effective_hf_token | length > 0)
        else omit
      }}
  loop: "{{ model_entry.value.artifacts }}"
  loop_control:
    label: "{{ artifact.path }}"
  when: not ansible_check_mode
  no_log: "{{ _model_registry_effective_hf_token is not none and _model_registry_effective_hf_token | length > 0 }}"
  tags: [models]

- name: Promote verified revision into the cache atomically
  ansible.builtin.copy:
    src: "{{ model_registry_staging_dir }}/{{ model_entry.key }}/"
    dest: "{{ model_registry_cache_root }}/{{ model_entry.key }}/{{ model_entry.value.revision }}/"
    remote_src: true
    owner: root
    group: root
    mode: preserve
    directory_mode: "0750"
  tags: [models]

- name: Record materialization stamp
  ansible.builtin.copy:
    content: "{{ model_entry.value | aihost_model_stamp }}\n"
    dest: "{{ model_registry_work_dir }}/{{ model_entry.key }}.stamp"
    owner: root
    group: root
    mode: "0644"
  tags: [models]
