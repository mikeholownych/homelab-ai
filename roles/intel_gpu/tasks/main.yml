---
- name: Refuse unresolved Intel B65 host-stack installation
  ansible.builtin.fail:
    msg: "{{ intel_gpu_support_blocker }}"
  when: intel_gpu_install_enabled | bool
  tags: [gpu, runtime]

- name: Record Intel GPU validation as NOT_TESTED in check mode
  ansible.builtin.set_fact:
    intel_gpu_validation_status: NOT_TESTED
    intel_gpu_validation_reason: check mode does not execute physical probes or trust simulated absent changes
  when: ansible_check_mode
  tags: [gpu, validation]

- name: Gather installed package facts for physical GPU preflight
  ansible.builtin.package_facts:
    manager: apt
  when:
    - intel_gpu_physical_validation_enabled | bool
    - not ansible_check_mode
  tags: [gpu, validation]

- name: Require Ubuntu 24.04 package identity and Intel-required 6.17 HWE kernel
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_kernel is version(intel_gpu_minimum_kernel, '>=')
      - "'base-files' in ansible_facts.packages"
    fail_msg: Physical B65 validation requires an installed Ubuntu 24.04 base-files package and running kernel 6.17+.
  when:
    - intel_gpu_physical_validation_enabled | bool
    - not ansible_check_mode
  tags: [gpu, validation]

- name: Run trusted BDF-correlated hardware inventory when explicitly commissioned
  ansible.builtin.include_role:
    name: hardware_inventory
  when:
    - intel_gpu_physical_validation_enabled | bool
    - not ansible_check_mode
  tags: [gpu, inventory, hardware, validation]

- name: Record expected Intel GPU contract for normalized evidence
  ansible.builtin.set_fact:
    intel_gpu_expected_contract:
      count: "{{ intel_gpu_expected_count }}"
      pci_ids: "{{ intel_gpu_target_pci_ids }}"
      vram_gib: "{{ intel_gpu_expected_vram_gib }}"
      vram_tolerance_gib: "{{ intel_gpu_vram_tolerance_gib }}"
  when:
    - intel_gpu_physical_validation_enabled | bool
    - not ansible_check_mode
  tags: [gpu, validation]

- name: Run trusted topology and Level Zero classifier when explicitly commissioned
  ansible.builtin.include_role:
    name: hardware_validation
  when:
    - intel_gpu_physical_validation_enabled | bool
    - not ansible_check_mode
  tags: [gpu, hardware, validation]

- name: Load normalized BDF-correlated hardware result
  ansible.builtin.slurp:
    src: "{{ hardware_validation_evidence_dir }}/hardware.json"
  register: intel_gpu_hardware_document
  when:
    - intel_gpu_physical_validation_enabled | bool
    - not ansible_check_mode
  tags: [gpu, validation]

- name: Require independently classified GPU, PCIe, ReBAR, VRAM and Level Zero state
  ansible.builtin.assert:
    that:
      - (intel_gpu_hardware_document.content | b64decode | from_json).status == 'pass'
      - not (intel_gpu_hardware_document.content | b64decode | from_json).simulated
    fail_msg: BDF-correlated hardware classification did not pass; no Intel GPU runtime PASS evidence is emitted.
  when:
    - intel_gpu_physical_validation_enabled | bool
    - not ansible_check_mode
  tags: [gpu, validation]

# hardware_inventory records PCI IDs, firmware, kernel driver, PCIe and Level Zero data.
# hardware_validation binds Level Zero memory to the same PCI BDF and applies VRAM tolerance and ReBAR policy.
