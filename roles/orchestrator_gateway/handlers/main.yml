---
- name: Reload gateway systemd unit
  ansible.builtin.systemd_service:
    name: aihost-orchestrator-gateway.service
    daemon_reload: >-
      {{ (orchestrator_gateway_unit.changed | default(false) | bool)
         or (orchestrator_gateway_removed_dropins.changed | default(false) | bool) }}

- name: Restart gateway service
  ansible.builtin.systemd_service:
    name: aihost-orchestrator-gateway.service
    daemon_reload: >-
      {{ (orchestrator_gateway_unit.changed | default(false) | bool)
         or (orchestrator_gateway_removed_dropins.changed | default(false) | bool) }}
    state: restarted
  when: not ansible_check_mode

- name: Update controller CA trust store
  ansible.builtin.command:
    argv:
      - update-ca-certificates
  changed_when: true
  delegate_to: localhost
  become: true

- name: Reload gateway CAIS state
  # SIGHUP re-reads the authoritative CAIS directory in place (no restart, in-flight work continues). A failed load
  # leaves capability requests failing closed and legacy routing untouched.
  ansible.builtin.command:
    argv: [systemctl, kill, --signal=HUP, aihost-orchestrator-gateway.service]
  changed_when: true
  when: not ansible_check_mode
