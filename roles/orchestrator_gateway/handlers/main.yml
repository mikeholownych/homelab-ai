---
- name: Reload gateway systemd unit
  ansible.builtin.systemd_service:
    name: aihost-orchestrator-gateway.service
    daemon_reload: true

- name: Restart gateway service
  ansible.builtin.systemd_service:
    name: aihost-orchestrator-gateway.service
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Update controller CA trust store
  ansible.builtin.command:
    argv:
      - update-ca-certificates
  changed_when: true
  delegate_to: localhost
  become: true
