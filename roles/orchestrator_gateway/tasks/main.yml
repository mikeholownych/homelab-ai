---
- name: Validate T5820 gateway inputs
  ansible.builtin.assert:
    that:
      # exactly two production workers; candidates (R4) are additional
      - >-
        (orchestrator_gateway_workers | rejectattr('role', 'defined') | list | length)
        + (orchestrator_gateway_workers | selectattr('role', 'defined') | selectattr('role', 'equalto', 'production')
           | list | length) == 2
      - orchestrator_gateway_port == 8010
      - orchestrator_gateway_local_listener_mode == "local"
      - >-
        orchestrator_gateway_workers | selectattr('credential_name', 'defined') | list | length
        == orchestrator_gateway_workers | length
      - >-
        orchestrator_gateway_workers | selectattr('credential_source', 'defined') | list | length
        == orchestrator_gateway_workers | length
      - orchestrator_gateway_http_dispatch_limit | int > 0
      - orchestrator_gateway_http_client_dispatch_limit | int > 0
      - orchestrator_gateway_http_client_dispatch_limit | int <= orchestrator_gateway_http_dispatch_limit | int
      - orchestrator_gateway_tokenize_limit | int > 0
      - orchestrator_gateway_http_connection_limit | int >= orchestrator_gateway_http_dispatch_limit | int
      - orchestrator_gateway_body_timeout_seconds | float > 0
      - orchestrator_gateway_max_body_bytes | int > 0
      - orchestrator_gateway_release_id is string
      - orchestrator_gateway_release_dir is string
    fail_msg: >-
      The T5820 gateway requires exactly two declared TP=1 workers and a pinned
      release directory, isolated listener mode and systemd worker credentials.
  when: orchestrator_gateway_enabled | bool

- name: Validate the model route table with the gateway's own router (fail before deploying)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, os
        from orchestrator_runtime import Router
        router = Router.from_config(json.loads(os.environ["R"]), json.loads(os.environ["A"]))
        pools = {w.get("pool", "lead") for w in json.loads(os.environ["W"])}
        missing = router.referenced_pools() - pools
        assert not missing, f"route table references pools with no worker: {sorted(missing)}"
        print("ok", len(router.rules), "rules")
  environment:
    PYTHONPATH: "{{ playbook_dir }}/.."
    R: "{{ orchestrator_gateway_routes | to_json }}"
    A: "{{ orchestrator_gateway_model_aliases | to_json }}"
    W: "{{ orchestrator_gateway_workers | to_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
- name: Validate gateway declarative routes and clients against JSON schemas (fail before deploying)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, os, jsonschema
        from pathlib import Path
        root = Path(os.environ["PLAYBOOK_DIR"]).resolve().parents[0]
        routes_schema = json.loads((root / "schemas/gateway-routes.schema.json").read_text(encoding="utf-8"))
        clients_schema = json.loads((root / "schemas/gateway-clients.schema.json").read_text(encoding="utf-8"))
        routes_data = {"routes": json.loads(os.environ["R"]), "model_aliases": json.loads(os.environ["A"])}
        jsonschema.Draft202012Validator(routes_schema).validate(routes_data)
        clients_data = {"clients": json.loads(os.environ["C"])}
        jsonschema.Draft202012Validator(clients_schema).validate(clients_data)
        print("ok declarative schemas valid")
  environment:
    PLAYBOOK_DIR: "{{ playbook_dir }}"
    R: "{{ orchestrator_gateway_routes | to_json }}"
    A: "{{ orchestrator_gateway_model_aliases | to_json }}"
    C: "{{ orchestrator_gateway_clients | to_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_routes | length > 0 or orchestrator_gateway_clients | length > 0

- name: Create gateway directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ orchestrator_gateway_group }}"
    mode: "0750"
  loop:
    - "{{ orchestrator_gateway_release_dir }}"
    - /etc/local-ai/orchestrator
  when: orchestrator_gateway_enabled | bool

- name: Create remote gateway certificate directory
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_tls_cert | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
  tags: [gateway_tls]

- name: Create controller gateway PKI directory
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_tls_pki_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Generate or validate private gateway CA and server leaf on controller
  ansible.builtin.command:
    argv: >-
      {{
        [ansible_playbook_python, role_path ~ '/files/generate-gateway-pki.py',
         '--pki-dir', orchestrator_gateway_tls_pki_dir,
         '--ca-key', orchestrator_gateway_tls_ca_key,
         '--ca-cert', orchestrator_gateway_tls_ca_cert,
         '--server-key', orchestrator_gateway_tls_server_key,
         '--server-cert', orchestrator_gateway_tls_server_cert,
         '--subject', inventory_hostname,
         '--sans', orchestrator_gateway_tls_sans | join(',')]
        + (['--rotate-server'] if orchestrator_gateway_tls_rotate_server | bool else [])
      }}
  register: _orchestrator_gateway_pki
  changed_when: "'PKI_CHANGED=1' in _orchestrator_gateway_pki.stdout"
  delegate_to: localhost
  become: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Install gateway TLS private key
  ansible.builtin.copy:
    src: "{{ orchestrator_gateway_tls_server_key }}"
    dest: "{{ orchestrator_gateway_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart gateway service
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Install CA-signed gateway TLS server leaf
  ansible.builtin.copy:
    src: "{{ orchestrator_gateway_tls_server_cert }}"
    dest: "{{ orchestrator_gateway_tls_cert }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart gateway service
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Ensure controller CA trust artifact directory exists
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_tls_ca_fetch_dest | dirname }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - orchestrator_gateway_tls_ca_fetch_dest | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Ensure controller server certificate evidence directory exists
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_tls_server_fetch_dest | dirname }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - orchestrator_gateway_tls_server_fetch_dest | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Publish public gateway CA certificate for client trust
  ansible.builtin.copy:
    src: "{{ orchestrator_gateway_tls_ca_cert }}"
    dest: "{{ orchestrator_gateway_tls_ca_fetch_dest }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - orchestrator_gateway_tls_ca_fetch_dest | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Publish public gateway server leaf as deployment evidence
  ansible.builtin.copy:
    src: "{{ orchestrator_gateway_tls_server_cert }}"
    dest: "{{ orchestrator_gateway_tls_server_fetch_dest }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - orchestrator_gateway_tls_server_fetch_dest | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Install gateway CA in controller OS trust store
  ansible.builtin.copy:
    src: "{{ orchestrator_gateway_tls_ca_cert }}"
    dest: /usr/local/share/ca-certificates/aihost-t5820-gateway-ca.crt
    owner: root
    group: root
    mode: "0644"
  delegate_to: localhost
  become: true
  notify: Update controller CA trust store
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - orchestrator_gateway_tls_controller_trust_store_enabled | bool
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Install public gateway CA at configured controller client trust paths
  ansible.builtin.copy:
    src: "{{ orchestrator_gateway_tls_ca_cert }}"
    dest: "{{ item }}"
    mode: "0644"
  loop: "{{ orchestrator_gateway_tls_controller_trust_paths }}"
  delegate_to: localhost
  become: false
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_remote_host | length > 0
    - not ansible_check_mode
  tags: [gateway_tls]

- name: Preserve or generate gateway client credential
  when:
    - orchestrator_gateway_enabled | bool
    - not ansible_check_mode
  block:
    - name: Read existing gateway client credential
      ansible.builtin.slurp:
        src: "{{ orchestrator_gateway_client_token_file }}"
      register: _orchestrator_gateway_existing_client_token
      failed_when: false
      no_log: true

    - name: Set gateway client credential from protected file or generate one
      ansible.builtin.set_fact:
        orchestrator_gateway_client_token: >-
          {{ (_orchestrator_gateway_existing_client_token.content | b64decode | trim)
             if (_orchestrator_gateway_existing_client_token.content is defined
                 and _orchestrator_gateway_existing_client_token.content | length > 0)
             else lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=64') }}
      no_log: true

- name: Install gateway client credential
  ansible.builtin.copy:
    content: "{{ orchestrator_gateway_client_token }}\n"
    dest: "{{ orchestrator_gateway_client_token_file }}"
    owner: "{{ orchestrator_gateway_user }}"
    group: "{{ orchestrator_gateway_group }}"
    mode: "0400"
  no_log: true
  when:
    - orchestrator_gateway_enabled | bool
    - not ansible_check_mode

- name: Remove obsolete manual gateway drop-ins
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ orchestrator_gateway_obsolete_dropins }}"
  register: orchestrator_gateway_removed_dropins
  when: orchestrator_gateway_enabled | bool
  notify: Restart gateway service

- name: Read prior gateway activation files for rollback
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: ["{{ orchestrator_gateway_service_path }}", "{{ orchestrator_gateway_env_file }}"]
  register: orchestrator_gateway_previous_activation
  failed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require complete previous activation for rollback
  ansible.builtin.assert:
    that:
      - >-
        (orchestrator_gateway_previous_activation.results[0].content is defined)
        == (orchestrator_gateway_previous_activation.results[1].content is defined)
    fail_msg: Previous gateway unit and environment must both exist, or both be absent on first installation.
  when: not ansible_check_mode

- name: Build expected gateway content manifest on controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/gateway-artifact.py"
      - "{{ playbook_dir }}/.."
      - "{{ role_path }}/files/gateway-requirements.lock"
  delegate_to: localhost
  become: false
  register: orchestrator_gateway_expected_manifest
  changed_when: false
  check_mode: false

- name: Read any existing immutable release manifest
  ansible.builtin.slurp:
    src: "{{ orchestrator_gateway_release_dir }}/ARTIFACT.json"
  register: orchestrator_gateway_existing_manifest
  failed_when: false
  when: not ansible_check_mode

- name: Check whether this release already contains application code
  ansible.builtin.stat:
    path: "{{ orchestrator_gateway_release_dir }}/orchestrator_gateway"
  register: orchestrator_gateway_existing_code

- name: Require a verified manifest for an existing release
  ansible.builtin.assert:
    that:
      - >-
        not orchestrator_gateway_existing_code.stat.exists
        or orchestrator_gateway_existing_manifest.content is defined
    fail_msg: Existing unsealed release cannot be overwritten. Choose a new gateway release identity.
  when: not ansible_check_mode

- name: Refuse to replace different code under an existing release identity
  ansible.builtin.assert:
    that:
      - >-
        (orchestrator_gateway_existing_manifest.content | b64decode | from_json)
        == (orchestrator_gateway_expected_manifest.stdout | from_json)
    fail_msg: Choose a new gateway release identity; existing artifact content is immutable.
  when:
    - not ansible_check_mode
    - orchestrator_gateway_existing_manifest.content is defined

- name: Install gateway source release
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}/"
    dest: "{{ orchestrator_gateway_release_dir }}/{{ item }}/"
    owner: root
    group: "{{ orchestrator_gateway_group }}"
    mode: "0750"
  loop:
    - orchestrator_gateway
    - orchestrator_runtime
    - orchestrator_contract
  when: orchestrator_gateway_enabled | bool
  notify: Restart gateway service

- name: Record gateway release identity
  ansible.builtin.copy:
    content: "{{ orchestrator_gateway_release_id }}\n"
    dest: "{{ orchestrator_gateway_release_dir }}/RELEASE_ID"
    owner: root
    group: root
    mode: "0644"
  when: orchestrator_gateway_enabled | bool

- name: Create gateway ASGI virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ orchestrator_gateway_venv_dir }}"
    creates: "{{ orchestrator_gateway_venv_dir }}/bin/python3"
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_venv_enabled | bool

- name: Set permissions on gateway virtual environment directory
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_venv_dir }}"
    owner: root
    group: "{{ orchestrator_gateway_group }}"
    state: directory
    recurse: true
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_venv_enabled | bool

- name: Install the gateway dependency lock
  ansible.builtin.copy:
    src: gateway-requirements.lock
    dest: "{{ orchestrator_gateway_requirements_path }}"
    owner: root
    group: "{{ orchestrator_gateway_group }}"
    mode: "0640"

- name: Install gateway ASGI dependencies into virtual environment
  ansible.builtin.pip:
    requirements: "{{ orchestrator_gateway_requirements_path }}"
    extra_args: "--require-hashes --only-binary=:all:"
    virtualenv: "{{ orchestrator_gateway_venv_dir }}"
    state: present
  when:
    - orchestrator_gateway_enabled | bool
    - orchestrator_gateway_venv_enabled | bool
  notify: Restart gateway service

- name: Create private gateway evidence directory
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_evidence_path | dirname }}"
    state: directory
    owner: "{{ orchestrator_gateway_user }}"
    group: "{{ orchestrator_gateway_group }}"
    mode: "0750"
  when: orchestrator_gateway_enabled | bool

- name: Create gateway evidence chain owned by the service account
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_evidence_path }}"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: "{{ orchestrator_gateway_user }}"
    group: "{{ orchestrator_gateway_group }}"
    mode: "0640"
  when: orchestrator_gateway_enabled | bool

# R6: per-client identity. The gateway-readable registry holds only sha256 digests; plaintext tokens stay in
# root-only files (an existing legacy token file keeps its token so current clients are not broken).
- name: Refuse to rotate a Vault-managed client token outside Vault
  ansible.builtin.assert:
    that:
      - orchestrator_gateway_rotate_client_tokens | intersect(orchestrator_gateway_vault_managed_clients) | length == 0
    fail_msg: >-
      {{ orchestrator_gateway_rotate_client_tokens | intersect(orchestrator_gateway_vault_managed_clients) }} are Vault
      records; rotate them with playbooks/vault-post-init.yml -e vault_post_init_rotate=[...] so Vault stays the source.
  when: orchestrator_gateway_enabled | bool

- name: Create the root-only client token directory
  ansible.builtin.file:
    path: "{{ orchestrator_gateway_clients_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: orchestrator_gateway_enabled | bool

- name: Read existing client tokens
  ansible.builtin.slurp:
    src: "{{ item.legacy_token_file | default(orchestrator_gateway_clients_dir ~ '/' ~ item.client_id ~ '.token') }}"
  loop: "{{ orchestrator_gateway_clients }}"
  loop_control:
    label: "{{ item.client_id }}"
  register: _orchestrator_gateway_client_tokens
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - orchestrator_gateway_enabled | bool

- name: Keep existing client tokens and generate missing ones
  ansible.builtin.set_fact:
    _orchestrator_gateway_tokens: >-
      {{ (_orchestrator_gateway_tokens | default({})) | combine({item.item.client_id:
           ((item.content | b64decode | trim)
            if (item.content is defined and item.content | length > 0
                and item.item.client_id not in orchestrator_gateway_rotate_client_tokens)
            else lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=64'))}) }}
  loop: "{{ _orchestrator_gateway_client_tokens.results | default([]) }}"
  loop_control:
    label: "{{ item.item.client_id }}"
  no_log: true
  when:
    - orchestrator_gateway_enabled | bool

- name: Install root-only client token files for delivery to clients
  ansible.builtin.copy:
    content: "{{ _orchestrator_gateway_tokens[item.client_id] }}\n"
    dest: "{{ orchestrator_gateway_clients_dir }}/{{ item.client_id }}.token"
    owner: root
    group: root
    mode: "0400"
  loop: "{{ orchestrator_gateway_clients }}"
  loop_control:
    label: "{{ item.client_id }}"
  no_log: true
  when:
    - orchestrator_gateway_enabled | bool
    - not ansible_check_mode

- name: Render the client registry (token digests only)
  ansible.builtin.copy:
    content: >
      {{ orchestrator_gateway_clients | aihost_client_registry(_orchestrator_gateway_tokens) | to_nice_json }}
    dest: "{{ orchestrator_gateway_clients_file }}"
    owner: root
    group: "{{ orchestrator_gateway_group }}"
    mode: "0640"
  when:
    - orchestrator_gateway_enabled | bool
    - not ansible_check_mode
  notify: Restart gateway service

- name: Install the root-owned artifact verification helper
  ansible.builtin.copy:
    src: gateway-artifact.py
    dest: /usr/local/libexec/aihost-gateway-artifact
    owner: root
    group: root
    mode: "0755"

- name: Write the expected staged artifact manifest
  ansible.builtin.copy:
    content: "{{ orchestrator_gateway_expected_manifest.stdout }}\n"
    dest: "{{ orchestrator_gateway_release_dir }}/ARTIFACT.json"
    owner: root
    group: "{{ orchestrator_gateway_group }}"
    mode: "0640"

- name: Verify staged source and dependency lock before activation
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/libexec/aihost-gateway-artifact
      - "{{ orchestrator_gateway_release_dir }}"
      - "{{ orchestrator_gateway_requirements_path }}"
      - --verify
      - "{{ orchestrator_gateway_release_dir }}/ARTIFACT.json"
  changed_when: false
  when: not ansible_check_mode

- name: Activate and verify the staged gateway with rollback
  block:
    - name: Render gateway non-secret environment
      ansible.builtin.template:
        src: gateway.env.j2
        dest: "{{ orchestrator_gateway_env_file }}"
        owner: root
        group: root
        mode: "0644"
      when: orchestrator_gateway_enabled | bool
      notify: Restart gateway service

    - name: Install gateway readiness probe
      ansible.builtin.copy:
        src: gateway-readiness.py
        dest: "{{ orchestrator_gateway_readiness_path }}"
        owner: root
        group: root
        mode: "0755"
      when: orchestrator_gateway_enabled | bool
      notify: Restart gateway service

    - name: Install gateway systemd unit
      ansible.builtin.template:
        src: orchestrator-gateway.service.j2
        dest: "{{ orchestrator_gateway_service_path }}"
        owner: root
        group: root
        mode: "0644"
      register: orchestrator_gateway_unit
      when: orchestrator_gateway_enabled | bool
      notify: Restart gateway service

    - name: Establish persistent gateway state
      ansible.builtin.systemd_service:
        name: aihost-orchestrator-gateway.service
        daemon_reload: >-
          {{ (orchestrator_gateway_unit.changed | default(false) | bool)
             or (orchestrator_gateway_removed_dropins.changed | default(false) | bool) }}
        enabled: true
        state: started
      when:
        - orchestrator_gateway_enabled | bool
        - not ansible_check_mode

    - name: Activate pending gateway changes before acceptance
      ansible.builtin.meta: flush_handlers

    - name: Verify the activated gateway identity and readiness
      ansible.builtin.uri:
        url: "http://{{ orchestrator_gateway_host }}:{{ orchestrator_gateway_port }}/health?strict=true"
        return_content: true
      register: orchestrator_gateway_activation_health
      until: >-
        orchestrator_gateway_activation_health.status == 200
        and orchestrator_gateway_activation_health.json.ready | default(false)
        and orchestrator_gateway_activation_health.json.release_id | default('') == orchestrator_gateway_release_id
      retries: 12
      delay: 5
      when: not ansible_check_mode

    - name: Seal the verified gateway source manifest
      ansible.builtin.copy:
        content: "{{ orchestrator_gateway_expected_manifest.stdout }}\n"
        dest: "{{ orchestrator_gateway_release_dir }}/ARTIFACT.json"
        owner: root
        group: "{{ orchestrator_gateway_group }}"
        mode: "0640"
  rescue:
    - name: Restore the previous gateway activation files
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ item.item }}"
        owner: root
        group: root
        mode: "{{ '0644' if item.item == orchestrator_gateway_service_path else '0640' }}"
      loop: "{{ orchestrator_gateway_previous_activation.results }}"
      when: item.content is defined
      no_log: true

    - name: Restart the previous gateway after restoring its activation
      ansible.builtin.systemd_service:
        name: aihost-orchestrator-gateway.service
        daemon_reload: true
        state: restarted
      when: orchestrator_gateway_previous_activation.results[0].content is defined

    - name: Stop a failed first gateway installation
      ansible.builtin.systemd_service:
        name: aihost-orchestrator-gateway.service
        state: stopped
        enabled: false
      when: orchestrator_gateway_previous_activation.results[0].content is not defined

    - name: Verify the restored gateway is ready
      ansible.builtin.uri:
        url: "http://{{ orchestrator_gateway_host }}:{{ orchestrator_gateway_port }}/health?strict=true"
      register: orchestrator_gateway_rollback_health
      until: orchestrator_gateway_rollback_health.status == 200
      retries: 12
      delay: 5
      when: orchestrator_gateway_previous_activation.results[0].content is defined

    - name: Report the failed gateway activation after rollback
      ansible.builtin.fail:
        msg: >-
          Gateway activation failed; previous activation restored when available.
          See failed task and rollback checks.
