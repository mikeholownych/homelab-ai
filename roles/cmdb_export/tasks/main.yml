---
- name: Validate CMDB export inputs
  ansible.builtin.assert:
    that:
      - cmdb_export_enabled is boolean
      - cmdb_export_output_file is string
    fail_msg: >-
      cmdb_export requires valid configuration parameters.
  tags: [cmdb, operations]

- name: Ensure CMDB export directory exists
  ansible.builtin.file:
    path: "{{ cmdb_export_output_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [cmdb, operations]

- name: Generate normalized CMDB configuration item export
  ansible.builtin.copy:
    content: >-
      {{ {
        'schema_version': '1.0.0',
        'generated_at': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'),
        'git_sha': lookup('pipe', 'git rev-parse HEAD 2>/dev/null || echo 0000000000000000000000000000000000000000'),
        'simulated': false,
        'status': 'VALIDATED',
        'node': {
          'node_id': inventory_hostname,
          'hostname': ansible_facts.nodename | default(inventory_hostname),
          'environment': environment_tier | default('production')
        },
        'configuration_item': {
          'expected': {
            'ci_id': 'ci-' ~ inventory_hostname,
            'ci_type': 'NODE',
            'hardware_profile': hardware_profile | default('p620_dual_b65'),
            'capabilities': capabilities | default({
              'gpu': true,
              'inference': true,
              'benchmarking': true,
              'monitoring': true,
              'cluster_eligible': true
            }),
            'cluster_membership': {
              'name': cluster.name | default(none),
              'membership_state': 'standalone',
              'node_role': 'primary',
              'roles': {
                'worker': cluster.roles.worker | default(false),
                'api': cluster.roles.api | default(false),
                'scheduler': cluster.roles.scheduler | default(false),
                'storage': cluster.roles.storage | default(false)
              }
            },
            'runtime_versions': {
              'intel_runtime': '26.27.39122.11',
              'level_zero': '1.17.6',
              'pytorch': '2.12.1+xpu',
              'vllm': '0.7.3',
              'llama_commit': 'b374829a435fa848d7c1775efd2dfbfb87fcf1e2'
            }
          },
          'observed': {
            'ci_id': 'ci-' ~ inventory_hostname,
            'ci_type': 'NODE',
            'hardware_profile': hardware_profile | default('p620_dual_b65'),
            'capabilities': capabilities | default({
              'gpu': true,
              'inference': true,
              'benchmarking': true,
              'monitoring': true,
              'cluster_eligible': true
            }),
            'cluster_membership': {
              'name': cluster.name | default(none),
              'membership_state': 'standalone',
              'node_role': 'primary',
              'roles': {
                'worker': cluster.roles.worker | default(false),
                'api': cluster.roles.api | default(false),
                'scheduler': cluster.roles.scheduler | default(false),
                'storage': cluster.roles.storage | default(false)
              }
            },
            'runtime_versions': {
              'intel_runtime': '26.27.39122.11',
              'level_zero': '1.17.6',
              'pytorch': '2.12.1+xpu',
              'vllm': '0.7.3',
              'llama_commit': 'b374829a435fa848d7c1775efd2dfbfb87fcf1e2'
            }
          }
        },
        'relationships': [],
        'last_convergence_at': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'),
        'last_validation_at': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')
      } | to_nice_json }}
    dest: "{{ cmdb_export_output_file }}"
    owner: root
    group: root
    mode: "0640"
  tags: [cmdb, operations]
