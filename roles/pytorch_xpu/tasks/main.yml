---
- name: Refuse PyTorch XPU until the Intel B65 OS support gate is approved
  ansible.builtin.assert:
    that:
      - intel_gpu_install_enabled | default(false) | bool
    fail_msg: PyTorch XPU cannot be installed before the pinned Intel GPU stack is supported and enabled.
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, runtime, inference]


- name: Enforce lifecycle registry authority over this role's pins
  ansible.builtin.assert:
    that:
      - committed_registry.current is none
        or committed_registry.current == pytorch_xpu_version
    fail_msg: >-
      Divergence detected: group_vars/gpu.yml declares pytorch_xpu current
      {{ committed_registry.current }} while the role pins pytorch_xpu_version_VAR. One authority:
      update both in the same commit or better, keep them equal.
  vars:
    committed_registry_path: "{{ role_path }}/../../inventory/production/group_vars/gpu.yml"
    committed_registry: >-
      {{ (lookup('ansible.builtin.file', committed_registry_path, errors='ignore')
         | from_yaml).runtime_profiles.pytorch_xpu | default({}) }}
- name: Install pinned Python venv tooling
  ansible.builtin.apt:
    name: "python{{ pytorch_xpu_python_version }}-venv"
    state: present
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, runtime]

- name: Ensure PyTorch XPU and validator parent directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pytorch_xpu_root }}"
    - "{{ pytorch_xpu_validator | dirname }}"
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, runtime]

- name: Create versioned PyTorch XPU virtual environment
  ansible.builtin.command:
    argv: ["python{{ pytorch_xpu_python_version }}", -m, venv, "{{ pytorch_xpu_venv }}"]
    creates: "{{ pytorch_xpu_venv }}/bin/python"
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, runtime]

- name: Install complete immutable PyTorch XPU dependency lock
  ansible.builtin.copy:
    src: requirements-xpu-py312.lock
    dest: "{{ pytorch_xpu_lock_path }}"
    owner: root
    group: root
    mode: "0644"
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, runtime]

- name: Install complete immutable PyTorch XPU dependency lock with hashes
  ansible.builtin.pip:
    requirements: "{{ pytorch_xpu_lock_path }}"
    virtualenv: "{{ pytorch_xpu_venv }}"
    extra_args: >-
      --require-hashes --index-url https://download.pytorch.org/whl/xpu
      --extra-index-url https://pypi.org/simple
  when:
    - pytorch_xpu_install_enabled | bool
    - not ansible_check_mode
  tags: [gpu, runtime]

- name: Install XPU validator
  ansible.builtin.copy:
    src: validate_xpu.py
    dest: "{{ pytorch_xpu_validator }}"
    owner: root
    group: root
    mode: "0755"
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, runtime]

- name: Install atomic XPU environment promoter
  ansible.builtin.copy:
    src: promote_venv.py
    dest: "{{ pytorch_xpu_promoter }}"
    owner: root
    group: root
    mode: "0755"
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, runtime]

- name: Ensure runtime evidence directory exists
  ansible.builtin.file:
    path: "{{ pytorch_xpu_evidence_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: pytorch_xpu_install_enabled | bool
  tags: [gpu, validation]

- name: Validate every XPU before promotion and write runtime.json
  ansible.builtin.command:
    argv:
      - "{{ pytorch_xpu_venv }}/bin/python"
      - "{{ pytorch_xpu_validator }}"
      - --expected-count
      - "{{ pytorch_xpu_expected_count | string }}"
      - --output
      - "{{ pytorch_xpu_evidence_dir }}/runtime.json"
      - --validation-output
      - "{{ pytorch_xpu_validation_path }}"
  changed_when: false
  when:
    - pytorch_xpu_install_enabled | bool
    - not ansible_check_mode
  check_mode: false
  tags: [gpu, runtime, validation]

- name: Promote validated versioned environment atomically through current link
  ansible.builtin.command:
    argv:
      - "{{ pytorch_xpu_promoter }}"
      - --target
      - "{{ pytorch_xpu_venv }}"
      - --current
      - "{{ pytorch_xpu_current }}"
      - --previous
      - "{{ pytorch_xpu_previous }}"
  register: pytorch_xpu_promotion
  changed_when: pytorch_xpu_promotion.stdout == 'CHANGED'
  when:
    - pytorch_xpu_install_enabled | bool
    - not ansible_check_mode
  tags: [gpu, runtime]

- name: Record XPU physical validation as NOT_TESTED during check mode
  ansible.builtin.copy:
    content: >-
      {{ {'schema_version': '1.0.0', 'status': 'NOT_TESTED', 'physical_acceptance': false,
          'expected_count': pytorch_xpu_expected_count, 'observed_count': 0, 'devices': [],
          'reason': 'check mode skips physical validators and absent staged changes'} | to_nice_json }}
    dest: "{{ pytorch_xpu_validation_path }}"
    owner: root
    group: root
    mode: "0640"
  when:
    - pytorch_xpu_install_enabled | bool
    - ansible_check_mode
  tags: [gpu, validation]
