---
- name: Validate ITSM hook parameters
  ansible.builtin.assert:
    that:
      - itsm_hooks_integration_enabled is boolean
      - itsm_hooks_permitted_actions is iterable
      - itsm_hooks_requested_action in itsm_hooks_permitted_actions
    fail_msg: >-
      Requested ITSM action is not in the permitted action allowlist.
  when: itsm_hooks_integration_enabled | bool
  tags: [itsm, operations]

- name: Report ITSM authorization state
  ansible.builtin.debug:
    msg: >-
      ITSM execution authorized for change ticket {{ itsm_hooks_change_id | default('N/A') }}
      with action {{ itsm_hooks_requested_action }}
  tags: [itsm, operations]
