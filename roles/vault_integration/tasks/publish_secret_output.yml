---
- name: Publish the minimum required Vault secret keys for the caller
  ansible.builtin.set_fact:
    vault_integration_secret: >-
      {{
        dict(
          vault_integration_required_secret_keys
          | zip(
              vault_integration_required_secret_keys
              | map('extract', vault_integration_secret_result.secret)
            )
        )
      }}
    vault_integration_secret_access_metadata:
      status: ok
      path_ref: "{{ vault_integration_secret_ref_normalized }}"
      engine_mount_point: "{{ vault_integration_kv2_mount }}"
      version: "{{ vault_integration_secret_result.metadata.version }}"
      created_time: "{{ vault_integration_secret_result.metadata.created_time | default(None) }}"
  no_log: true
