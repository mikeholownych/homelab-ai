---
- name: Normalize the logical Vault secret path reference
  ansible.builtin.set_fact:
    vault_integration_secret_ref_normalized: >-
      {{ vault_integration_secret_ref | regex_replace('^/+|/+$', '') }}
  no_log: true

- name: Assert the logical Vault secret path stays within the allowlist
  ansible.builtin.assert:
    that:
      - vault_integration_secret_ref is string
      - vault_integration_secret_ref | length > 0
      - vault_integration_required_secret_keys | length > 0
      - vault_integration_secret_ref == vault_integration_secret_ref_normalized
      - "'..' not in vault_integration_secret_ref_normalized"
      - not (vault_integration_secret_ref_normalized | regex_search('(^|/)\\.\\.(?:/|$)'))
      - vault_integration_secret_ref_normalized is match('^secret/local-ai/[A-Za-z0-9/_-]+$')
      - vault_integration_secret_ref_normalized.split('/')[0:2] == ['secret', 'local-ai']
      - >-
        vault_integration_secret_ref_normalized.split('/')[2]
        in
        (
          vault_integration_allowed_secret_prefixes
          | map('regex_replace', '^secret/local-ai/([^/]+)/?$', '\\1')
          | list
        )
      - >-
        vault_integration_secret_ref_normalized.split('/')[2] != 'hosts'
        or
        (
          vault_integration_secret_ref_normalized.split('/') | length > 3
          and vault_integration_secret_ref_normalized.split('/')[3] == inventory_hostname
        )
    fail_msg: >-
      Vault secret references must be normalized Git-stored logical paths under
      the shared, hosts, clusters, or services allowlist.

- name: Build the KVv2 path relative to the configured mount
  ansible.builtin.set_fact:
    vault_integration_secret_engine_relative_path: >-
      {{
        vault_integration_secret_ref_normalized
        | regex_replace('^' ~ vault_integration_kv2_mount ~ '/', '')
      }}
  no_log: true

- name: Retrieve the Vault secret at task runtime
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_integration_addr }}"
    auth_method: token
    token: "{{ vault_integration_login_result.login.auth.client_token }}"
    token_validate: true
    engine_mount_point: "{{ vault_integration_kv2_mount }}"
    path: "{{ vault_integration_secret_engine_relative_path }}"
    version: "{{ vault_integration_secret_version if vault_integration_secret_version is not none else omit }}"
    namespace: "{{ vault_integration_namespace if vault_integration_namespace | length > 0 else omit }}"
    ca_cert: "{{ vault_integration_ca_cert_path if vault_integration_ca_cert_path | length > 0 else omit }}"
    validate_certs: "{{ vault_integration_validate_certs }}"
  register: vault_integration_secret_result
  delegate_to: localhost
  become: false
  no_log: true

- name: Assert required keys were returned by Vault without fallback
  ansible.builtin.assert:
    that:
      - >-
        vault_integration_required_secret_keys
        | difference(vault_integration_secret_result.secret.keys() | list)
        | length == 0
    fail_msg: >-
      Vault returned a secret without every required key; dependent work stops
      instead of falling back to plaintext or cached values.
  no_log: true

- name: Record non-secret Vault access metadata for downstream evidence
  ansible.builtin.set_fact:
    vault_integration_secret_access_metadata:
      status: ok
      path_ref: "{{ vault_integration_secret_ref_normalized }}"
      engine_mount_point: "{{ vault_integration_kv2_mount }}"
      version: "{{ vault_integration_secret_result.metadata.version }}"
      created_time: "{{ vault_integration_secret_result.metadata.created_time | default(None) }}"
