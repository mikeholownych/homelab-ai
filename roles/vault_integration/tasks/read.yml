---
- name: Clear previously published Vault caller output before refresh
  ansible.builtin.set_fact:
    vault_integration_secret:
    vault_integration_secret_access_metadata:
  no_log: true

- name: Validate the logical Vault secret path reference
  ansible.builtin.include_tasks: validate_secret_ref.yml

- name: Build the KVv2 path relative to the configured mount
  ansible.builtin.set_fact:
    vault_integration_secret_engine_relative_path: >-
      {{ vault_integration_secret_ref_normalized.split('/', 1)[1] }}
  no_log: true

- name: Retrieve the Vault secret at task runtime
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_integration_addr }}"
    auth_method: token
    token: "{{ vault_integration_login_result.login.auth.client_token }}"
    token_validate: true
    engine_mount_point: "{{ vault_integration_kv2_mount }}"
    path: "{{ vault_integration_secret_engine_relative_path }}"
    version: "{{ vault_integration_secret_version if vault_integration_secret_version is not none else omit }}"
    namespace: "{{ vault_integration_namespace if vault_integration_namespace is not none else omit }}"
    ca_cert: "{{ vault_integration_ca_cert_path }}"
    validate_certs: "{{ vault_integration_validate_certs }}"
  register: vault_integration_secret_result
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true

- name: Assert required keys were returned by Vault without fallback
  ansible.builtin.assert:
    that:
      - >-
        vault_integration_required_secret_keys
        | difference(vault_integration_secret_result.secret.keys() | list)
        | length == 0
    fail_msg: >-
      Vault returned a secret without every required key; dependent work stops
      instead of falling back to plaintext or cached values.
  no_log: true

- name: Publish the minimal caller secret interface
  ansible.builtin.include_tasks: publish_secret_output.yml
