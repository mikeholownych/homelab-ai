---
- name: Validate Vault runtime inputs and fail-closed interface
  ansible.builtin.assert:
    that:
      - vault_integration_operation in ['bootstrap', 'preflight', 'read']
      - vault_integration_enabled | bool or vault_integration_operation == 'bootstrap'
      - vault_integration_auth_method in vault_integration_auth_method_allowlist
      - vault_integration_auth_method == 'approle'
      - vault_integration_addr is string
      - vault_integration_addr | length > 0
      - vault_integration_addr is match('^https://')
      - vault_integration_auth_mount is string
      - vault_integration_auth_mount | length > 0
      - vault_integration_kv2_mount is string
      - vault_integration_kv2_mount | length > 0
      - vault_integration_namespace is string
      - vault_integration_ca_cert_path is string
      - vault_integration_ca_cert_path | length > 0
      - vault_integration_ca_cert_path.startswith('/')
      - vault_integration_token_max_ttl_seconds | int > 0
      - vault_integration_credential_max_size_bytes | int > 0
      - vault_integration_credential_allowed_owners | length > 0
      - vault_integration_credential_allowed_groups | length > 0
      - vault_integration_allowed_credential_modes | length > 0
      - vault_integration_allowed_secret_prefixes | length == 4
    fail_msg: >-
      Vault runtime integration only supports the documented AppRole over HTTPS
      interface and fails closed when required inputs are invalid.

- name: Resolve protected AppRole credential paths
  ansible.builtin.include_tasks: resolve_credentials.yml

- name: Render Vault runtime configuration reference for scheduled runs
  ansible.builtin.include_tasks: bootstrap.yml
  when:
    - vault_integration_operation == 'bootstrap'
    - vault_integration_bootstrap_configure_references | bool

- name: Authenticate to Vault for runtime validation
  ansible.builtin.include_tasks: authenticate.yml
  when: vault_integration_operation in ['preflight', 'read']

- name: Retrieve a Vault secret at task runtime
  ansible.builtin.include_tasks: read.yml
  when: vault_integration_operation == 'read'

- name: Clear transient Vault credentials and login state
  ansible.builtin.include_tasks: cleanup.yml
