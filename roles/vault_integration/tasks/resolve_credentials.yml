---
- name: Build protected AppRole credential candidate lists
  ansible.builtin.set_fact:
    vault_integration_role_id_credential_candidates: >-
      {{
        (
          [vault_integration_credentials_directory ~ '/' ~ vault_integration_role_id_credential_filename]
          if vault_integration_credentials_directory | length > 0
          else []
        ) + vault_integration_role_id_credential_fallback_paths
      }}
    vault_integration_secret_id_credential_candidates: >-
      {{
        (
          [vault_integration_credentials_directory ~ '/' ~ vault_integration_secret_id_credential_filename]
          if vault_integration_credentials_directory | length > 0
          else []
        ) + vault_integration_secret_id_credential_fallback_paths
      }}
  no_log: true

- name: Assert AppRole credential path candidates are configured
  ansible.builtin.assert:
    that:
      - vault_integration_role_id_credential_candidates | length > 0
      - vault_integration_secret_id_credential_candidates | length > 0
      - >-
        vault_integration_role_id_credential_candidates
        | select('match', '^/')
        | list
        | length
        == vault_integration_role_id_credential_candidates | length
      - >-
        vault_integration_secret_id_credential_candidates
        | select('match', '^/')
        | list
        | length
        == vault_integration_secret_id_credential_candidates | length
    fail_msg: >-
      Vault AppRole credentials must come from protected runtime files exposed
      through CREDENTIALS_DIRECTORY or explicit root-readable fallback paths.
  no_log: true

- name: Stat candidate Vault role ID credential files without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ vault_integration_role_id_credential_candidates }}"
  loop_control:
    label: "{{ item }}"
  register: vault_integration_role_id_credential_candidate_stats
  delegate_to: localhost
  become: false
  no_log: true

- name: Stat candidate Vault secret ID credential files without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ vault_integration_secret_id_credential_candidates }}"
  loop_control:
    label: "{{ item }}"
  register: vault_integration_secret_id_credential_candidate_stats
  delegate_to: localhost
  become: false
  no_log: true

- name: Validate each existing Vault role ID credential file
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk | default(false)
      - item.stat.readable | default(false)
      - item.stat.pw_name in vault_integration_credential_allowed_owners
      - item.stat.gr_name in vault_integration_credential_allowed_groups
      - item.stat.mode in vault_integration_allowed_credential_modes
      - item.stat.size | int > 0
      - item.stat.size | int <= vault_integration_credential_max_size_bytes | int
    fail_msg: >-
      Vault role ID credential files must be protected regular files owned by
      the configured root or service account and bounded in size.
  loop: >-
    {{
      vault_integration_role_id_credential_candidate_stats.results
      | selectattr('stat.exists')
      | list
    }}
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  when: item.stat.exists

- name: Validate each existing Vault secret ID credential file
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk | default(false)
      - item.stat.readable | default(false)
      - item.stat.pw_name in vault_integration_credential_allowed_owners
      - item.stat.gr_name in vault_integration_credential_allowed_groups
      - item.stat.mode in vault_integration_allowed_credential_modes
      - item.stat.size | int > 0
      - item.stat.size | int <= vault_integration_credential_max_size_bytes | int
    fail_msg: >-
      Vault secret ID credential files must be protected regular files owned by
      the configured root or service account and bounded in size.
  loop: >-
    {{
      vault_integration_secret_id_credential_candidate_stats.results
      | selectattr('stat.exists')
      | list
    }}
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  when: item.stat.exists

- name: Record the first valid Vault role ID credential path
  ansible.builtin.set_fact:
    vault_integration_role_id_credential_path: >-
      {{
        (
          vault_integration_role_id_credential_candidate_stats.results
          | selectattr('stat.exists')
          | map(attribute='item')
          | list
          | first
        ) | default('')
      }}
  no_log: true

- name: Record the first valid Vault secret ID credential path
  ansible.builtin.set_fact:
    vault_integration_secret_id_credential_path: >-
      {{
        (
          vault_integration_secret_id_credential_candidate_stats.results
          | selectattr('stat.exists')
          | map(attribute='item')
          | list
          | first
        ) | default('')
      }}
  no_log: true

- name: Assert valid AppRole credential files were discovered
  ansible.builtin.assert:
    that:
      - vault_integration_role_id_credential_path | length > 0
      - vault_integration_secret_id_credential_path | length > 0
    fail_msg: >-
      Vault AppRole credentials were not found in the protected runtime
      locations provided by CREDENTIALS_DIRECTORY or the configured fallback
      paths.
  no_log: true

- name: Read the protected Vault role ID credential
  ansible.builtin.slurp:
    path: "{{ vault_integration_role_id_credential_path }}"
  register: vault_integration_role_id_file
  delegate_to: localhost
  become: false
  no_log: true

- name: Read the protected Vault secret ID credential
  ansible.builtin.slurp:
    path: "{{ vault_integration_secret_id_credential_path }}"
  register: vault_integration_secret_id_file
  delegate_to: localhost
  become: false
  no_log: true

- name: Decode protected AppRole credential values into transient variables
  ansible.builtin.set_fact:
    vault_integration_role_id: "{{ vault_integration_role_id_file.content | b64decode | trim }}"
    vault_integration_secret_id: "{{ vault_integration_secret_id_file.content | b64decode | trim }}"
  no_log: true

- name: Assert decoded AppRole credential values are non-empty
  ansible.builtin.assert:
    that:
      - vault_integration_role_id | length > 0
      - vault_integration_secret_id | length > 0
    fail_msg: Vault AppRole credential files must contain non-empty values.
  no_log: true
