---
- name: Ensure evidence directory exists for validation
  ansible.builtin.file:
    path: "{{ validation_evidence_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [validation, operations]

- name: Run independent validation aggregator
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ role_path }}/files/aggregate_validation.py"
      - --node-id
      - "{{ inventory_hostname }}"
      - --environment
      - "{{ environment_tier | default('production') }}"
      - --hardware-profile
      - "{{ hardware_profile | default('p620_dual_b65') }}"
      - --git-sha
      - "{{ lookup('ansible.builtin.pipe', 'git rev-parse HEAD 2>/dev/null || echo 0000000000000000000000000000000000000000') }}"
      - --output
      - "{{ validation_output_path }}"
      - --text-summary
      - "{{ validation_summary_path }}"
  register: validation_run
  changed_when: false
  failed_when:
    - validation_fail_on_blocking | bool
    - validation_run.rc != 0
  tags: [validation, operations]

- name: Display validation summary
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.file', validation_summary_path, errors='ignore') | default('Validation completed.') }}"
  tags: [validation, operations]
