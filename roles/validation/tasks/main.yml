---
- name: Ensure evidence directory exists for validation
  ansible.builtin.file:
    path: "{{ validation_evidence_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags: [validation, operations]

- name: Load expected hardware profile for harness value derivation
  ansible.builtin.include_vars:
    file: "{{ validation_hardware_profile_path }}"
    name: validation_hardware_expected
  tags: [validation, operations]

- name: Materialize expected hardware profile for the aggregator
  ansible.builtin.copy:
    content: "{{ validation_hardware_expected | to_nice_json }}\n"
    dest: "{{ validation_profile_json_path }}"
    owner: root
    group: root
    mode: "0640"
  tags: [validation, operations]

- name: Install validation aggregator on the managed node
  ansible.builtin.copy:
    src: aggregate_validation.py
    dest: "{{ validation_aggregator_path }}"
    owner: root
    group: root
    mode: "0755"
  tags: [validation, operations]

- name: Run independent validation aggregator # noqa: jinja[invalid]
  vars:
    validation_aggregator_argv:
      - /usr/bin/python3
      - "{{ validation_aggregator_path }}"
      - --node-id
      - "{{ inventory_hostname }}"
      - --environment
      - "{{ environment_tier | default('production') }}"
      - --hardware-profile
      - "{{ hardware_profile | default('p620_dual_b65') }}"
      - --git-sha
      - "{{ git_commit_sha | default('0000000000000000000000000000000000000000') }}"
      - --input-json
      - "{{ validation_checks_input_path }}"
      - --output
      - "{{ validation_output_path }}"
      - --text-summary
      - "{{ validation_summary_path }}"
      - --hardware-profile-json
      - "{{ validation_profile_json_path }}"
      - --evidence-dir
      - "{{ validation_evidence_dir }}"
    # Inventory inputs: operator-declared applicability (check id -> reason, recorded in the document) and the live
    # checks the aggregator observes on the node (required units, reconcile timer, Vault client login).
    validation_extra_argv: >-
      {{ (validation_not_applicable | dict2items | map(attribute='key')
          | zip(validation_not_applicable | dict2items | map(attribute='value'))
          | map('join', '=') | map('regex_replace', '^', '--not-applicable=') | list)
         + (validation_required_units | map('regex_replace', '^', '--required-unit=') | list)
         + (['--reconcile-timer=' ~ validation_reconcile_timer] if validation_reconcile_timer else [])
         + (['--vault-config=' ~ validation_vault_config] if validation_vault_config else []) }}
  ansible.builtin.command:
    argv: "{{ validation_aggregator_argv + validation_extra_argv }}"
  register: validation_run
  changed_when: false
  failed_when:
    - validation_fail_on_blocking | bool
    - validation_run.rc != 0
  tags: [validation, operations]

- name: Read the generated summary from the managed node
  ansible.builtin.slurp:
    src: "{{ validation_summary_path }}"
  register: validation_summary_slurp
  check_mode: false
  failed_when: false
  tags: [validation, operations]

- name: Display validation summary
  ansible.builtin.debug:
    msg: >-
      {{ (validation_summary_slurp.content | default('') | b64decode)
         | default('Validation completed.', true) }}
  tags: [validation, operations]
