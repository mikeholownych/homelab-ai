---
- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart vLLM service
  ansible.builtin.systemd_service:
    name: vllm.service
    state: restarted
  when:
    - vllm_xpu_service_enabled | default(false) | bool
    - vllm_xpu_install_enabled | default(false) | bool
    - not ansible_check_mode
