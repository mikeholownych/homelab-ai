---
- name: Validate vLLM XPU role inputs
  ansible.builtin.assert:
    that:
      - vllm_xpu_version is string
      - vllm_xpu_version | length > 0
      - vllm_xpu_container_digest is match("^sha256:[0-9a-fA-F]{64}$")
      - vllm_xpu_profiles is mapping
      - "vllm_xpu_active_profile in vllm_xpu_profiles"
      - (vllm_xpu_profiles[vllm_xpu_active_profile]).tensor_parallel_size in [1, 2]
      - vllm_xpu_api_key is none
    fail_msg: >-
      vllm_xpu requires a valid pinned version, image digest, and profile configuration.
      vllm_xpu_api_key must stay null in Git; it is populated only from Vault at runtime.
  tags: [inference, runtime, vllm]


- name: Enforce lifecycle registry authority over this role's pins
  ansible.builtin.assert:
    that:
      - committed_registry.current is none
        or committed_registry.current == vllm_xpu_version
    fail_msg: >-
      Divergence detected: group_vars/gpu.yml declares vllm current
      {{ committed_registry.current }} while the role pins vllm_xpu_version_VAR. One authority:
      update both in the same commit or better, keep them equal.
  vars:
    committed_registry_path: "{{ role_path }}/../../inventory/production/group_vars/gpu.yml"
    committed_registry: >-
      {{ (lookup('ansible.builtin.file', committed_registry_path, errors='ignore')
         | from_yaml).runtime_profiles.vllm | default({}) }}
- name: Require authenticated serving for network-bound vLLM
  ansible.builtin.assert:
    that:
      - not (vllm_xpu_service_enabled | bool)
        or not (vllm_xpu_install_enabled | bool)
        or (vllm_xpu_api_key_required | bool)
        or vllm_xpu_host is match('^(127\\.|\\[::1\\]|localhost$)')
    fail_msg: >-
      vLLM bound beyond loopback must require an API key
      (vllm_xpu_api_key_required=true) so Vault-backed auth is enforced.
  tags: [inference, runtime, vllm]

- name: Read vLLM API key from Vault at runtime
  ansible.builtin.include_role:
    name: vault_integration
    tasks_from: main.yml
  vars:
    vault_integration_operation: read
    vault_integration_secret_ref: "{{ vllm_xpu_api_key_secret_path }}"
    vault_integration_required_secret_keys:
      - "{{ vllm_xpu_api_key_secret_file_key }}"
  when:
    - vllm_xpu_service_enabled | bool
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_api_key_required | bool
    - vault_integration_enabled | default(false) | bool
    - not ansible_check_mode
  no_log: true
  tags: [inference, runtime, vllm, vault]

- name: Publish retrieved API key for environment rendering
  ansible.builtin.set_fact:
    vllm_xpu_api_key: "{{ vault_integration_secret[vllm_xpu_api_key_secret_file_key] }}"
  no_log: true
  when:
    - vllm_xpu_service_enabled | bool
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_api_key_required | bool
    - vault_integration_secret is defined
    - vault_integration_secret
    - not ansible_check_mode
  tags: [inference, runtime, vllm]

- name: Preserve or generate vLLM API key when Vault is disabled
  when:
    - vllm_xpu_service_enabled | bool
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_api_key_required | bool
    - vllm_xpu_api_key is none
    - not (vault_integration_enabled | default(false) | bool)
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
  no_log: true
  tags: [inference, runtime, vllm]
  block:
    - name: Slurp existing vLLM configuration file
      ansible.builtin.slurp:
        src: "{{ vllm_xpu_config_file }}"
      register: vllm_xpu_existing_config
      failed_when: false

    - name: Set API key from existing configuration or generate fresh token
      ansible.builtin.set_fact:
        vllm_xpu_api_key: >-
          {{
            ((vllm_xpu_existing_config.content | b64decode | from_yaml)['api-key'])
            if (vllm_xpu_existing_config is defined and vllm_xpu_existing_config.content is defined
                and (vllm_xpu_existing_config.content | length > 0)
                and ((vllm_xpu_existing_config.content | b64decode | from_yaml)['api-key'] | default(none)))
            else (lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=43'))
          }}

- name: Create vLLM service directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_xpu_user }}"
    group: "{{ vllm_xpu_group }}"
    mode: "0750"
  loop:
    - "{{ vllm_xpu_config_dir }}"
    - "{{ vllm_xpu_log_dir }}"
    - "{{ vllm_xpu_model_cache_dir }}"
  when:
    - vllm_xpu_install_enabled | bool
  tags: [inference, runtime, vllm]

- name: Require container runtime for container-mode vLLM
  ansible.builtin.assert:
    that:
      - not (vllm_xpu_install_enabled | bool)
        or (vllm_xpu_runtime_mode != 'container')
        or (container_runtime_enabled | bool)
    fail_msg: >-
      vLLM container mode requires the container runtime role
      (container_runtime_enabled=true) so GPU CDI devices exist.
  tags: [inference, runtime, vllm]

- name: Install vLLM XPU container launcher
  ansible.builtin.copy:
    src: vllm-xpu-runner.sh
    dest: /usr/local/bin/vllm-xpu-runner
    owner: root
    group: root
    mode: "0755"
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_runtime_mode == 'container'
  tags: [inference, runtime, vllm]

- name: Install vLLM container cleanup hook
  ansible.builtin.copy:
    src: vllm-xpu-cleanup.sh
    dest: /usr/local/bin/vllm-xpu-cleanup
    owner: root
    group: root
    mode: "0755"
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_runtime_mode == 'container'
  tags: [inference, runtime, vllm]

- name: Create vLLM recovery evidence record owned by the service account
  ansible.builtin.copy:
    content: |
      {"service":"vllm_xpu","event":"initialized","class":"none","stage_reached":"","exit_code":0,"restart_count":null,"restart_count_source":"uninitialized","restart_count_obtained_at":"","service_invocation_id":"","terminal":false,"started_at":"","boot_id":""}
    dest: "{{ vllm_xpu_recovery_record }}"
    owner: "{{ vllm_xpu_user }}"
    group: "{{ vllm_xpu_group }}"
    mode: "0640"
    force: false
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
  tags: [inference, runtime, vllm]

- name: Create vLLM readiness evidence record owned by the service account
  ansible.builtin.copy:
    content: "{{ vllm_xpu_initial_readiness_record | to_json(separators=(',', ':')) }}\n"
    dest: "{{ vllm_xpu_readiness_record }}"
    owner: "{{ vllm_xpu_user }}"
    group: "{{ vllm_xpu_group }}"
    mode: "0640"
    force: false
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
  tags: [inference, runtime, vllm]

- name: Install vLLM readiness prober
  ansible.builtin.copy:
    src: vllm-readiness-probe.sh
    dest: "{{ vllm_xpu_readiness_probe }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart vLLM service
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_runtime_mode == 'container'
  tags: [inference, runtime, vllm]

- name: Pin the exact container image reference by digest
  ansible.builtin.copy:
    content: "{{ vllm_xpu_container_image }}@{{ vllm_xpu_container_digest }}\n"
    dest: "{{ vllm_xpu_config_dir }}/image-ref"
    owner: root
    group: root
    mode: "0644"
  notify: Restart vLLM service
  when:
    - vllm_xpu_install_enabled | bool
  tags: [inference, runtime, vllm]

- name: Record deployed vLLM version stamp for evidence provenance
  ansible.builtin.copy:
    content: "{{ vllm_xpu_version }}\n"
    dest: "{{ vllm_xpu_config_dir }}/VERSION"
    owner: root
    group: root
    mode: "0644"
  when:
    - vllm_xpu_install_enabled | bool
  tags: [inference, runtime, vllm]

- name: Render vLLM configuration file
  ansible.builtin.template:
    src: vllm-config.yaml.j2
    dest: "{{ vllm_xpu_config_file }}"
    owner: "{{ vllm_xpu_user }}"
    group: "{{ vllm_xpu_group }}"
    mode: "0600"
  notify: Restart vLLM service
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
  tags: [inference, runtime, vllm]

- name: Render vLLM runtime environment file
  ansible.builtin.template:
    src: vllm.env.j2
    dest: "{{ vllm_xpu_env_file }}"
    owner: "{{ vllm_xpu_user }}"
    group: "{{ vllm_xpu_group }}"
    mode: "0600"
  notify: Restart vLLM service
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
  tags: [inference, runtime, vllm]

- name: Install vLLM systemd service unit
  ansible.builtin.template:
    src: vllm.service.j2
    dest: /etc/systemd/system/vllm.service
    owner: root
    group: root
    mode: "0644"
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
  notify: Reload systemd daemon
  tags: [inference, runtime, vllm]

- name: Establish vLLM service desired state
  ansible.builtin.systemd_service:
    name: vllm.service
    daemon_reload: true
    enabled: "{{ vllm_xpu_service_enabled | bool }}"
    state: "{{ 'started' if (vllm_xpu_service_enabled | bool) else 'stopped' }}"
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
    - not ansible_check_mode
  tags: [inference, runtime, vllm]

- name: Install vLLM live validator
  ansible.builtin.copy:
    src: validate_vllm.py
    dest: "{{ vllm_xpu_validator }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
  tags: [inference, validation, vllm]

- name: Run vLLM live validator against the running service
  ansible.builtin.command:
    argv: >-
      {{ [vllm_xpu_validator, '--host', '127.0.0.1', '--port', vllm_xpu_port | string,
          '--tensor-parallel-size',
          (vllm_xpu_profiles[vllm_xpu_active_profile]).tensor_parallel_size | string]
          + (['--model', vllm_xpu_model_id]
             if (vllm_xpu_model_id | default(none)) is not none else [])
          + ['--output', vllm_xpu_validation_path]
          + ['--readiness-record', vllm_xpu_readiness_record] }}
  environment:
    VLLM_API_KEY: "{{ vllm_xpu_api_key | default('') }}"
  register: vllm_xpu_live_validation_run
  until: vllm_xpu_live_validation_run.rc == 0
  retries: 60
  delay: 10
  changed_when: false
  no_log: true
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_service_enabled | bool
    - vllm_xpu_deployment_mode | default('single') != 'dual_tp1'
    - not ansible_check_mode
  tags: [inference, validation, vllm]

- name: Record vLLM validation state during check mode or when the service is disabled
  ansible.builtin.copy:
    content: >-
      {{ {
        'schema_version': '1.0.0',
        'service': 'vllm_xpu',
        'status': 'NOT_TESTED',
        'physical_acceptance': false,
        'simulated': false,
        'endpoint': 'http://' ~ vllm_xpu_host ~ ':' ~ (vllm_xpu_port | string),
        'tensor_parallel_size': (vllm_xpu_profiles[vllm_xpu_active_profile]).tensor_parallel_size,
        'reason': 'check mode or service disabled skips live service validation'
      } | to_nice_json }}
    dest: "{{ vllm_xpu_validation_path }}"
    owner: root
    group: root
    mode: "0640"
  when:
    - ansible_check_mode or not (vllm_xpu_service_enabled | bool)
  tags: [inference, validation, vllm]

- name: Install T5820 persistent dual TP=1 workers
  ansible.builtin.include_tasks: dual_tp1.yml
  when:
    - vllm_xpu_install_enabled | bool
    - vllm_xpu_deployment_mode | default('single') == 'dual_tp1'
  tags: [inference, runtime, vllm, t5820]
