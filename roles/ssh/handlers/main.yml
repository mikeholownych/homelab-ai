---
- name: Validate SSH daemon configuration before reload
  ansible.builtin.command:
    cmd: "{{ ssh_reload_validate_command }}"
  changed_when: false
  when: ssh_manage_runtime | bool
  listen: Reload SSH daemon

- name: Reload SSH daemon
  ansible.builtin.systemd:
    name: ssh.service
    state: reloaded
  when: ssh_manage_runtime | bool
  listen: Reload SSH daemon
