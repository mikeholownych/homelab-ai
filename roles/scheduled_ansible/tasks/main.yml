---
- name: Validate scheduled reconciliation inputs
  ansible.builtin.assert:
    that:
      - scheduled_ansible_reconcile_enabled is boolean
      - scheduled_ansible_patch_enabled is boolean
      - scheduled_ansible_validate_enabled is boolean
      - scheduled_ansible_benchmark_enabled is boolean
      - scheduled_ansible_runner_path is string
      - scheduled_ansible_log_dir is string
    fail_msg: >-
      scheduled_ansible requires boolean enablement flags and valid paths.
  tags: [scheduled_ansible, operations]

- name: Create scheduled reconciliation log directory
  ansible.builtin.file:
    path: "{{ scheduled_ansible_log_dir }}"
    state: directory
    owner: "{{ scheduled_ansible_user }}"
    group: root
    mode: "0750"
  tags: [scheduled_ansible, operations]

# A lifecycle timer's units exist only while it is enabled: a disabled timer is stopped and its units removed, so the
# host carries nothing that cannot or must not run there (e.g. on the inference appliance reconciliation runs from the
# controller, and on-host benchmarks are retired by inference_origin, which also removes those units).
- name: Stop lifecycle timers that are disabled
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: false
    state: stopped
  loop: "{{ _scheduled_ansible_timers | rejectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false
  when: not ansible_check_mode
  tags: [scheduled_ansible, operations]

- name: Remove units of disabled lifecycle timers
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.0.name }}.{{ item.1 }}"
    state: absent
  loop: "{{ _scheduled_ansible_timers | rejectattr('enabled') | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
  notify: Reload systemd daemon
  tags: [scheduled_ansible, operations]

- name: Install units of enabled lifecycle timers
  ansible.builtin.template:
    src: "{{ item.0.name }}.{{ item.1 }}.j2"
    dest: "/etc/systemd/system/{{ item.0.name }}.{{ item.1 }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _scheduled_ansible_timers | selectattr('enabled') | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
  notify: Reload systemd daemon
  tags: [scheduled_ansible, operations]

- name: Apply unit changes before starting timers
  ansible.builtin.meta: flush_handlers
  tags: [scheduled_ansible, operations]

- name: Enable and start enabled lifecycle timers
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ _scheduled_ansible_timers | selectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode
  tags: [scheduled_ansible, operations]
