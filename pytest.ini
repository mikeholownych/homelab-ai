[pytest]
# The sealed phase sources are NOT on this path. phase*/src/autonomous_engineering packages are merged with
# pkgutil.extend_path and many modules exist in several phases, so one shared path lets the earliest entry win for
# every phase. Phase tests run one phase per process with their own path: `make test-phases`
# (scripts/run-phase-tests.sh). A plain `pytest` runs tests/ only.
pythonpath = .
testpaths = tests
norecursedirs =
    .*
    build
    dist
    CVS
    _darcs
    {arch}
    *.egg
    fixtures
    .worktrees
    phase[0-9]*

filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
