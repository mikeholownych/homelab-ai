---
# Dell Precision 5820 Tower — lab test host for non-production dry-runs.
ansible_host: 127.0.0.1
node_metadata:
  environment: lab
  hostname: ai-5820-test-01
hardware_profile: d5820_dual_b65
os_tuning_profile: baseline

node_roles:
  inference: true
  gpu: true

capabilities:
  gpu: true
  inference: true
  benchmarking: true
  monitoring: true
  cluster_eligible: true

features:
  monitoring: true
  scheduled_reconciliation: true
  os_tuning: true
  observability: false
  model_registry: false
  clustering: false
  cmdb_export: false
  itsm_integration: false
  ray_enabled: false
  distributed_vllm_enabled: false

network_endpoints:
  primary_bind_address: null
  management_fqdn: null
  metrics_endpoint: null

benchmarking_psu_capacity_watts: 950
benchmarking_gpu_tdp_watts: 200

cluster:
  enabled: false
  name: null
  membership_state: standalone
  node_role: worker
  roles:
    worker: true
    api: false
    scheduler: false
    storage: false
  capabilities:
    ray: false
    distributed_vllm: false
    worker_service: true
    api_service: false
    scheduler_service: false
    storage_service: false
  ray_enabled: false
  distributed_vllm_enabled: false
  endpoints:
    api_base_url: null
    scheduler_address: null
    ray_gcs_address: null
    object_storage_url: null
  fleet:
    id: null
    coordinator: null
    peer_hosts: []
    quorum_size: null
