---
# Dell Precision 5820 Tower — lab test host for non-production dry-runs.
ansible_host: 127.0.0.1
node_metadata:
  environment: lab
  hostname: ai-5820-test-01
hardware_profile: d5820_dual_b65
os_tuning_profile: baseline

node_roles:
  inference: true
  gpu: true

capabilities:
  gpu: true
  inference: true
  benchmarking: true
  monitoring: true
  cluster_eligible: true

features:
  monitoring: true
  scheduled_reconciliation: true
  os_tuning: true
  observability: false
  model_registry: false
  clustering: false
  cmdb_export: false
  itsm_integration: false
  ray_enabled: false
  distributed_vllm_enabled: false

network_endpoints:
  primary_bind_address: null
  management_fqdn: null
  metrics_endpoint: null

benchmarking_psu_capacity_watts: 950
benchmarking_gpu_tdp_watts: 200

# B0 baseline identity for lab dry-runs; mirrors ai-5820-01 so simulated
# evidence produced here carries the same attribution as production.
benchmarking_baseline_id: B0
benchmarking_config_id: b0
benchmarking_model: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
benchmarking_revision: main
benchmarking_quantization: AWQ-4bit
