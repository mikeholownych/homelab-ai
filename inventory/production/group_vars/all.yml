    enabled: true
  patching:
    enabled: true
  upgrades:
    enabled: true
  validation:
    enabled: true
  benchmarking:
    enabled: true

runtime_commissioning_policy:
  allow_mutable_channels: false
  null_pins_allowed_only_when_disabled: true
