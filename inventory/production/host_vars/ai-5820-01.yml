---
# Dell Precision 5820 Tower — dedicated dual-GPU inference host.
# OS on NVMe #1; NVMe #2 is reserved for model/cache data (see storage_mounts).
ansible_host: 10.0.8.5
ansible_user: mike
platform_release: "26.04"
platform_codename: resolute
node_metadata:
  environment: production
  hostname: ai-5820-01
hardware_profile: d5820_dual_b65
os_tuning_profile: baseline

node_roles:
  inference: true
  gpu: true

capabilities:
  gpu: true
  inference: true
  benchmarking: true
  monitoring: true
  cluster_eligible: true

features:
  monitoring: true
  scheduled_reconciliation: true
  os_tuning: true
  observability: false
  model_registry: false
  clustering: false
  cmdb_export: false
  itsm_integration: false
  ray_enabled: false
  distributed_vllm_enabled: false

network_endpoints:
  primary_bind_address: null
  management_fqdn: null
  metrics_endpoint: null

# Storage: Guarded LVM volume spanned across both NVMe drives.
storage_lvm:
  enabled: true
  vg: ubuntu-vg
  lv: local-ai-lv
  size: 550g
  fstype: xfs
  mount_path: /var/lib/local-ai
  reserve_gib: 50
  expected_pvs:
    - /dev/nvme0n1p3
    - /dev/nvme1n1p1


# Benchmarking guardrails tuned to this host: 950 W PSU and ~200 W Arc Pro B65 TDP.
benchmarking_psu_capacity_watts: 950
benchmarking_gpu_tdp_watts: 200

# B0 frozen baseline identity. These values MUST match the frozen runtime
# identity (git 666f639, vllm 0.9.x on dual Arc Pro B65) recorded in
# roles/benchmarking/files/b0-matrix.json; they are repeated here so a B0 run
# is attributable at the host level without consulting a cross-machine doc.
benchmarking_baseline_id: B0
benchmarking_config_id: b0
benchmarking_model: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
benchmarking_revision: main
benchmarking_quantization: AWQ-4bit
# Frozen declared artifact digest (recorded in b0-matrix.json); carried on run
# cards via --artifact-sha256 because podman is not the deploy mechanism for
# the systemd runner, so the digest is not discoverable at runtime.
benchmarking_model_artifact_sha256: "4bdfd5b928b4a6a95c92b1edc861f13587a797a32db8c1bc96ca4e2c0d58629d"
benchmarking_service_unit: vllm.service
benchmarking_container_name: vllm-xpu

# Inference runtime parameters for dual-GPU Alchemist Arc Pro B65
intel_gpu_manage_modprobe: true
container_runtime_enabled: true
container_runtime_package: podman
container_runtime_package_version: "5.7.0+ds2-3build1"
container_runtime_rootless_enabled: true

users_local_ai_device_groups:
  - render
  - video

vllm_xpu_install_enabled: true
vllm_xpu_service_enabled: true
vllm_xpu_version: "0.29.0"
vllm_xpu_container_image: "docker.io/vllm/vllm-openai-xpu"
vllm_xpu_container_tag: "v0.29.0"
vllm_xpu_container_digest: "sha256:4bdfd5b928b4a6a95c92b1edc861f13587a797a32db8c1bc96ca4e2c0d58629d"
vllm_xpu_host: "0.0.0.0"
vllm_xpu_api_key_required: true
vllm_xpu_tensor_parallel_size: 2
vllm_xpu_active_profile: coder_30b
vllm_xpu_enforce_eager: false
vllm_xpu_gpu_memory_utilization: 0.90
vllm_xpu_max_model_len: 65536
vllm_xpu_model_id: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
vllm_xpu_tool_call_parser: qwen3_coder
vllm_xpu_deployment_mode: dual_tp1
# vLLM baseline retired from GPU 0 in favor of llama.cpp (higher accuracy-per-time in the engineering
# benchmark); configuration is kept so it can be restored with vllm_xpu_workers_state: started.
vllm_xpu_workers_state: stopped
vllm_xpu_model_revision: "4bd30395b72ea6045edd04806c4fea448d4467b3"
vllm_xpu_model_path: "/var/lib/local-ai/models/hub/models--cyankiwi--Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit/snapshots/4bd30395b72ea6045edd04806c4fea448d4467b3"
vllm_xpu_workers:
  worker1:
    worker_id: b0-live-tp1-worker1
    service_name: aihost-vllm-worker1.service
    container_name: vllm-xpu-tp1-worker1
    gpu: 0
    port: 8000
    extra_config:
      speculative-config: '{"method":"ngram","num_speculative_tokens":5,"prompt_lookup_max":5,"prompt_lookup_min":2}'
    config_dir: /etc/local-ai/vllm/worker1
    config_file: /etc/local-ai/vllm/worker1/vllm-config.yaml
    env_file: /etc/local-ai/vllm/worker1/vllm.env
    recovery_record: /var/lib/aihost/evidence/vllm-worker1-recovery.json
    readiness_record: /var/lib/aihost/evidence/vllm-worker1-readiness.json
    initial_recovery_record: '{"service":"vllm-worker1","event":"initialized","class":"none","stage_reached":"","exit_code":0,"restart_count":null,"restart_count_source":"uninitialized","restart_count_obtained_at":"","service_invocation_id":"","terminal":false,"started_at":"","boot_id":""}'
    initial_readiness_record: '{"schema_version":"1.0.0","service":"vllm-worker1","readiness_state":"initialized","process_started_at":"","health_ready_at":null,"model_ready_at":null,"validation_ready_at":null,"startup_duration":null,"model_identity":{"expected":"","observed":""},"tensor_parallel_size":{"expected":1,"observed":null},"boot_id":"","service_invocation_id":"","endpoint":"","probe_note":"record created by role"}'

# GPU 1 runs llama.cpp (SYCL) instead of a second vLLM worker: measured 4x faster decode on
# the same model (76-79 vs ~18 tok/s) with warm prompt-cache reuse; vLLM stays on GPU 0.
llama_cpp_container_enabled: true
llama_cpp_container_digest: sha256:2f4940610095fe48aabff3db7f87feb4f553081302b1a5a8744a589eb123b451
llama_cpp_container_retired_services: [aihost-vllm-worker2.service]
# Retired vLLM worker2 config plus the manual dual-worker experiment configs; all embed API keys.
llama_cpp_container_retired_paths:
  - /etc/local-ai/vllm/worker2
  - /etc/local-ai/t5820-dual-worker
  - /etc/local-ai/t5820-dual-worker-attempt2
llama_cpp_container_workers:
  worker1:
    worker_id: b0-live-llama-worker1
    service_name: aihost-llama-worker1.service
    container_name: llama-sycl-worker1
    gpu: 0
    port: 8000
    config_dir: /etc/local-ai/llama/worker1
    model_file: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
    served_name: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M
    context: 65536
  worker2:
    worker_id: b0-live-llama-deep-worker2
    service_name: aihost-llama-worker2.service
    container_name: llama-sycl-worker2
    gpu: 1
    port: 8001
    config_dir: /etc/local-ai/llama/worker2
    model_file: Qwen3.5-27B-Q4_K_M.gguf
    served_name: Qwen3.5-27B-Q4_K_M
    context: 65536

# Scheduled lifecycle timers are OFF. The snapshot runner needs a deployed repo snapshot at /opt/local-ai
# (absent), and the reconcile unit converges with site.yml, which would overwrite the live inference
# topology (OS tuning, single-vLLM unit). Re-enable only after (a) a snapshot is deployed, and
# (b) reconcile/validate target playbooks/inference.yml and a validate play that matches this topology.
scheduled_ansible_reconcile_enabled: false
scheduled_ansible_validate_enabled: false

# eno1 is only the VLAN parent (address lives on eno1.2) and never reaches 'configured', which made
# systemd-networkd-wait-online time out (2 min) at every boot.
boot_network_wait_optional_interfaces: [eno1]

# TTY1 monitoring console (vllm-top, built from ~/Projects/vllm-top)
vllm_top_console_enabled: true

orchestrator_gateway_enabled: true
orchestrator_gateway_port: 8010
orchestrator_gateway_release_id: t5820-gateway-510a425
orchestrator_gateway_release_dir: /var/lib/aihost/releases/t5820-gateway-510a425
orchestrator_gateway_evidence_path: /var/lib/aihost/evidence/t5820-gateway-persistent.jsonl
# Model routing. Pools: lead = Qwen3-Coder-30B (fast, best first-attempt), deep = Qwen3.5-27B (slower, best
# validated accuracy; uniquely solves tasks the lead misses; best reviewer). Aliases bypass the rules.
orchestrator_gateway_routes:
  - {id: deep-tasks, match: {task_class: [review, escalate, architecture, debug-hard]}, pool: deep, fallback: [lead]}
  - {id: default, match: {}, pool: lead, fallback: [deep]}
orchestrator_gateway_model_aliases:
  engineering/lead: lead
  engineering/deep: deep
orchestrator_gateway_workers:
  - worker_id: b0-live-llama-worker1
    pool: lead
    engine: llama.cpp
    port: 8000
    public_model_id: engineering/b0
    model_id: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M
    revision: gguf-fadc3e5f8d42
    artifact_digest: sha256:fadc3e5f8d42bf7e894a785b05082e47daee4df26680389817e2093056f088ad
    runtime_image_digest: sha256:2f4940610095fe48aabff3db7f87feb4f553081302b1a5a8744a589eb123b451
    topology: llama-cpp-sycl
    gpu_assignment: ["0"]
    capabilities: [navigation, coding, structured_output, tool_call_proposal]
    context_limit: 65536
    max_output_tokens: 1024
    max_concurrency: 1
    resource_envelope: {memory_reserve_gib: 8, memory_available_floor_gib: 8}
    evidence_ids: [llama-sycl-bench-20261002, engx-engineering-bench-20261003]
    registry_version: 1
    measured_at: "2026-10-03T00:00:00+00:00"
    valid_until: "2026-12-31T00:00:00+00:00"
    endpoint: http://127.0.0.1:8000
    token_file: /etc/local-ai/llama/worker1/worker-api-key
  - worker_id: b0-live-llama-deep-worker2
    pool: deep
    engine: llama.cpp
    port: 8001
    public_model_id: engineering/deep
    model_id: Qwen3.5-27B-Q4_K_M
    revision: gguf-84b5f7f11215
    artifact_digest: sha256:84b5f7f112156d63836a01a69dc3f11a6ba63b10a23b8ca7a7efaf52d5a2d806
    runtime_image_digest: sha256:2f4940610095fe48aabff3db7f87feb4f553081302b1a5a8744a589eb123b451
    topology: llama-cpp-sycl
    gpu_assignment: ["1"]
    capabilities: [navigation, coding, structured_output, tool_call_proposal, review]
    context_limit: 65536
    max_output_tokens: 1024
    max_concurrency: 1
    resource_envelope: {memory_reserve_gib: 8, memory_available_floor_gib: 8}
    evidence_ids: [llama-sycl-bench-20261002, engx-engineering-bench-20261003]
    registry_version: 1
    measured_at: "2026-10-03T00:00:00+00:00"
    valid_until: "2026-12-31T00:00:00+00:00"
    endpoint: http://127.0.0.1:8001
    token_file: /etc/local-ai/llama/worker2/worker-api-key

cluster:
  enabled: false
  name: null
  membership_state: standalone
  node_role: worker
  roles:
    worker: true
    api: false
    scheduler: false
    storage: false
  capabilities:
    ray: false
    distributed_vllm: false
    worker_service: true
    api_service: false
    scheduler_service: false
    storage_service: false
  ray_enabled: false
  distributed_vllm_enabled: false
  endpoints:
    api_base_url: null
    scheduler_address: null
    ray_gcs_address: null
    object_storage_url: null
  fleet:
    id: null
    coordinator: null
    peer_hosts: []
    quorum_size: null
