cluster:
  enabled: false
  name: null
  membership_state: standalone
  node_role: worker
  roles:
    worker: true
    api: false
    scheduler: false
    storage: false
  capabilities:
    ray: false
    distributed_vllm: false
    worker_service: true
    api_service: false
    scheduler_service: false
    storage_service: false
  ray_enabled: false
  distributed_vllm_enabled: false
  endpoints:
    api_base_url: null
