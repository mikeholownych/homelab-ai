---
# Dell Precision 5820 Tower — dedicated dual-GPU inference host.
# OS on NVMe #1; NVMe #2 is reserved for model/cache data (see storage_mounts).
ansible_host: 10.0.8.5
ansible_user: mike
platform_release: "26.04"
platform_codename: resolute
node_metadata:
  environment: production
  hostname: ai-5820-01
hardware_profile: d5820_dual_b65
os_tuning_profile: baseline

node_roles:
  inference: true
  gpu: true

capabilities:
  gpu: true
  inference: true
  benchmarking: true
  monitoring: true
  cluster_eligible: true

features:
  monitoring: true
  scheduled_reconciliation: true
  os_tuning: true
  observability: false
  model_registry: false
  clustering: false
  cmdb_export: false
  itsm_integration: false
  ray_enabled: false
  distributed_vllm_enabled: false

network_endpoints:
  primary_bind_address: null
  management_fqdn: null
  metrics_endpoint: null

# Storage: Guarded LVM volume spanned across both NVMe drives.
storage_lvm:
  enabled: true
  vg: ubuntu-vg
  lv: local-ai-lv
  size: 550g
  fstype: xfs
  mount_path: /var/lib/local-ai
  reserve_gib: 50
  expected_pvs:
    - /dev/nvme0n1p3
    - /dev/nvme1n1p1


# Benchmarking guardrails tuned to this host: 950 W PSU and ~200 W Arc Pro B65 TDP.
benchmarking_psu_capacity_watts: 950
benchmarking_gpu_tdp_watts: 200

# Inference runtime parameters for dual-GPU Alchemist Arc Pro B65
intel_gpu_manage_modprobe: true
container_runtime_enabled: true
container_runtime_package: podman
container_runtime_package_version: "5.7.0+ds2-3build1"
container_runtime_rootless_enabled: true

users_local_ai_device_groups:
  - render
  - video

vllm_xpu_install_enabled: true
vllm_xpu_service_enabled: true
vllm_xpu_version: "0.29.0"
vllm_xpu_container_image: "docker.io/vllm/vllm-openai-xpu"
vllm_xpu_container_tag: "v0.29.0"
vllm_xpu_container_digest: "sha256:4bdfd5b928b4a6a95c92b1edc861f13587a797a32db8c1bc96ca4e2c0d58629d"
vllm_xpu_host: "0.0.0.0"
vllm_xpu_api_key_required: true
vllm_xpu_tensor_parallel_size: 2
vllm_xpu_active_profile: large
vllm_xpu_enforce_eager: true
vllm_xpu_gpu_memory_utilization: 0.35
vllm_xpu_max_model_len: 32768
vllm_xpu_model_id: "Qwen/Qwen2.5-7B-Instruct-AWQ"

cluster:
  enabled: false
  name: null
  membership_state: standalone
  node_role: worker
  roles:
    worker: true
    api: false
    scheduler: false
    storage: false
  capabilities:
    ray: false
    distributed_vllm: false
    worker_service: true
    api_service: false
    scheduler_service: false
    storage_service: false
  ray_enabled: false
  distributed_vllm_enabled: false
  endpoints:
    api_base_url: null
    scheduler_address: null
    ray_gcs_address: null
    object_storage_url: null
  fleet:
    id: null
    coordinator: null
    peer_hosts: []
    quorum_size: null
