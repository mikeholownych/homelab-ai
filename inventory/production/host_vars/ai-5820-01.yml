    artifact_digest: sha256:e1445553df3853287b63ee353817b0e2a26431488bcd529d5e54baeac4091061
    runtime_image_digest: sha256:4bdfd5b928b4a6a95c92b1edc861f13587a797a32db8c1bc96ca4e2c0d58629d
    topology: tp1
