---
# Dell Precision 5820 Tower — dedicated dual-GPU inference host.
# OS on NVMe #1; NVMe #2 is reserved for model/cache data (see storage_mounts).
ansible_host: 10.0.8.5
ansible_user: mike
platform_release: "26.04"
platform_codename: resolute
node_metadata:
  environment: production
  hostname: ai-5820-01
hardware_profile: d5820_dual_b65
os_tuning_profile: baseline

node_roles:
  inference: true
  gpu: true

capabilities:
  gpu: true
  inference: true
  benchmarking: true
  monitoring: true
  cluster_eligible: true

features:
  monitoring: true
  scheduled_reconciliation: true
  os_tuning: true
  observability: false
  model_registry: false
  clustering: false
  cmdb_export: false
  itsm_integration: false
  ray_enabled: false
  distributed_vllm_enabled: false

network_endpoints:
  primary_bind_address: null
  management_fqdn: null
  metrics_endpoint: null

# Storage: Guarded LVM volume spanned across both NVMe drives.
storage_lvm:
  enabled: true
  vg: ubuntu-vg
  lv: local-ai-lv
  size: 550g
  fstype: xfs
  mount_path: /var/lib/local-ai
  reserve_gib: 50
  expected_pvs:
    - /dev/nvme0n1p3
    - /dev/nvme1n1p1


# Benchmarking guardrails tuned to this host: 950 W PSU and ~200 W Arc Pro B65 TDP.
benchmarking_psu_capacity_watts: 950
benchmarking_gpu_tdp_watts: 200

# B0 frozen baseline identity. These values MUST match the frozen runtime
# identity (git 666f639, vllm 0.9.x on dual Arc Pro B65) recorded in
# roles/benchmarking/files/b0-matrix.json; they are repeated here so a B0 run
# is attributable at the host level without consulting a cross-machine doc.
benchmarking_baseline_id: B0
benchmarking_config_id: b0
benchmarking_model: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
benchmarking_revision: main
benchmarking_quantization: AWQ-4bit
# Frozen declared artifact digest (recorded in b0-matrix.json); carried on run
# cards via --artifact-sha256 because podman is not the deploy mechanism for
# the systemd runner, so the digest is not discoverable at runtime.
benchmarking_model_artifact_sha256: "4bdfd5b928b4a6a95c92b1edc861f13587a797a32db8c1bc96ca4e2c0d58629d"
benchmarking_service_unit: vllm.service
benchmarking_container_name: vllm-xpu

# Inference runtime parameters for dual-GPU Alchemist Arc Pro B65
intel_gpu_manage_modprobe: true
container_runtime_enabled: true
container_runtime_package: podman
container_runtime_package_version: "5.7.0+ds2-3build1"
container_runtime_rootless_enabled: true

users_local_ai_device_groups:
  - render
  - video

vllm_xpu_install_enabled: true
vllm_xpu_service_enabled: true
vllm_xpu_version: "0.29.0"
vllm_xpu_container_image: "docker.io/vllm/vllm-openai-xpu"
vllm_xpu_container_tag: "v0.29.0"
vllm_xpu_container_digest: "sha256:4bdfd5b928b4a6a95c92b1edc861f13587a797a32db8c1bc96ca4e2c0d58629d"
vllm_xpu_host: "0.0.0.0"
vllm_xpu_api_key_required: true
vllm_xpu_tensor_parallel_size: 2
vllm_xpu_active_profile: coder_30b
vllm_xpu_enforce_eager: false
vllm_xpu_gpu_memory_utilization: 0.90
vllm_xpu_max_model_len: 65536
vllm_xpu_model_id: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
vllm_xpu_tool_call_parser: qwen3_coder
vllm_xpu_deployment_mode: dual_tp1
vllm_xpu_model_revision: "4bd30395b72ea6045edd04806c4fea448d4467b3"
vllm_xpu_model_path: "/var/lib/local-ai/models/hub/models--cyankiwi--Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit/snapshots/4bd30395b72ea6045edd04806c4fea448d4467b3"
vllm_xpu_workers:
  worker1:
    worker_id: b0-live-tp1-worker1
    service_name: aihost-vllm-worker1.service
    container_name: vllm-xpu-tp1-worker1
    gpu: 0
    port: 8000
    config_dir: /etc/local-ai/vllm/worker1
    config_file: /etc/local-ai/vllm/worker1/vllm-config.yaml
    env_file: /etc/local-ai/vllm/worker1/vllm.env
    recovery_record: /var/lib/aihost/evidence/vllm-worker1-recovery.json
    readiness_record: /var/lib/aihost/evidence/vllm-worker1-readiness.json
    initial_recovery_record: '{"service":"vllm-worker1","event":"initialized","class":"none","stage_reached":"","exit_code":0,"restart_count":null,"restart_count_source":"uninitialized","restart_count_obtained_at":"","service_invocation_id":"","terminal":false,"started_at":"","boot_id":""}'
    initial_readiness_record: '{"schema_version":"1.0.0","service":"vllm-worker1","readiness_state":"initialized","process_started_at":"","health_ready_at":null,"model_ready_at":null,"validation_ready_at":null,"startup_duration":null,"model_identity":{"expected":"","observed":""},"tensor_parallel_size":{"expected":1,"observed":null},"boot_id":"","service_invocation_id":"","endpoint":"","probe_note":"record created by role"}'
  worker2:
    worker_id: b0-live-tp1-worker2
    service_name: aihost-vllm-worker2.service
    container_name: vllm-xpu-tp1-worker2
    gpu: 1
    port: 8001
    config_dir: /etc/local-ai/vllm/worker2
    config_file: /etc/local-ai/vllm/worker2/vllm-config.yaml
    env_file: /etc/local-ai/vllm/worker2/vllm.env
    recovery_record: /var/lib/aihost/evidence/vllm-worker2-recovery.json
    readiness_record: /var/lib/aihost/evidence/vllm-worker2-readiness.json
    initial_recovery_record: '{"service":"vllm-worker2","event":"initialized","class":"none","stage_reached":"","exit_code":0,"restart_count":null,"restart_count_source":"uninitialized","restart_count_obtained_at":"","service_invocation_id":"","terminal":false,"started_at":"","boot_id":""}'
    initial_readiness_record: '{"schema_version":"1.0.0","service":"vllm-worker2","readiness_state":"initialized","process_started_at":"","health_ready_at":null,"model_ready_at":null,"validation_ready_at":null,"startup_duration":null,"model_identity":{"expected":"","observed":""},"tensor_parallel_size":{"expected":1,"observed":null},"boot_id":"","service_invocation_id":"","endpoint":"","probe_note":"record created by role"}'

orchestrator_gateway_enabled: true
orchestrator_gateway_port: 8010
orchestrator_gateway_release_id: t5820-gateway-d3bf4a8
orchestrator_gateway_release_dir: /var/lib/aihost/releases/t5820-gateway-d3bf4a8
orchestrator_gateway_evidence_path: /var/lib/aihost/evidence/t5820-gateway-persistent.jsonl
orchestrator_gateway_workers:
  - worker_id: b0-live-tp1-worker1
    port: 8000
    public_model_id: engineering/b0
    model_id: cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
    revision: 4bd30395b72ea6045edd04806c4fea448d4467b3
