# Model routing. Pools: lead = Qwen3.6-35B-A3B, deep = Flash-Next (best validated accuracy in the bounded
# engineering benchmark at the selected budgets). Aliases bypass the rules.
# Every route carries a finite output policy (Design 02 L2/L3): requests without max_tokens are bounded by it.
# R3: a client's retry (X-AIHost-Attempt >= 2) or a request after a reported failure escalates to deep.
orchestrator_gateway_routes:
  - id: escalate-retry
    match: {attempt_gte: 2}
    pool: deep
    fallback: [lead]
    reasoning: {mode: "on", budget: 4096, answer_allowance: 8192}
  - id: escalate-after-failure
    match: {previous_outcome: [fail]}
    pool: deep
    fallback: [lead]
    reasoning: {mode: "on", budget: 4096, answer_allowance: 8192}
  - id: deep-tasks
    match: {task_class: [review, escalate, architecture, debug-hard]}
    pool: deep
    fallback: [lead]
    reasoning: {mode: "on", budget: 4096, answer_allowance: 8192}
  - id: default
    match: {}
    pool: lead
    fallback: [deep]
    reasoning: {mode: "off", answer_allowance: 8192}
orchestrator_gateway_model_aliases:
  engineering/lead: {pool: lead, reasoning: {mode: "off", answer_allowance: 8192}}
  engineering/deep: {pool: deep, reasoning: {mode: "on", budget: 4096, answer_allowance: 8192}}
# R6 per-client identity. Existing tokens are kept (legacy_token_file) so current clients keep working.
