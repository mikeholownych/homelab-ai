  - {client_id: operator, scopes: [workload, qualification, monitoring, telemetry]}
  - {client_id: qualification, scopes: [qualification], default_priority: batch, max_priority: batch}
  - {client_id: ansible-admin, scopes: [admin, monitoring, telemetry]}
