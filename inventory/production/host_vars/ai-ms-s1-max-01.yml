---
ansible_host: 10.0.8.6
ansible_user: mike
ansible_become: true

platform_release: "26.04"
platform_codename: resolute

hardware_profile: ms_s1_max_strix_halo
os_tuning_profile: baseline

node_metadata:
  environment: production
  hostname: ai-ms-s1-max-01
  hardware_profile: ms_s1_max_strix_halo
  os_tuning_profile: baseline

node_roles:
  inference: true
  gpu: true

capabilities:
  gpu: true
  inference: true
  benchmarking: true
  monitoring: true
  cluster_eligible: true

features:
  monitoring: true
  scheduled_reconciliation: true
  os_tuning: true
  observability: true
  model_registry: false
  clustering: false
  cmdb_export: false
  itsm_integration: false
  ray_enabled: false
  distributed_vllm_enabled: false

users_local_ai_manage_device_groups: true
users_local_ai_device_groups:
  - render
  - video

rocm_install_enabled: true
intel_gpu_install_enabled: false
intel_gpu_physical_validation_enabled: false

# Phase 2d: bake-off winner (research/rocm-strix-halo/evidence/20261121T073429Z/recommendation.md).
# Exactly one engine flag may be true on this host; the others stay unset/false.
# Rootless podman under aihost-runtime: a subordinate id range disjoint from mike's (100000-165535).
users_runtime_rootless_enabled: true
users_runtime_subuid_first: 165536
llama_cpp_hip_enabled: true
llama_cpp_hip_digest: "sha256:9c44da4d33fa3e1250ec910d3af7b7acd1154baef3fe0efda53d91ae4a9f4184"
llama_cpp_hip_drain_via_gateway: false
# Phase 3a: LAN bind for the 5820 gateway (ufw restricts to security_inference_api_cidrs).
llama_cpp_hip_host: "10.0.8.6"
# Phase 3b: a non-loopback bind requires the per-worker key
# (/etc/local-ai/llama-hip/<worker_key>/worker-api-key, generated on first converge).
llama_cpp_hip_api_key_required: true
llama_cpp_hip_workers:
  qwen3_coder_30b_q8:
    service_name: llama-hip-qwen3-coder-30b.service
    container_name: llama-hip-qwen3-coder-30b
    served_name: qwen3-coder-30b-a3b-instruct-q8_0
    port: 8101
    context: 65536
    model_file: Qwen3-Coder-30B-A3B-Instruct-Q8_0.gguf
    model_source: /var/lib/local-ai/models/Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-Q8_0.gguf
    args: ["-ngl", "99", "-fa", "on", "--jinja", "-np", "4"]

# Phase 3c: ROCm-only local gateway (parallel alias engineering/interactive-rocm). The Intel aliases
# engineering/lead and engineering/deep stay on ai-5820-01 and must never be declared here.
orchestrator_gateway_enabled: true
orchestrator_gateway_port: 8010
orchestrator_gateway_host: 127.0.0.1
orchestrator_gateway_local_listener_mode: local
orchestrator_gateway_engine: asgi
orchestrator_gateway_venv_enabled: true
# One production worker (the Intel host declares two).
orchestrator_gateway_production_worker_count: 1
orchestrator_gateway_remote_host: 10.0.8.6
orchestrator_gateway_remote_port: 8443
orchestrator_gateway_tls_sans: [IP:10.0.8.6, DNS:ai-ms-s1-max-01]
orchestrator_gateway_tls_pki_dir: /home/mike/.local/share/aihost/pki/ai-ms-s1-max-01
orchestrator_gateway_tls_ca_key: /home/mike/.local/share/aihost/pki/ai-ms-s1-max-01/gateway-ca.key
orchestrator_gateway_tls_ca_cert: /home/mike/.local/share/aihost/pki/ai-ms-s1-max-01/gateway-ca.crt
orchestrator_gateway_tls_server_key: /home/mike/.local/share/aihost/pki/ai-ms-s1-max-01/gateway-server.key
orchestrator_gateway_tls_server_cert: /home/mike/.local/share/aihost/pki/ai-ms-s1-max-01/gateway-server.crt
orchestrator_gateway_tls_ca_fetch_dest: "{{ playbook_dir }}/../evidence/ai-ms-s1-max-01/gateway-ca.crt"
orchestrator_gateway_tls_server_fetch_dest: "{{ playbook_dir }}/../evidence/ai-ms-s1-max-01/gateway-server.crt"
# The controller OS trust store entry is a single fixed file name owned by the 5820 CA; installing this host's CA
# there would replace it. Clients trust this CA through the published evidence/ai-ms-s1-max-01/gateway-ca.crt.
orchestrator_gateway_tls_controller_trust_store_enabled: false
# Same controller (10.0.8.95) as the 5820 gateway; the matching ufw rule is security_inference_api_port_cidrs below.
orchestrator_gateway_remote_client_cidrs: [10.0.8.95/32]
# Release id names the commit whose gateway code ships here (tests/test_gateway_release_identity.py); the artifact is
# identical to the one deployed on ai-5820-01.
orchestrator_gateway_release_id: ms-s1-gateway-636b7fb44258bc3ad0cf660dd3aabf289cc51e3b
orchestrator_gateway_release_dir: /var/lib/aihost/releases/ms-s1-gateway-636b7fb44258bc3ad0cf660dd3aabf289cc51e3b
# No second worker, no legacy opencode token and no predecessor evidence chains on this host.
orchestrator_gateway_client_token_extra_file: ""
orchestrator_gateway_evidence_predecessors: []
# Model routing: one pool (rocm), one worker. No fallback pool exists on this host.
orchestrator_gateway_routes:
  - id: interactive-rocm
    match: {model: [engineering/interactive-rocm]}
    pool: rocm
    fallback: []
    reasoning: {mode: "off", answer_allowance: 8192}
  - id: default
    match: {}
    pool: rocm
    fallback: []
    reasoning: {mode: "off", answer_allowance: 8192}
orchestrator_gateway_model_aliases:
  engineering/interactive-rocm: {pool: rocm, reasoning: {mode: "off", answer_allowance: 8192}}
# Client tokens are generated by the role into root-only files under /etc/local-ai/orchestrator/clients
# (no Vault records on this host).
orchestrator_gateway_clients:
  - client_id: nexus
    scopes: [workload]
    quota: {requests_per_minute: 60}
  - client_id: opencode
    scopes: [workload]
    quota: {requests_per_minute: 60}
  - client_id: operator
    scopes: [workload, qualification, monitoring]
    quota: {requests_per_minute: 60}
  - client_id: qualification
    scopes: [qualification]
    default_priority: batch
    max_priority: batch
    quota: {requests_per_minute: 60}
  - {client_id: ansible-admin, scopes: [admin, monitoring]}
orchestrator_gateway_workers:
  - worker_id: ms-s1-hip-coder30b
    credential_name: worker-hip-token
    credential_source: /etc/local-ai/llama-hip/qwen3_coder_30b_q8/worker-api-key
    token_file: worker-hip-token
    pool: rocm
    engine: llama.cpp
    port: 8101
    public_model_id: engineering/interactive-rocm
    # Served name of llama_cpp_hip_workers.qwen3_coder_30b_q8; GGUF sha256 and image digest are the Phase 2d bake-off
    # pins (research/rocm-strix-halo/evidence/20261121T073429Z/recommendation.md).
    model_id: qwen3-coder-30b-a3b-instruct-q8_0
    revision: gguf-4ff1cff607804037bf6d2168249c570baa4e1621292b159c0e06591e0d7c3066
    artifact_digest: sha256:4ff1cff607804037bf6d2168249c570baa4e1621292b159c0e06591e0d7c3066
    runtime_image_digest: sha256:9c44da4d33fa3e1250ec910d3af7b7acd1154baef3fe0efda53d91ae4a9f4184
    topology: llama-cpp-hip
    hardware_class: amd-strix-halo-gfx1151
    gpu_assignment: ["0"]
    capabilities: [navigation, coding, structured_output, tool_call_proposal]
    # -c 65536 -np 4: llama.cpp reports 16384 tokens per slot (/props), which the gateway compares to this value.
    context_limit: 16384
    max_concurrency: 4
    resource_envelope: {memory_reserve_gib: 8, memory_available_floor_gib: 8}
    evidence_ids: [rocm-strix-halo-bakeoff-20261121T073429Z]
    registry_version: 1
    measured_at: "2026-11-21T07:34:29+00:00"
    valid_until: "2026-12-31T00:00:00+00:00"
    endpoint: http://10.0.8.6:8101

# Only the 5820 gateway may reach the HIP worker over the LAN; only the controller may reach this gateway.
security_firewall_enabled: true
# SSH is allowed only from the management LAN (the controller and the 5820 gateway host live in 10.0.8.0/24).
security_management_cidrs: ["10.0.8.0/24"]
security_inference_api_firewall_enabled: true
security_inference_api_cidrs: ["10.0.8.5/32"]
security_inference_api_ports: [8101]
security_inference_api_port_cidrs:
  - {port: 8443, cidrs: ["10.0.8.95/32"]}

storage_lvm:
  enabled: true
  vg: ubuntu-vg
  lv: local-ai-lv
  size: 1024g
  fstype: xfs
  mount_path: /var/lib/local-ai
  reserve_gib: 100
  expected_pvs:
    - /dev/nvme0n1p3
