---
schema_version: 1.0.0
profile_name: d5820_dual_b65

platform:
  manufacturer: Dell
  product_family: Precision 5820 Tower
  machine_type_model: "Precision 5820 Tower"
  product_name_patterns:
    - Precision 5820
    - Precision 5820 Tower
    - Precision Tower 5820

cpu:
  vendor: Intel
  model_patterns:
    - Intel(R) Xeon(R) W-2123
    - Intel Xeon W-2123
    - W-2123
  sockets_expected: 1

gpu:
  count_expected: 2
  approved_pci_devices:
    - vendor_id: "8086"
      device_id: e222
      model: Intel Arc Pro B65
      source: Intel Xe KMD supported hardware table
      source_url: https://dgpu-docs.intel.com/overview/supported-hardware/xe-driver-gpus.html
  expected_models:
    - vendor: Intel
      model: Intel Arc Pro B65
      memory_gib:
        approximate: 32
        tolerance_gib: 4
    - vendor: Intel
      model: Intel Arc Pro B65
      memory_gib:
        approximate: 32
        tolerance_gib: 4

pcie:
  host_link:
    # The Arc Pro B65 card is PCIe 5.0-capable; the Precision 5820 (Xeon
    # W-2123, Skylake-W) platform exposes Gen3 root ports. Gen3 x16 per card
    # is the expected full negotiation; Gen5 is informational card capability.
    max_generation: 5
    expected_negotiated_generation: 3
  width_expectations:
    desired_when_slot_supports: x16
    allow_slot_limited_width: true
  material_degradation:
    default_severity: blocking
    minimum_negotiated_to_slot_ratio: 0.5

firmware:
  above_4g_decoding:
    required: true
    missing_severity: blocking
    undiscoverable_status: not_tested
  resizable_bar:
    required: true
    missing_severity: blocking

memory:
  installed_gib:
    expected: 32
    tolerance_gib: 4
    out_of_tolerance_severity: warning
    classification: initial_commissioning

discovery_fields:
  record:
    - dimm_topology
    - nvme_devices
    - nic_inventory
    - bios_version
    - firmware_inventory
    - power_supply_inventory
  asset_identifiers:
    - serial_number
    - asset_tag
    - service_tag

severity_rules:
  information:
    - dimm_topology_observed
    - firmware_inventory_observed
  warning:
    - memory_capacity
    - unexpected_gpu_devices
  blocking:
    - gpu_count
    - gpu_model_match
    - resizable_bar_enabled
    - above_4g_decoding_enabled
    - level_zero_detected
    - pcie_link_health
