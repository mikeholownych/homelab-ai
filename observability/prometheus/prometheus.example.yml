# Example scrape configuration. NOT deployed: nothing on the host runs Prometheus yet.
#
# Both targets are loopback-only on ai-5820-01 by design (gateway 127.0.0.1:8010, node_exporter
# 127.0.0.1:9100). To scrape from another machine, either run Prometheus on the host, tunnel the two ports,
# or widen a bind address deliberately (node_exporter_listen_address + node_exporter_allow_non_loopback, and a
# reverse proxy / firewall rule for the gateway). Do not open them to the LAN by default.
---
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - rules/aihost.rules.yml

scrape_configs:
  - job_name: aihost-gateway          # the alert rules reference this job name
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8010"]
        labels: {host: ai-5820-01}
  - job_name: node                    # node_exporter, including the textfile collector (aihost_gpu_*)
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {host: ai-5820-01}
