      services:
        - ssh
        - scheduled_ansible
        - monitoring
  - id: scheduled_reconciliation
    classification: operations
    severity: information
    applies_when: when_monitoring_enabled
    expected:
      value: true
  - id: vault_access
    classification: access
    severity: blocking
    applies_when: always
    expected:
      type: token_or_approle_reference_available
