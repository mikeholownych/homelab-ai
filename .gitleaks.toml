# gitleaks configuration. Default rules plus a deliberately narrow allowlist.
# Scans run on the working tree only (see .github/workflows/quality.yml), because git history still
# contains credentials that have been removed from HEAD and are being rotated, not rewritten.
title = "homelab-ai gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Known fake fixtures only"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789''',
  '''sk-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789''',
  '''test-gateway-token-not-a-secret''',
  # Literal samples inside the detector's own unit tests (tests/test_no_secrets.py).
  '''abc123notarealsecret''',
  '''hunter2hunter2''',
  # Pre-existing AppRole secret-id detector sample in tests/test_no_secrets.py.
  '''01234567-89ab-cdef''',
]
paths = [
  '''(^|/)\.venv[^/]*/''',
  '''(^|/)\.git/''',
]

# Public integrity data that the generic-api-key rule mistakes for secrets: pinned artifact SHA-256
# digests and the Intel package-signing key fingerprint. Matched on the whole line, rule-scoped.
[[allowlists]]
description = "Pinned SHA-256 digests and public GPG fingerprints"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''_sha256["']?\s*[:=]\s*["']?[0-9a-f]{64}''',
  '''fingerprint["']?\s*[:=]\s*["']?[0-9A-F]{40}''',
]
